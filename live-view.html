<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Live Izin - DDT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Exact current Legacy Dark/Cyber family from dashboard production. */
            --accent: #27d9ef;
            --accent-rgb: 39, 217, 239;
            --accent-strong: #0caec7;
            --accent-soft: rgba(39, 217, 239, .11);
            --theme-glow: rgba(39, 217, 239, .16);

            --bg-primary: #03171e;
            --bg-secondary: #05242d;
            --bg-card: #072d38;
            --bg-hover: #0a3a47;
            --bg-table-header: #041b22;
            --bg-table-header-soft: #05222a;

            --text-primary: #ecfcff;
            --text-secondary: #b8d8de;
            --text-muted: #739ca5;

            --border-color: #174653;
            --border-light: #0d3540;

            --success: #41d89a;
            --success-bg: #0b3b30;
            --danger: #ff7d88;
            --danger-bg: #402128;
            --warning: #ffc267;
            --warning-bg: #402f17;

            --shell-max: 520px;
            --radius-lg: 14px;
            --radius-md: 9px;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        html { background: #021219; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-x: clip;
            color: var(--text-primary);
            background:
                radial-gradient(760px 380px at 50% -150px, rgba(var(--accent-rgb), .11), transparent 68%),
                linear-gradient(180deg, #021219 0%, #03171e 48%, #02141a 100%);
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .container {
            width: min(var(--shell-max), calc(100% - 16px));
            margin: 0 auto;
            padding:
                max(10px, env(safe-area-inset-top))
                0
                max(14px, env(safe-area-inset-bottom));
        }

        /* ========================= BRAND HEADER ========================= */
        .header {
            position: relative;
            min-height: 68px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 10px 11px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, #03242d 0%, #04303a 62%, #043843 100%);
            box-shadow: 0 12px 28px rgba(0, 0, 0, .22);
        }

        .header-left {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left .logo-img {
            display: block;
            width: 88px;
            max-width: 25vw;
            height: 38px;
            flex: 0 0 auto;
            object-fit: contain;
            object-position: left center;
        }

        .header-left .title {
            min-width: 0;
            color: #effdff;
            font-size: 14px;
            font-weight: 760;
            letter-spacing: .018em;
            line-height: 1.14;
            white-space: nowrap;
        }

        .header-left .title small {
            display: block;
            margin-bottom: 4px;
            color: #89edf8;
            font-size: 6.8px;
            font-weight: 760;
            letter-spacing: .14em;
            text-transform: uppercase;
            opacity: .72;
        }

        .header-right {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .clock {
            color: rgba(236, 252, 255, .78);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 11px;
            font-weight: 680;
            font-variant-numeric: tabular-nums;
            letter-spacing: .025em;
            white-space: nowrap;
        }

        .live-badge {
            min-height: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 8px;
            border: 0;
            border-radius: 999px;
            color: #86e8ba;
            background: rgba(11, 59, 48, .62);
            box-shadow: inset 0 0 0 1px rgba(65, 216, 154, .08);
            font-size: 6.8px;
            font-weight: 820;
            letter-spacing: .09em;
            white-space: nowrap;
        }

        .live-badge .dot,
        .status-cell .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .live-badge[data-status="online"] .dot,
        .status-cell .dot {
            animation: pulse-dot 1.9s ease-in-out infinite;
        }

        .live-badge[data-status="connecting"] {
            color: var(--warning);
            background: rgba(64, 47, 23, .66);
            box-shadow: inset 0 0 0 1px rgba(255, 194, 103, .08);
        }
        .live-badge[data-status="connecting"] .dot { background: var(--warning); }

        .live-badge[data-status="offline"] {
            color: #ff9ca4;
            background: rgba(64, 33, 40, .68);
            box-shadow: inset 0 0 0 1px rgba(255, 125, 136, .08);
        }
        .live-badge[data-status="offline"] .dot { background: var(--danger); animation: none; }

        /* ========================= OPERATIONS PLANE ========================= */
        .workspace-plane {
            position: relative;
            margin-top: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            box-shadow: 0 14px 34px rgba(0, 0, 0, .22);
        }

        .workspace-datum {
            min-height: 33px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 11px;
            border-bottom: 1px solid var(--border-light);
            background: linear-gradient(90deg, #03212a 0%, #052c36 100%);
            color: var(--text-muted);
            font-size: 6.8px;
            font-weight: 760;
            letter-spacing: .11em;
            text-transform: uppercase;
        }

        .datum-index {
            color: var(--accent);
            white-space: nowrap;
        }

        .datum-rule {
            flex: 1 1 auto;
            height: 0;
        }

        .datum-title { white-space: nowrap; }

        .datum-sync {
            color: #6f9da6;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 6.4px;
            font-variant-numeric: tabular-nums;
            letter-spacing: .04em;
            white-space: nowrap;
        }

        /* ========================= LIVE SUMMARY ========================= */
        .online-count {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            min-height: 106px;
            border-bottom: 1px solid var(--border-light);
            background: linear-gradient(90deg, #052b35 0%, #06303a 48%, #05262f 100%);
        }

        .number-wrap {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 15px 14px 14px;
        }

        .online-count .number {
            display: flex;
            align-items: baseline;
            gap: 8px;
            color: #7ee9f5;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 38px;
            font-weight: 820;
            line-height: .92;
            font-variant-numeric: tabular-nums;
            letter-spacing: -.035em;
        }

        .online-count .unit {
            color: rgba(126, 233, 245, .54);
            font-size: 7.2px;
            font-weight: 820;
            letter-spacing: .12em;
        }

        .online-count .label {
            margin-top: 8px;
            color: #b7d5da;
            font-size: 8.5px;
            font-weight: 720;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .online-count .label .highlight {
            margin-right: 5px;
            color: var(--success);
        }

        .status-dots { display: none; }

        .summary-meta {
            min-width: 118px;
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
            padding: 8px;
            background: rgba(3, 23, 30, .16);
        }

        .summary-meta-item {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            padding: 8px 9px;
            border-radius: 7px;
            background: rgba(7, 45, 55, .46);
            box-shadow: inset 0 0 0 1px rgba(127, 214, 227, .055);
        }

        .summary-meta-item + .summary-meta-item {
            border-top: 0;
        }

        .summary-meta-item span {
            color: rgba(184, 216, 222, .56);
            font-size: 6.2px;
            font-weight: 780;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .summary-meta-item strong {
            margin-top: 4px;
            color: #d6eef2;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 10px;
            font-weight: 780;
            font-variant-numeric: tabular-nums;
            letter-spacing: .015em;
        }

        /* ========================= LIVE TABLE ========================= */
        .table-wrap {
            position: relative;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
            background: var(--bg-primary);
        }

        .table-wrap::-webkit-scrollbar { display: none; }

        table {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            border-collapse: collapse;
            table-layout: fixed;
        }

        thead th {
            height: 32px;
            max-width: 0;
            padding: 0 8px;
            overflow: hidden;
            text-align: left;
            color: #789ca4;
            background: #041b22;
            border-bottom: 1px solid #10343d;
            font-size: 7.1px;
            font-weight: 780;
            letter-spacing: .09em;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
        }

        thead th.col-durasi { color: #95b9c0; }

        tbody td {
            height: 44px;
            max-width: 0;
            padding: 5px 8px;
            overflow: hidden;
            border-bottom: 1px solid #0b3039;
            color: var(--text-primary);
            background: #03171e;
            vertical-align: middle;
        }

        tbody tr:nth-child(even) td { background: #04191f; }
        tbody tr:last-child td { border-bottom: 0; }

        .name-status {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .name-status-dot {
            width: 6px;
            height: 6px;
            flex: 0 0 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 3px rgba(65, 216, 154, .055);
            animation: pulse-dot 1.9s ease-in-out infinite;
        }

        .nama-cell {
            min-width: 0;
            display: block;
            overflow: hidden;
            color: #eaf9fb;
            font-size: 9.8px;
            font-weight: 730;
            letter-spacing: .012em;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* V22 compact/matte Legacy role language. */
        .role-tag {
            display: inline-block;
            max-width: 100%;
            padding: 4px 8px;
            overflow: hidden;
            border: 1px solid transparent;
            border-radius: 7px;
            font-size: 8px;
            font-weight: 750;
            letter-spacing: .035em;
            line-height: 1;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .role-tag.leader { background:#171f2b; color:#f0cf78; border-color:#65562b; }
        .role-tag.admin { background:#3a1a1a; color:#ff9b9b; border-color:#704040; }
        .role-tag.csline { background:#123f2f; color:#8ee0ae; border-color:#2b6f53; }
        .role-tag.cs { background:#142f4a; color:#9ec7f7; border-color:#31587f; }
        .role-tag.kapten { background:#423019; color:#f0c47d; border-color:#72532d; }
        .role-tag.kasir { background:#2d2348; color:#c9b5f5; border-color:#5a4780; }


        .timer-cell {
            display: block;
            color: #73e4b2;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 11.5px;
            font-weight: 780;
            letter-spacing: .005em;
            line-height: 1;
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .timer-cell.over-limit {
            color: #ff939c;
            font-weight: 820;
        }

        .empty-state,
        .loading-spinner {
            padding: 30px 16px;
            color: var(--text-muted);
            text-align: center;
            font-size: 9px;
        }

        .empty-state .icon { display: none; }

        .empty-state h3 {
            color: #759ba4;
            font-size: 9.5px;
            font-weight: 620;
            line-height: 1.5;
        }

        .loading-spinner .spinner {
            width: 20px;
            height: 20px;
            margin: 0 auto 9px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        /* ========================= FOOTER ========================= */
        .footer {
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 0 10px;
            color: #668892;
            font-size: 6.4px;
            font-weight: 700;
            letter-spacing: .075em;
            text-transform: uppercase;
        }

        .footer strong { color: #7aa4ad; }
        .footer-system { white-space: nowrap; }

        .col-nama { width: 43%; }
        .col-role { width: 25%; }
        .col-durasi { width: 32%; text-align: right; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .48; transform: scale(.78); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(2px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 390px) {
            .container {
                width: calc(100% - 12px);
                padding-top: max(7px, env(safe-area-inset-top));
            }
            .header { min-height: 64px; padding: 8px 9px; }
            .header-left { gap: 8px; }
            .header-left .logo-img { width: 76px; height: 32px; }
            .header-left .title { font-size: 12.5px; }
            .header-left .title small { font-size: 6.1px; }
            .clock { font-size: 9.8px; }
            .live-badge { min-height: 19px; padding: 3px 6px; font-size: 6.1px; }

            .workspace-datum { gap: 6px; padding: 0 8px; font-size: 6.1px; }
            .datum-title { display: none; }
            .datum-sync { font-size: 5.9px; }

            .online-count { min-height: 96px; }
            .number-wrap { padding: 13px 10px; }
            .online-count .number { font-size: 33px; }
            .online-count .label { font-size: 7.9px; }
            .summary-meta { min-width: 100px; }
            .summary-meta-item { padding: 8px; }

            thead th { padding: 0 6px; font-size: 6.6px; }
            tbody td { height: 43px; padding: 5px 6px; }
            .nama-cell { font-size: 8.8px; }
            .role-tag { padding: 4px 6px; font-size: 7.2px; }
            .timer-cell { font-size: 11px; }

            .col-nama { width: 43%; }
            .col-role { width: 24%; }
            .col-durasi { width: 33%; }
        }

        @media (max-width: 340px) {
            .container { width: calc(100% - 10px); }
            .header { min-height: 60px; }
            .header-left .logo-img { width: 66px; height: 29px; }
            .header-left .title { font-size: 11.2px; }
            .header-left .title small { display: none; }
            .clock { font-size: 9px; }
            .live-badge { gap: 4px; }

            .datum-sync { display: none; }
            .online-count .number { font-size: 29px; }
            .summary-meta { min-width: 88px; }
            .summary-meta-item strong { font-size: 9px; }

            thead th,
            tbody td { padding-left: 5px; padding-right: 5px; }
            .nama-cell { font-size: 8.2px; }
            .role-tag { padding-left: 5px; padding-right: 5px; font-size: 6.8px; }
            .timer-cell { font-size: 10.4px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="header">
            <div class="header-left">
                <img src="https://dashboard-izin.pages.dev/assets/Logo%20DDT%20-%20Full.png" alt="DDT" class="logo-img" width="176" height="76" decoding="async" fetchpriority="high" />
                <div class="title">
                    <small>DDT / Live Operations</small>
                    LIVE IZIN
                </div>
            </div>
            <div class="header-right">
                <div class="clock" id="clockDisplay">--:--:--</div>
                <div class="live-badge" data-status="connecting">
                    <span class="dot" aria-hidden="true"></span>
                    <span id="liveStatusLabel">CONNECTING</span>
                </div>
            </div>
        </header>

        <main class="workspace-plane">
            <div class="workspace-datum">
                <span class="datum-index">PERMIT / LIVE</span>
                <span class="datum-rule" aria-hidden="true"></span>
                <span class="datum-title">Real-time Monitoring</span>
                <span class="datum-sync" id="lastSyncDisplay">SYNC —</span>
            </div>

            <section class="online-count" id="onlineCount" aria-label="Ringkasan izin aktif">
                <div class="number-wrap">
                    <div class="number">
                        <span id="totalOnline">0</span><span class="unit">ACTIVE</span>
                    </div>
                    <div class="label">
                        <span class="highlight">●</span>Sedang Izin
                    </div>
                    <div class="status-dots" id="statusDots" aria-hidden="true"></div>
                </div>
                <div class="summary-meta">
                    <div class="summary-meta-item">
                        <span>Threshold</span>
                        <strong id="permitLimitDisplay">15 MIN</strong>
                    </div>
                    <div class="summary-meta-item">
                        <span>Source</span>
                        <strong>REALTIME</strong>
                    </div>
                </div>
            </section>

            <div class="table-wrap">
                <table aria-label="Daftar anggota yang sedang izin">
                    <thead>
                        <tr>
                            <th class="col-nama">Nama</th>
                            <th class="col-role">Role</th>
                            <th class="col-durasi">Durasi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="3">
                                <div class="loading-spinner">
                                    <div class="spinner" aria-hidden="true"></div>
                                    <span>Memuat data izin</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer class="footer">
            <span>© 2026 <strong>DDT Team</strong></span>
            <span class="footer-system">Secure Public Feed</span>
        </footer>
    </div>

    <!-- ============================================================ -->
    <!-- SUPABASE CLIENT -->
    <!-- ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script>

        (function() {
            'use strict';

            console.log('🚀 Live View - Starting...');

            // ============================================================
            // KONFIGURASI SUPABASE BARU
            // ============================================================
            var SUPABASE_URL = 'https://vnmdtmlrfecremloqlmz.supabase.co';
            var SUPABASE_ANON_KEY = 'sb_publishable_VJdyDKMe_g-YL2BlYBuLCg_xm5RrSQ1';

            var supabaseClient = window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY,
                {
                    auth: {
                        persistSession: false,
                        autoRefreshToken: false,
                        detectSessionInUrl: false
                    }
                }
            );

            // ============================================================
            // STATE
            // ============================================================
            var izinData = {};
            var jackpotLimitMinutes = 15;
            var realtimeChannel = null;
            var lastSuccessfulLoad = 0;
            var refreshInProgress = false;

            // Query fallback dibuat jarang karena update utama memakai Realtime.
            // Realtime tetap primary. Snapshot 60 detik hanya reconciliation saat halaman visible.
            var FALLBACK_REFRESH_MS = 60 * 1000;
            var SETTINGS_REFRESH_MS = 30 * 60 * 1000;
            var realtimeReconnectTimer = null;
            var realtimeResetInProgress = false;

            // ============================================================
            // ROLE ORDER UNTUK SORTING
            // ============================================================
            var ROLE_ORDER = {
                leader: 0,
                admin: 1,
                csline: 2,
                cs: 3,
                kapten: 4,
                kasir: 5
            };

            var ROLE_LABELS = {
                leader: 'Leader',
                admin: 'Admin',
                csline: 'CS Line',
                cs: 'CS',
                kapten: 'Kapten',
                kasir: 'Kasir'
            };


            // ============================================================
            // UTILITAS
            // ============================================================
            function escapeHtml(value) {
                return String(value || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function normalizeName(name) {
                return String(name || '').trim().toUpperCase();
            }

            function parseTimestamp(value) {
                if (!value) return null;
                var date = new Date(value);
                return isNaN(date.getTime()) ? null : date;
            }

            function setLiveStatus(status, label) {
                var badge = document.querySelector('.live-badge');
                var labelEl = document.getElementById('liveStatusLabel');
                if (!badge) return;

                badge.setAttribute('data-status', status || 'offline');
                if (labelEl) labelEl.textContent = label || 'OFFLINE';
            }

            function markSync() {
                var el = document.getElementById('lastSyncDisplay');
                if (!el) return;
                var now = new Date();
                el.textContent = 'SYNC ' +
                    String(now.getHours()).padStart(2, '0') + ':' +
                    String(now.getMinutes()).padStart(2, '0') + ':' +
                    String(now.getSeconds()).padStart(2, '0');
            }

            function showLoadError(message) {
                var tbody = document.getElementById('tableBody');
                if (!tbody) return;

                tbody.innerHTML = `
                    <tr>
                        <td colspan="3">
                            <div class="empty-state">
                                <div class="icon">⚠️</div>
                                <h3>${escapeHtml(message)}</h3>
                            </div>
                        </td>
                    </tr>
                `;
            }

            // ============================================================
            // LOAD SETTING BATAS IZIN
            // ============================================================
            async function loadPublicSettings() {
                try {
                    var result = await supabaseClient
                        .from('settings')
                        .select('value')
                        .eq('key', 'izin_settings')
                        .maybeSingle();

                    if (result.error) {
                        console.warn('⚠️ Setting izin tidak terbaca, memakai default 15 menit:', result.error.message);
                        return;
                    }

                    if (!result.data || !result.data.value) return;

                    var parsed = JSON.parse(result.data.value);
                    var newLimit = Number(parsed.jackpotLimitMinutes);

                    if (Number.isFinite(newLimit) && newLimit > 0) {
                        jackpotLimitMinutes = newLimit;
                        var limitDisplay = document.getElementById('permitLimitDisplay');
                        if (limitDisplay) limitDisplay.textContent = String(newLimit) + ' MIN';
                        updateTimers();
                    }
                } catch (error) {
                    console.warn('⚠️ Gagal memuat setting izin:', error);
                }
            }

            // ============================================================
            // LOAD DATA IZIN PUBLIK
            // ============================================================
            async function loadPublicData(force) {
                if (refreshInProgress) return;

                var now = Date.now();
                if (!force && lastSuccessfulLoad && (now - lastSuccessfulLoad) < 15000) {
                    return;
                }

                refreshInProgress = true;

                try {
                    console.log('📥 Loading live izin...');

                    var result = await supabaseClient
                        .from('izin_anggota')
                        .select('nama,role,mulai,status')
                        .eq('status', 'izin')
                        .not('mulai', 'is', null)
                        .order('mulai', { ascending: true })
                        .limit(100);

                    if (result.error) {
                        throw result.error;
                    }

                    izinData = {};

                    (result.data || []).forEach(function(item) {
                        var key = normalizeName(item.nama);
                        if (!key) return;

                        izinData[key] = {
                            nama: item.nama,
                            role: item.role || 'cs',
                            mulai: item.mulai
                        };
                    });

                    lastSuccessfulLoad = Date.now();
                    renderTable();
                    updateOnlineCount();
                    markSync();
                    setLiveStatus('online', 'LIVE');

                    console.log('✅ ' + Object.keys(izinData).length + ' anggota sedang izin');
                } catch (error) {
                    console.error('❌ Gagal mengambil live izin:', error);
                    setLiveStatus('offline', 'OFFLINE');

                    if (!lastSuccessfulLoad) {
                        showLoadError(
                            'Data belum dapat dibaca. Jalankan SQL akses Live View di Supabase.'
                        );
                    }
                } finally {
                    refreshInProgress = false;
                }
            }

            // ============================================================
            // REALTIME
            // ============================================================
            function applyRealtimePayload(payload) {
                var oldRow = payload.old || {};
                var newRow = payload.new || {};
                var oldKey = oldRow.nama ? normalizeName(oldRow.nama) : '';
                var newKey = newRow.nama ? normalizeName(newRow.nama) : '';

                // Hapus kedua kemungkinan key lebih dulu. Ini menutup stale row saat
                // nama/status berubah dan old record dari logical replication terbatas.
                if (oldKey) delete izinData[oldKey];
                if (newKey) delete izinData[newKey];

                if (
                    payload.eventType !== 'DELETE' &&
                    newRow.nama &&
                    newRow.status === 'izin' &&
                    newRow.mulai
                ) {
                    izinData[newKey] = {
                        nama: newRow.nama,
                        role: newRow.role || 'cs',
                        mulai: newRow.mulai
                    };
                }

                renderTable();
                updateOnlineCount();
                markSync();
            }

            function scheduleRealtimeReconnect() {
                if (realtimeReconnectTimer || realtimeResetInProgress) return;

                realtimeReconnectTimer = setTimeout(async function() {
                    realtimeReconnectTimer = null;
                    realtimeResetInProgress = true;

                    var staleChannel = realtimeChannel;
                    realtimeChannel = null;

                    if (staleChannel) {
                        try {
                            await supabaseClient.removeChannel(staleChannel);
                        } catch (error) {
                            console.warn('⚠️ Gagal membersihkan channel Realtime lama:', error);
                        }
                    }

                    realtimeResetInProgress = false;
                    subscribeRealtime();

                    if (document.visibilityState === 'visible') {
                        loadPublicData(true);
                    }
                }, 2500);
            }

            function subscribeRealtime() {
                if (realtimeChannel || realtimeResetInProgress) return;

                setLiveStatus('connecting', 'CONNECTING');

                realtimeChannel = supabaseClient
                    .channel('public-live-izin')
                    .on(
                        'postgres_changes',
                        {
                            event: '*',
                            schema: 'public',
                            table: 'izin_anggota'
                        },
                        function(payload) {
                            applyRealtimePayload(payload);
                        }
                    )
                    .subscribe(function(status) {
                        if (status === 'SUBSCRIBED') {
                            setLiveStatus('online', 'LIVE');
                            console.log('✅ Realtime connected');
                        } else if (
                            status === 'CHANNEL_ERROR' ||
                            status === 'TIMED_OUT' ||
                            status === 'CLOSED'
                        ) {
                            setLiveStatus('offline', 'OFFLINE');
                            console.warn('⚠️ Realtime status:', status);
                            scheduleRealtimeReconnect();
                        }
                    });
            }

            // ============================================================
            // RENDER TABLE
            // ============================================================
            function renderTable() {
                var tbody = document.getElementById('tableBody');
                var onlineUsers = Object.keys(izinData)
                    .map(function(key) {
                        return izinData[key];
                    })
                    .sort(function(a, b) {
                        var orderA = ROLE_ORDER[a.role] !== undefined ? ROLE_ORDER[a.role] : 99;
                        var orderB = ROLE_ORDER[b.role] !== undefined ? ROLE_ORDER[b.role] : 99;

                        if (orderA !== orderB) return orderA - orderB;
                        return normalizeName(a.nama).localeCompare(normalizeName(b.nama));
                    });

                if (onlineUsers.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="3">
                                <div class="empty-state">
                                    <div class="icon">😴</div>
                                    <h3>Belum ada yang izin</h3>
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }

                var now = Date.now();
                var batasDetik = jackpotLimitMinutes * 60;
                var html = '';

                onlineUsers.forEach(function(user, index) {
                    var startTime = parseTimestamp(user.mulai);
                    var diff = startTime
                        ? Math.max(0, Math.floor((now - startTime.getTime()) / 1000))
                        : 0;

                    var menit = Math.floor(diff / 60);
                    var detik = diff % 60;
                    var isOverLimit = diff >= batasDetik;
                    var role = user.role || 'cs';
                    var roleLabel = ROLE_LABELS[role] || role;
                    var timerClass = isOverLimit ? 'over-limit' : '';
                    var delay = index * 0.06;
                    var safeName = escapeHtml(user.nama);
                    var safeRole = escapeHtml(role);

                    html += `
                        <tr style="animation: fadeIn 0.25s ease ${delay}s both;">
                            <td class="col-nama">
                                <span class="name-status">
                                    <span class="name-status-dot" aria-hidden="true"></span>
                                    <span class="nama-cell">${safeName}</span>
                                </span>
                            </td>
                            <td class="col-role">
                                <span class="role-tag ${safeRole}">${escapeHtml(roleLabel)}</span>
                            </td>
                            <td class="col-durasi">
                                <span
                                    class="timer-cell ${timerClass}"
                                    data-nama="${escapeHtml(normalizeName(user.nama))}"
                                >${menit}m ${String(detik).padStart(2, '0')}s</span>
                            </td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;
            }

            // ============================================================
            // UPDATE ONLINE COUNT
            // ============================================================
            function updateOnlineCount() {
                var online = Object.keys(izinData).length;
                document.getElementById('totalOnline').textContent = online;
            }

            // ============================================================
            // UPDATE TIMER LOKAL (TIDAK QUERY DATABASE)
            // ============================================================
            function updateTimers() {
                var timerCells = document.querySelectorAll('.timer-cell');
                var now = Date.now();
                var batasDetik = jackpotLimitMinutes * 60;

                timerCells.forEach(function(el) {
                    var key = el.getAttribute('data-nama');
                    var data = izinData[key];
                    if (!data || !data.mulai) return;

                    var startTime = parseTimestamp(data.mulai);
                    if (!startTime) return;

                    var diff = Math.max(0, Math.floor((now - startTime.getTime()) / 1000));
                    var menit = Math.floor(diff / 60);
                    var detik = diff % 60;
                    var isOverLimit = diff >= batasDetik;

                    el.textContent = menit + 'm ' + String(detik).padStart(2, '0') + 's';
                    el.className = 'timer-cell' + (isOverLimit ? ' over-limit' : '');
                });
            }

            // ============================================================
            // CLOCK
            // ============================================================
            function updateClock() {
                var now = new Date();
                var hours = String(now.getHours()).padStart(2, '0');
                var minutes = String(now.getMinutes()).padStart(2, '0');
                var seconds = String(now.getSeconds()).padStart(2, '0');

                document.getElementById('clockDisplay').textContent =
                    hours + ':' + minutes + ':' + seconds;
            }

            function startClock() {
                updateClock();
            }

            // ============================================================
            // INIT
            // ============================================================
            document.addEventListener('DOMContentLoaded', function() {
                console.log('🚀 Live View - DOM Ready');

                startClock();
                loadPublicSettings();
                loadPublicData(true);
                subscribeRealtime();

                // Satu heartbeat UI untuk clock + timer; tidak bekerja saat tab tersembunyi.
                setInterval(function() {
                    if (document.visibilityState === 'visible') {
                        updateClock();
                        updateTimers();
                    }
                }, 1000);
                setInterval(function() {
                    if (document.visibilityState === 'visible') {
                        loadPublicData(true);
                    }
                }, FALLBACK_REFRESH_MS);
                setInterval(function() {
                    if (document.visibilityState === 'visible') {
                        loadPublicSettings();
                    }
                }, SETTINGS_REFRESH_MS);

                document.addEventListener('visibilitychange', function() {
                    if (document.visibilityState === 'visible') {
                        updateClock();
                        updateTimers();
                        if (Date.now() - lastSuccessfulLoad > 60000) {
                            loadPublicData(true);
                        }
                    }
                });

                window.addEventListener('online', function() {
                    if (document.visibilityState === 'visible') {
                        loadPublicData(true);
                    }
                    scheduleRealtimeReconnect();
                });

                window.addEventListener('offline', function() {
                    setLiveStatus('offline', 'OFFLINE');
                });
            });

            window.addEventListener('beforeunload', function() {
                if (realtimeReconnectTimer) {
                    clearTimeout(realtimeReconnectTimer);
                    realtimeReconnectTimer = null;
                }
                if (realtimeChannel) {
                    supabaseClient.removeChannel(realtimeChannel);
                    realtimeChannel = null;
                }
            });
        })();

    </script>

</body>
</html>
