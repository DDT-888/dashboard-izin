<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Live Izin - DDT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
            padding-top: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: linear-gradient(145deg, #0d1230, #1a0a2e);
            border-radius: 20px;
            padding: 20px 18px 30px;
            border: 1px solid rgba(0, 229, 255, 0.06);
            box-shadow: 0 0 60px rgba(0, 229, 255, 0.02);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #00e5ff, #00e676, #00e5ff);
            background-size: 200% 100%;
            animation: shimmer-line 3s ease-in-out infinite;
        }

        @keyframes shimmer-line {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* ========== HEADER ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left .logo {
            font-size: 24px;
        }

        .header-left .title {
            color: #00e5ff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-left .title small {
            font-weight: 300;
            font-size: 10px;
            color: rgba(0, 229, 255, 0.25);
            display: block;
            letter-spacing: 0.3px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 230, 118, 0.08);
            border: 1px solid rgba(0, 230, 118, 0.12);
            padding: 3px 12px 3px 8px;
            border-radius: 16px;
            font-size: 9px;
            color: #00e676;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .live-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00e676;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        .clock {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: rgba(0, 229, 255, 0.3);
            background: rgba(0, 229, 255, 0.03);
            padding: 3px 10px;
            border-radius: 10px;
            border: 1px solid rgba(0, 229, 255, 0.03);
            white-space: nowrap;
        }

        /* ========== ONLINE COUNT - PREMIUM ========== */
        .online-count {
            text-align: center;
            padding: 20px 16px 18px;
            margin-bottom: 16px;
            background: radial-gradient(ellipse at center, rgba(0, 229, 255, 0.04) 0%, transparent 70%);
            border-radius: 16px;
            border: 1px solid rgba(0, 229, 255, 0.04);
            position: relative;
            overflow: hidden;
        }

        .online-count::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.03) 0%, transparent 60%);
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .online-count .number-wrap {
            position: relative;
            z-index: 1;
        }

        .online-count .number {
            font-size: 48px;
            font-weight: 800;
            color: #00e676;
            font-family: 'Courier New', monospace;
            line-height: 1;
            text-shadow: 0 0 40px rgba(0, 230, 118, 0.15);
        }

        .online-count .number .unit {
            font-size: 20px;
            font-weight: 400;
            color: rgba(0, 230, 118, 0.4);
            margin-left: 2px;
        }

        .online-count .label {
            font-size: 12px;
            color: rgba(0, 229, 255, 0.25);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }

        .online-count .label .highlight {
            color: rgba(0, 229, 255, 0.4);
            font-weight: 600;
        }

        .online-count .status-dots {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 10px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .online-count .status-dots .dot-item {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(0, 230, 118, 0.06);
            border: 1px solid rgba(0, 230, 118, 0.04);
            transition: 0.3s;
        }

        .online-count .status-dots .dot-item.active {
            background: #00e676;
            box-shadow: 0 0 16px rgba(0, 230, 118, 0.25);
            border-color: rgba(0, 230, 118, 0.3);
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        /* ========== TABLE ========== */
        .table-wrap {
            background: rgba(0, 229, 255, 0.01);
            border-radius: 12px;
            border: 1px solid rgba(0, 229, 255, 0.03);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        thead th {
            padding: 10px 12px;
            text-align: left;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(0, 229, 255, 0.15);
            border-bottom: 1px solid rgba(0, 229, 255, 0.03);
        }

        tbody td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(0, 229, 255, 0.02);
            color: rgba(255, 255, 255, 0.6);
            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .nama-cell {
            font-weight: 600;
            color: #00e5ff;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.3px;
        }

        .role-tag {
            font-size: 8px;
            padding: 2px 10px;
            border-radius: 8px;
            display: inline-block;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .role-tag.leader {
            background: rgba(0, 229, 255, 0.10);
            color: #00e5ff;
        }
        .role-tag.csline {
            background: rgba(255, 152, 0, 0.10);
            color: #ff9800;
        }
        .role-tag.cs {
            background: rgba(33, 150, 243, 0.10);
            color: #2196f3;
        }
        .role-tag.kapten {
            background: rgba(156, 39, 176, 0.10);
            color: #ab47bc;
        }
        .role-tag.kasir {
            background: rgba(0, 188, 212, 0.10);
            color: #00bcd4;
        }

        .timer-cell {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-weight: 600;
            color: #00e676;
            text-align: right;
            display: block;
        }

        .timer-cell.over-limit {
            color: #ff6b6b;
            animation: blink 0.8s infinite;
        }

        .status-cell {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            font-weight: 500;
            color: #00e676;
        }

        .status-cell .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #00e676;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: rgba(255, 255, 255, 0.1);
        }

        .empty-state .icon {
            font-size: 36px;
            margin-bottom: 6px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-weight: 400;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.08);
        }

        /* ========== FOOTER ========== */
        .footer {
            margin-top: 16px;
            text-align: center;
            font-size: 9px;
            color: rgba(0, 229, 255, 0.05);
            letter-spacing: 0.5px;
        }

        .footer strong {
            color: rgba(0, 229, 255, 0.08);
        }

        .loading-spinner {
            text-align: center;
            padding: 20px;
            color: rgba(0, 229, 255, 0.1);
        }

        .loading-spinner .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(0, 229, 255, 0.05);
            border-top: 2px solid #00e5ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse-dot {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(0.7);
                opacity: 0.6;
            }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 400px) {
            body {
                padding: 8px;
                padding-top: 14px;
            }
            .container {
                padding: 14px 12px 20px;
                border-radius: 16px;
            }
            .header-left .logo {
                font-size: 20px;
            }
            .header-left .title {
                font-size: 14px;
            }
            .header-left .title small {
                font-size: 9px;
            }
            .online-count .number {
                font-size: 38px;
            }
            .online-count .number .unit {
                font-size: 16px;
            }
            .online-count {
                padding: 14px 12px 12px;
            }
            table {
                font-size: 11px;
            }
            thead th, tbody td {
                padding: 8px 10px;
            }
            .nama-cell {
                font-size: 10px;
            }
            .timer-cell {
                font-size: 11px;
            }
            .clock {
                font-size: 10px;
                padding: 2px 8px;
            }
            .live-badge {
                font-size: 8px;
                padding: 2px 10px 2px 6px;
            }
            .online-count .status-dots .dot-item {
                width: 8px;
                height: 8px;
            }
        }

        @media (max-width: 350px) {
            .container {
                padding: 10px 8px 16px;
                border-radius: 12px;
            }
            .header-left .title {
                font-size: 12px;
            }
            .online-count .number {
                font-size: 32px;
            }
            .online-count .number .unit {
                font-size: 14px;
            }
            thead th, tbody td {
                padding: 6px 8px;
                font-size: 10px;
            }
            .nama-cell {
                font-size: 9px;
            }
            .timer-cell {
                font-size: 10px;
            }
            .role-tag {
                font-size: 7px;
                padding: 1px 6px;
            }
            .online-count .status-dots .dot-item {
                width: 6px;
                height: 6px;
            }
        }

        .col-status { width: 15%; }
        .col-nama { width: 38%; }
        .col-role { width: 27%; }
        .col-durasi { width: 20%; text-align: right; }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <span class="logo">📡</span>
                <div class="title">
                    LIVE IZIN
                    <small>Real-time Monitoring</small>
                </div>
            </div>
            <div class="header-right">
                <div class="clock" id="clockDisplay">--:--:--</div>
                <div class="live-badge">
                    <span class="dot"></span>
                    LIVE
                </div>
            </div>
        </div>

        <!-- ONLINE COUNT - PREMIUM -->
        <div class="online-count" id="onlineCount">
            <div class="number-wrap">
                <div class="number">
                    <span id="totalOnline">0</span><span class="unit"> org</span>
                </div>
            </div>
            <div class="label">
                <span class="highlight">●</span> Sedang Izin
            </div>
            <div class="status-dots" id="statusDots">
                <!-- Dots akan di-generate oleh JS (8 dots) -->
            </div>
        </div>

        <!-- TABLE -->
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th class="col-status">Status</th>
                        <th class="col-nama">Nama</th>
                        <th class="col-role">Role</th>
                        <th class="col-durasi">Durasi</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="4">
                            <div class="loading-spinner">
                                <div class="spinner"></div>
                                <span>Memuat data...</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            © 2026 <strong>DDT Team</strong> • Real-time
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- SUPABASE CLIENT -->
    <!-- ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script>
        (function() {
            'use strict';

            console.log('🚀 Live View - Starting...');

            // ============================================================
            // KONFIGURASI SUPABASE
            // ============================================================
            var SUPABASE_URL = 'https://kdmxjficzigsumvcsrtn.supabase.co';
            var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkbXhqZmljemlnc3VtdmNzcnRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTI4MDAsImV4cCI6MjA5ODg4ODgwMH0.LTh93wC11NeydKGlrkxSreaSTQFq5KiidWisQ09CqnM';

            var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            // ============================================================
            // STATE
            // ============================================================
            var listUsers = [];
            var izinData = {};
            var voucherData = {};
            var jackpotLimitMinutes = 15;

            // ============================================================
            // ROLE ORDER UNTUK SORTING
            // ============================================================
            var ROLE_ORDER = {
                leader: 0,
                csline: 1,
                cs: 2,
                kapten: 3,
                kasir: 4
            };

            // ============================================================
            // FORMAT UTILITY
            // ============================================================
            function formatName(name) {
                return name ? name.toUpperCase() : '';
            }

            // ============================================================
            // LOAD DATA
            // ============================================================
            async function loadPublicData() {
                try {
                    console.log('📥 Loading data...');

                    var usersResult = await supabase.from('users').select('*');
                    if (usersResult.error) {
                        console.error('❌ Users error:', usersResult.error);
                    } else {
                        listUsers = usersResult.data || [];
                        console.log('✅ ' + listUsers.length + ' users loaded');
                    }

                    var voucherResult = await supabase.from('vouchers').select('*');
                    if (voucherResult.error) {
                        console.error('❌ Voucher error:', voucherResult.error);
                    } else {
                        voucherData = {};
                        (voucherResult.data || []).forEach(function(v) {
                            voucherData[v.nama] = v.jumlah || 0;
                        });
                        console.log('✅ ' + (voucherResult.data || []).length + ' voucher loaded');
                    }

                    var izinResult = await supabase.from('izin_anggota').select('*').eq('status', 'izin');
                    if (izinResult.error) {
                        console.error('❌ Izin error:', izinResult.error);
                    } else {
                        izinData = {};
                        (izinResult.data || []).forEach(function(item) {
                            izinData[item.nama] = {
                                mulai: item.mulai,
                                role: item.role
                            };
                        });
                        console.log('✅ ' + (izinResult.data || []).length + ' users sedang izin');
                    }

                    var settingsResult = await supabase.from('settings').select('*').eq('key', 'izin_settings')
                        .maybeSingle();
                    if (!settingsResult.error && settingsResult.data) {
                        try {
                            var parsed = JSON.parse(settingsResult.data.value);
                            if (parsed.jackpotLimitMinutes) {
                                jackpotLimitMinutes = parsed.jackpotLimitMinutes;
                            }
                        } catch (e) {}
                    }

                    renderTable();
                    updateOnlineCount();
                    console.log('✅ Data loaded!');

                } catch (err) {
                    console.error('❌ Error:', err);
                }
            }

            // ============================================================
            // RENDER TABLE - DENGAN SORTING BERDASARKAN ROLE
            // ============================================================
            function renderTable() {
                var tbody = document.getElementById('tableBody');

                var onlineUsers = listUsers
                    .filter(function(user) {
                        return izinData[user.name] && izinData[user.name].mulai;
                    })
                    .map(function(user) {
                        return {
                            ...user,
                            mulai: izinData[user.name].mulai
                        };
                    })
                    .sort(function(a, b) {
                        // 🔥 SORT berdasarkan ROLE ORDER
                        var orderA = ROLE_ORDER[a.role] !== undefined ? ROLE_ORDER[a.role] : 99;
                        var orderB = ROLE_ORDER[b.role] !== undefined ? ROLE_ORDER[b.role] : 99;
                        if (orderA !== orderB) {
                            return orderA - orderB;
                        }
                        // Jika role sama, sort berdasarkan nama
                        return a.name.localeCompare(b.name);
                    });

                if (onlineUsers.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4">
                                <div class="empty-state">
                                    <div class="icon">😴</div>
                                    <h3>Belum ada yang izin</h3>
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }

                var roleLabels = {
                    leader: 'Leader',
                    csline: 'CS Line',
                    cs: 'CS',
                    kapten: 'Kapten',
                    kasir: 'Kasir'
                };

                var roleIcons = {
                    leader: '👑',
                    csline: '⭐',
                    cs: '💬',
                    kapten: '⚓',
                    kasir: '💰'
                };

                var now = new Date();
                var batasDetik = (jackpotLimitMinutes * 60) - 1;

                var html = '';
                onlineUsers.forEach(function(user, index) {
                    var startTime = new Date(user.mulai);
                    
                    // 🔥 PERBAIKAN BUG DURASI
                    // Hitung selisih dalam detik
                    var diffMs = now.getTime() - startTime.getTime();
                    var diff = Math.floor(diffMs / 1000);
                    
                    // Validasi: jika diff negatif atau NaN, set ke 0
                    var validDiff = (diff > 0 && !isNaN(diff)) ? diff : 0;
                    
                    // Konversi ke menit dan detik
                    var menit = Math.floor(validDiff / 60);
                    var detik = validDiff % 60;
                    
                    // Cek apakah melewati batas
                    var isOverLimit = validDiff > batasDetik;

                    var role = user.role || 'cs';
                    var roleLabel = roleLabels[role] || role;
                    var roleIcon = roleIcons[role] || '👤';
                    var timerClass = isOverLimit ? 'over-limit' : '';
                    var delay = index * 0.06;

                    html += `
                        <tr style="animation: fadeIn 0.25s ease ${delay}s both;">
                            <td class="col-status">
                                <span class="status-cell">
                                    <span class="dot"></span>
                                </span>
                            </td>
                            <td class="col-nama">
                                <span class="nama-cell">${user.name}</span>
                            </td>
                            <td class="col-role">
                                <span class="role-tag ${role}">${roleIcon} ${roleLabel}</span>
                            </td>
                            <td class="col-durasi">
                                <span class="timer-cell ${timerClass}" data-nama="${user.name}" data-mulai="${user.mulai}">
                                    ${menit}m ${detik}s
                                </span>
                            </td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;
            }

            // ============================================================
            // UPDATE ONLINE COUNT - 8 DOTS
            // ============================================================
            function updateOnlineCount() {
                var online = Object.keys(izinData).length;
                document.getElementById('totalOnline').textContent = online;

                // 🔥 Generate 8 dots (maksimal 8 orang)
                var dotsContainer = document.getElementById('statusDots');
                var dotsHtml = '';
                var maxDots = 8;
                var activeDots = Math.min(online, maxDots);

                for (var i = 0; i < maxDots; i++) {
                    var isActive = i < activeDots;
                    dotsHtml += `<span class="dot-item ${isActive ? 'active' : ''}"></span>`;
                }
                dotsContainer.innerHTML = dotsHtml;
            }

            // ============================================================
            // UPDATE TIMERS - PERBAIKAN BUG DURASI
            // ============================================================
            function updateTimers() {
                var timerCells = document.querySelectorAll('.timer-cell');
                var now = new Date();
                var batasDetik = (jackpotLimitMinutes * 60) - 1;

                timerCells.forEach(function(el) {
                    var nama = el.getAttribute('data-nama');
                    var mulai = el.getAttribute('data-mulai');
                    if (!nama || !mulai) return;

                    var data = izinData[nama];
                    if (!data || !data.mulai) return;

                    var startTime = new Date(data.mulai);
                    
                    // 🔥 PERBAIKAN: Hitung selisih dengan benar
                    var diffMs = now.getTime() - startTime.getTime();
                    var diff = Math.floor(diffMs / 1000);
                    
                    // Validasi: jika diff negatif atau NaN, set ke 0
                    var validDiff = (diff > 0 && !isNaN(diff)) ? diff : 0;
                    
                    var menit = Math.floor(validDiff / 60);
                    var detik = validDiff % 60;
                    var isOverLimit = validDiff > batasDetik;

                    el.textContent = menit + 'm ' + detik + 's';
                    el.className = 'timer-cell' + (isOverLimit ? ' over-limit' : '');
                });
            }

            // ============================================================
            // CLOCK
            // ============================================================
            function startClock() {
                updateClock();
                setInterval(updateClock, 1000);
            }

            function updateClock() {
                var now = new Date();
                var hours = String(now.getHours()).padStart(2, '0');
                var minutes = String(now.getMinutes()).padStart(2, '0');
                var seconds = String(now.getSeconds()).padStart(2, '0');
                document.getElementById('clockDisplay').textContent = hours + ':' + minutes + ':' + seconds;
            }

            // ============================================================
            // INIT
            // ============================================================
            document.addEventListener('DOMContentLoaded', function() {
                console.log('🚀 Live View - DOM Ready');
                loadPublicData();
                startClock();
                setInterval(updateTimers, 1000);
                setInterval(loadPublicData, 30000);
            });

        })();
    </script>

</body>
</html>
