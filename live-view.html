<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Live Izin - DDT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 12px;
            padding-top: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background: linear-gradient(145deg, #0d1230, #1a0a2e);
            border-radius: 20px;
            padding: 20px 18px 30px;
            border: 1px solid rgba(0, 229, 255, 0.06);
            box-shadow: 0 0 60px rgba(0, 229, 255, 0.02);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #00e5ff, #00e676, #00e5ff);
            background-size: 200% 100%;
            animation: shimmer-line 3s ease-in-out infinite;
        }

        @keyframes shimmer-line {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* ========== HEADER ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left .logo-img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 8px;
        }

        .header-left .title {
            color: #00e5ff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header-left .title small {
            font-weight: 300;
            font-size: 10px;
            color: rgba(0, 229, 255, 0.25);
            display: block;
            letter-spacing: 0.3px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 230, 118, 0.08);
            border: 1px solid rgba(0, 230, 118, 0.12);
            padding: 3px 12px 3px 8px;
            border-radius: 16px;
            font-size: 9px;
            color: #00e676;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .live-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00e676;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        .clock {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: rgba(0, 229, 255, 0.3);
            background: rgba(0, 229, 255, 0.03);
            padding: 3px 10px;
            border-radius: 10px;
            border: 1px solid rgba(0, 229, 255, 0.03);
            white-space: nowrap;
        }

        /* ========== ONLINE COUNT - PREMIUM ========== */
        .online-count {
            text-align: center;
            padding: 20px 16px 18px;
            margin-bottom: 16px;
            background: radial-gradient(ellipse at center, rgba(0, 229, 255, 0.04) 0%, transparent 70%);
            border-radius: 16px;
            border: 1px solid rgba(0, 229, 255, 0.04);
            position: relative;
            overflow: hidden;
        }

        .online-count::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(0, 229, 255, 0.03) 0%, transparent 60%);
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .online-count .number-wrap {
            position: relative;
            z-index: 1;
        }

        .online-count .number {
            font-size: 48px;
            font-weight: 800;
            color: #00e676;
            font-family: 'Courier New', monospace;
            line-height: 1;
            text-shadow: 0 0 40px rgba(0, 230, 118, 0.15);
        }

        .online-count .number .unit {
            font-size: 20px;
            font-weight: 400;
            color: rgba(0, 230, 118, 0.4);
            margin-left: 2px;
        }

        .online-count .label {
            font-size: 12px;
            color: rgba(0, 229, 255, 0.25);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }

        .online-count .label .highlight {
            color: rgba(0, 229, 255, 0.4);
            font-weight: 600;
        }

        .online-count .status-dots {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 10px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .online-count .status-dots .dot-item {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(0, 230, 118, 0.06);
            border: 1px solid rgba(0, 230, 118, 0.04);
            transition: 0.3s;
        }

        .online-count .status-dots .dot-item.active {
            background: #00e676;
            box-shadow: 0 0 16px rgba(0, 230, 118, 0.25);
            border-color: rgba(0, 230, 118, 0.3);
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        /* ========== TABLE ========== */
        .table-wrap {
            background: rgba(0, 229, 255, 0.01);
            border-radius: 12px;
            border: 1px solid rgba(0, 229, 255, 0.03);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        thead th {
            padding: 10px 12px;
            text-align: left;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(0, 229, 255, 0.15);
            border-bottom: 1px solid rgba(0, 229, 255, 0.03);
        }

        tbody td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(0, 229, 255, 0.02);
            color: rgba(255, 255, 255, 0.6);
            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .nama-cell {
            font-weight: 600;
            color: #00e5ff;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.3px;
        }

        .role-tag {
            font-size: 8px;
            padding: 2px 10px;
            border-radius: 8px;
            display: inline-block;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .role-tag.leader {
            background: rgba(0, 229, 255, 0.10);
            color: #00e5ff;
        }
        .role-tag.admin {
            background: rgba(255, 213, 79, 0.10);
            color: #ffd54f;
        }
        .role-tag.csline {
            background: rgba(255, 152, 0, 0.10);
            color: #ff9800;
        }
        .role-tag.cs {
            background: rgba(33, 150, 243, 0.10);
            color: #2196f3;
        }
        .role-tag.kapten {
            background: rgba(156, 39, 176, 0.10);
            color: #ab47bc;
        }
        .role-tag.kasir {
            background: rgba(0, 188, 212, 0.10);
            color: #00bcd4;
        }

        /* 🔥 PERBAIKAN: Timer lebih besar dan jelas */
        .timer-cell {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            font-weight: 600;
            color: #00e676;
            text-align: right;
            display: block;
            letter-spacing: 0.5px;
        }

        .timer-cell.over-limit {
            color: #ff6b6b;
            animation: blink 0.8s infinite;
        }

        .status-cell {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            font-weight: 500;
            color: #00e676;
        }

        .status-cell .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #00e676;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: rgba(255, 255, 255, 0.1);
        }

        .empty-state .icon {
            font-size: 36px;
            margin-bottom: 6px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-weight: 400;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.08);
        }

        /* ========== FOOTER ========== */
        .footer {
            margin-top: 16px;
            text-align: center;
            font-size: 9px;
            color: rgba(0, 229, 255, 0.05);
            letter-spacing: 0.5px;
        }

        .footer strong {
            color: rgba(0, 229, 255, 0.08);
        }

        .loading-spinner {
            text-align: center;
            padding: 20px;
            color: rgba(0, 229, 255, 0.1);
        }

        .loading-spinner .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid rgba(0, 229, 255, 0.05);
            border-top: 2px solid #00e5ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse-dot {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(0.7);
                opacity: 0.6;
            }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           🔥 PERBAIKAN: LEBAR KOLOM - DURASI DIPERBESAR
           ============================================================ */
        .col-status { width: 12%; }
        .col-nama { width: 32%; }
        .col-role { width: 26%; }
        .col-durasi { width: 30%; text-align: right; }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 400px) {
            body {
                padding: 8px;
                padding-top: 14px;
            }
            .container {
                padding: 14px 12px 20px;
                border-radius: 16px;
            }
            .header-left .logo-img {
                width: 64px;
                height: 64px;
            }
            .header-left .title {
                font-size: 14px;
            }
            .header-left .title small {
                font-size: 9px;
            }
            .online-count .number {
                font-size: 38px;
            }
            .online-count .number .unit {
                font-size: 16px;
            }
            .online-count {
                padding: 14px 12px 12px;
            }
            table {
                font-size: 11px;
            }
            thead th, tbody td {
                padding: 8px 10px;
            }
            .nama-cell {
                font-size: 10px;
            }
            /* 🔥 Timer tetap besar di mobile */
            .timer-cell {
                font-size: 14px;
            }
            .clock {
                font-size: 10px;
                padding: 2px 8px;
            }
            .live-badge {
                font-size: 8px;
                padding: 2px 10px 2px 6px;
            }
            .online-count .status-dots .dot-item {
                width: 8px;
                height: 8px;
            }
            /* 🔥 Lebar kolom di mobile */
            .col-status { width: 10%; }
            .col-nama { width: 30%; }
            .col-role { width: 25%; }
            .col-durasi { width: 35%; }
        }

        @media (max-width: 350px) {
            .container {
                padding: 10px 8px 16px;
                border-radius: 12px;
            }
            .header-left .title {
                font-size: 12px;
            }
            .online-count .number {
                font-size: 32px;
            }
            .online-count .number .unit {
                font-size: 14px;
            }
            thead th, tbody td {
                padding: 6px 8px;
                font-size: 10px;
            }
            .nama-cell {
                font-size: 9px;
            }
            .timer-cell {
                font-size: 13px;
            }
            .role-tag {
                font-size: 7px;
                padding: 1px 6px;
            }
            .online-count .status-dots .dot-item {
                width: 6px;
                height: 6px;
            }
            .header-left .logo-img {
                width: 50px;
                height: 50px;
            }
            .col-status { width: 8%; }
            .col-nama { width: 28%; }
            .col-role { width: 24%; }
            .col-durasi { width: 40%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <img src="https://cdn.areabermain.club/assets/cdn/az1/2026/07/08/20260708/8a08b19ab55c1f8c92bb0404eb934a1f/image-photoroom.png" alt="DDT" class="logo-img" />
                <div class="title">
                    LIVE IZIN
                    <small>Real-time Monitoring</small>
                </div>
            </div>
            <div class="header-right">
                <div class="clock" id="clockDisplay">--:--:--</div>
                <div class="live-badge">
                    <span class="dot"></span>
                    LIVE
                </div>

        </div>

        <!-- ONLINE COUNT - PREMIUM -->
        <div class="online-count" id="onlineCount">

                <tbody id="tableBody">
                    <tr>
                        <td colspan="4">
                            <div class="loading-spinner">
                                <div class="spinner"></div>
                                <span>Memuat data...</span>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            © 2026 <strong>DDT Team</strong> • Real-time
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- SUPABASE CLIENT -->
    <!-- ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script>

        (function() {
            'use strict';

            console.log('🚀 Live View - Starting...');

            // ============================================================
            // KONFIGURASI SUPABASE BARU
            // ============================================================
            var SUPABASE_URL = 'https://vnmdtmlrfecremloqlmz.supabase.co';
            var SUPABASE_ANON_KEY = 'sb_publishable_VJdyDKMe_g-YL2BlYBuLCg_xm5RrSQ1';

            var supabaseClient = window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY,
                {
                    auth: {
                        persistSession: false,
                        autoRefreshToken: false,
                        detectSessionInUrl: false
                    }
                }
            );

            // ============================================================
            // STATE
            // ============================================================
            var izinData = {};
            var jackpotLimitMinutes = 15;
            var realtimeChannel = null;
            var lastSuccessfulLoad = 0;
            var refreshInProgress = false;

            // Query fallback dibuat jarang karena update utama memakai Realtime.
            var FALLBACK_REFRESH_MS = 5 * 60 * 1000;
            var SETTINGS_REFRESH_MS = 30 * 60 * 1000;

            // ============================================================
            // ROLE ORDER UNTUK SORTING
            // ============================================================
            var ROLE_ORDER = {
                leader: 0,
                admin: 1,
                csline: 2,
                cs: 3,
                kapten: 4,
                kasir: 5
            };

            var ROLE_LABELS = {
                leader: 'Leader',
                admin: 'Admin',
                csline: 'CS Line',
                cs: 'CS',
                kapten: 'Kapten',
                kasir: 'Kasir'
            };

            var ROLE_ICONS = {
                leader: '👑',
                admin: '🛡️',
                csline: '⭐',
                cs: '💬',
                kapten: '⚓',
                kasir: '💰'
            };

            // ============================================================
            // UTILITAS
            // ============================================================
            function escapeHtml(value) {
                return String(value || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function normalizeName(name) {
                return String(name || '').trim().toUpperCase();
            }

            function parseTimestamp(value) {
                if (!value) return null;
                var date = new Date(value);
                return isNaN(date.getTime()) ? null : date;
            }

            function setLiveStatus(status, label) {
                var badge = document.querySelector('.live-badge');
                if (!badge) return;

                var dot = badge.querySelector('.dot');
                badge.lastChild.textContent = ' ' + label;

                if (status === 'online') {
                    badge.style.color = '#00e676';
                    badge.style.borderColor = 'rgba(0, 230, 118, 0.18)';
                    badge.style.background = 'rgba(0, 230, 118, 0.08)';
                    if (dot) dot.style.background = '#00e676';
                } else if (status === 'connecting') {
                    badge.style.color = '#ffd54f';
                    badge.style.borderColor = 'rgba(255, 213, 79, 0.18)';
                    badge.style.background = 'rgba(255, 213, 79, 0.08)';
                    if (dot) dot.style.background = '#ffd54f';
                } else {
                    badge.style.color = '#ff6b6b';
                    badge.style.borderColor = 'rgba(255, 107, 107, 0.18)';
                    badge.style.background = 'rgba(255, 107, 107, 0.08)';
                    if (dot) dot.style.background = '#ff6b6b';
                }
            }

            function showLoadError(message) {
                var tbody = document.getElementById('tableBody');
                if (!tbody) return;

                tbody.innerHTML = `
                    <tr>
                        <td colspan="4">
                            <div class="empty-state">
                                <div class="icon">⚠️</div>
                                <h3>${escapeHtml(message)}</h3>
                            </div>
                        </td>
                    </tr>
                `;
            }

            // ============================================================
            // LOAD SETTING BATAS IZIN
            // ============================================================
            async function loadPublicSettings() {
                try {
                    var result = await supabaseClient
                        .from('settings')
                        .select('value')
                        .eq('key', 'izin_settings')
                        .maybeSingle();

                    if (result.error) {
                        console.warn('⚠️ Setting izin tidak terbaca, memakai default 15 menit:', result.error.message);
                        return;
                    }

                    if (!result.data || !result.data.value) return;

                    var parsed = JSON.parse(result.data.value);
                    var newLimit = Number(parsed.jackpotLimitMinutes);

                    if (Number.isFinite(newLimit) && newLimit > 0) {
                        jackpotLimitMinutes = newLimit;
                        updateTimers();
                    }
                } catch (error) {
                    console.warn('⚠️ Gagal memuat setting izin:', error);
                }
            }

            // ============================================================
            // LOAD DATA IZIN PUBLIK
            // ============================================================
            async function loadPublicData(force) {
                if (refreshInProgress) return;

                var now = Date.now();
                if (!force && lastSuccessfulLoad && (now - lastSuccessfulLoad) < 15000) {
                    return;
                }

                refreshInProgress = true;

                try {
                    console.log('📥 Loading live izin...');

                    var result = await supabaseClient
                        .from('izin_anggota')
                        .select('nama,role,mulai,status')
                        .eq('status', 'izin')
                        .not('mulai', 'is', null)
                        .order('mulai', { ascending: true })
                        .limit(100);

                    if (result.error) {
                        throw result.error;
                    }

                    izinData = {};

                    (result.data || []).forEach(function(item) {
                        var key = normalizeName(item.nama);
                        if (!key) return;

                        izinData[key] = {
                            nama: item.nama,
                            role: item.role || 'cs',
                            mulai: item.mulai
                        };
                    });

                    lastSuccessfulLoad = Date.now();
                    renderTable();
                    updateOnlineCount();
                    setLiveStatus('online', 'LIVE');

                    console.log('✅ ' + Object.keys(izinData).length + ' anggota sedang izin');
                } catch (error) {
                    console.error('❌ Gagal mengambil live izin:', error);
                    setLiveStatus('offline', 'OFFLINE');

                    if (!lastSuccessfulLoad) {
                        showLoadError(
                            'Data belum dapat dibaca. Jalankan SQL akses Live View di Supabase.'
                        );
                    }
                } finally {
                    refreshInProgress = false;
                }
            }

            // ============================================================
            // REALTIME
            // ============================================================
            function applyRealtimePayload(payload) {
                var oldRow = payload.old || {};
                var newRow = payload.new || {};

                if (oldRow.nama) {
                    delete izinData[normalizeName(oldRow.nama)];
                }

                if (
                    payload.eventType !== 'DELETE' &&
                    newRow.nama &&
                    newRow.status === 'izin' &&
                    newRow.mulai
                ) {
                    izinData[normalizeName(newRow.nama)] = {
                        nama: newRow.nama,
                        role: newRow.role || 'cs',
                        mulai: newRow.mulai
                    };
                }

                renderTable();
                updateOnlineCount();
            }

            function subscribeRealtime() {
                if (realtimeChannel) return;

                setLiveStatus('connecting', 'CONNECTING');

                realtimeChannel = supabaseClient
                    .channel('public-live-izin')
                    .on(
                        'postgres_changes',
                        {
                            event: '*',
                            schema: 'public',
                            table: 'izin_anggota'
                        },
                        function(payload) {
                            applyRealtimePayload(payload);
                        }
                    )
                    .subscribe(function(status) {
                        if (status === 'SUBSCRIBED') {
                            setLiveStatus('online', 'LIVE');
                            console.log('✅ Realtime connected');
                        } else if (
                            status === 'CHANNEL_ERROR' ||
                            status === 'TIMED_OUT' ||
                            status === 'CLOSED'
                        ) {
                            setLiveStatus('offline', 'OFFLINE');
                            console.warn('⚠️ Realtime status:', status);
                        }
                    });
            }

            // ============================================================
            // RENDER TABLE
            // ============================================================
            function renderTable() {
                var tbody = document.getElementById('tableBody');
                var onlineUsers = Object.keys(izinData)
                    .map(function(key) {
                        return izinData[key];
                    })
                    .sort(function(a, b) {
                        var orderA = ROLE_ORDER[a.role] !== undefined ? ROLE_ORDER[a.role] : 99;
                        var orderB = ROLE_ORDER[b.role] !== undefined ? ROLE_ORDER[b.role] : 99;

                        if (orderA !== orderB) return orderA - orderB;
                        return normalizeName(a.nama).localeCompare(normalizeName(b.nama));
                    });

                if (onlineUsers.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4">
                                <div class="empty-state">
                                    <div class="icon">😴</div>
                                    <h3>Belum ada yang izin</h3>
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }

                var now = Date.now();
                var batasDetik = jackpotLimitMinutes * 60;
                var html = '';

                onlineUsers.forEach(function(user, index) {
                    var startTime = parseTimestamp(user.mulai);
                    var diff = startTime
                        ? Math.max(0, Math.floor((now - startTime.getTime()) / 1000))
                        : 0;

                    var menit = Math.floor(diff / 60);
                    var detik = diff % 60;
                    var isOverLimit = diff >= batasDetik;
                    var role = user.role || 'cs';
                    var roleLabel = ROLE_LABELS[role] || role;
                    var roleIcon = ROLE_ICONS[role] || '👤';
                    var timerClass = isOverLimit ? 'over-limit' : '';
                    var delay = index * 0.06;
                    var safeName = escapeHtml(user.nama);
                    var safeRole = escapeHtml(role);

                    html += `
                        <tr style="animation: fadeIn 0.25s ease ${delay}s both;">
                            <td class="col-status">
                                <span class="status-cell">
                                    <span class="dot"></span>
                                </span>
                            </td>
                            <td class="col-nama">
                                <span class="nama-cell">${safeName}</span>
                            </td>
                            <td class="col-role">
                                <span class="role-tag ${safeRole}">${roleIcon} ${escapeHtml(roleLabel)}</span>
                            </td>
                            <td class="col-durasi">
                                <span
                                    class="timer-cell ${timerClass}"
                                    data-nama="${escapeHtml(normalizeName(user.nama))}"
                                >${menit}m ${String(detik).padStart(2, '0')}s</span>
                            </td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;
            }

            // ============================================================
            // UPDATE ONLINE COUNT
            // ============================================================
            function updateOnlineCount() {
                var online = Object.keys(izinData).length;
                document.getElementById('totalOnline').textContent = online;

                var dotsContainer = document.getElementById('statusDots');
                var dotsHtml = '';
                var maxDots = 8;
                var activeDots = Math.min(online, maxDots);

                for (var i = 0; i < maxDots; i++) {
                    dotsHtml += `<span class="dot-item ${i < activeDots ? 'active' : ''}"></span>`;
                }

                dotsContainer.innerHTML = dotsHtml;
            }

            // ============================================================
            // UPDATE TIMER LOKAL (TIDAK QUERY DATABASE)
            // ============================================================
            function updateTimers() {
                var timerCells = document.querySelectorAll('.timer-cell');
                var now = Date.now();
                var batasDetik = jackpotLimitMinutes * 60;

                timerCells.forEach(function(el) {
                    var key = el.getAttribute('data-nama');
                    var data = izinData[key];
                    if (!data || !data.mulai) return;

                    var startTime = parseTimestamp(data.mulai);
                    if (!startTime) return;

                    var diff = Math.max(0, Math.floor((now - startTime.getTime()) / 1000));
                    var menit = Math.floor(diff / 60);
                    var detik = diff % 60;
                    var isOverLimit = diff >= batasDetik;

                    el.textContent = menit + 'm ' + String(detik).padStart(2, '0') + 's';
                    el.className = 'timer-cell' + (isOverLimit ? ' over-limit' : '');
                });
            }

            // ============================================================
            // CLOCK
            // ============================================================
            function updateClock() {
                var now = new Date();
                var hours = String(now.getHours()).padStart(2, '0');
                var minutes = String(now.getMinutes()).padStart(2, '0');
                var seconds = String(now.getSeconds()).padStart(2, '0');

                document.getElementById('clockDisplay').textContent =
                    hours + ':' + minutes + ':' + seconds;
            }

            function startClock() {
                updateClock();
                setInterval(updateClock, 1000);
            }

            // ============================================================
            // INIT
            // ============================================================
            document.addEventListener('DOMContentLoaded', function() {
                console.log('🚀 Live View - DOM Ready');

                startClock();
                loadPublicSettings();
                loadPublicData(true);
                subscribeRealtime();

                setInterval(updateTimers, 1000);
                setInterval(function() {
                    loadPublicData(true);
                }, FALLBACK_REFRESH_MS);
                setInterval(loadPublicSettings, SETTINGS_REFRESH_MS);

                document.addEventListener('visibilitychange', function() {
                    if (
                        document.visibilityState === 'visible' &&
                        Date.now() - lastSuccessfulLoad > 60000
                    ) {
                        loadPublicData(true);
                    }
                });

                window.addEventListener('online', function() {
                    loadPublicData(true);
                    subscribeRealtime();
                });

                window.addEventListener('offline', function() {
                    setLiveStatus('offline', 'OFFLINE');
                });
            });

            window.addEventListener('beforeunload', function() {
                if (realtimeChannel) {
                    supabaseClient.removeChannel(realtimeChannel);
                    realtimeChannel = null;
                }
            });
        })();

    </script>

</body>
</html>
