<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Live Izin - DDT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Exact current Legacy Dark/Cyber family from dashboard production. */
            --accent: #27d9ef;
            --accent-rgb: 39, 217, 239;
            --accent-strong: #0caec7;
            --accent-soft: rgba(39, 217, 239, .11);
            --theme-glow: rgba(39, 217, 239, .16);

            --bg-primary: #03171e;
            --bg-secondary: #05242d;
            --bg-card: #072d38;
            --bg-hover: #0a3a47;
            --bg-table-header: #041b22;
            --bg-table-header-soft: #05222a;

            --text-primary: #ecfcff;
            --text-secondary: #b8d8de;
            --text-muted: #739ca5;

            --border-color: #174653;
            --border-light: #0d3540;

            --success: #41d89a;
            --success-bg: #0b3b30;
            --danger: #ff7d88;
            --danger-bg: #402128;
            --warning: #ffc267;
            --warning-bg: #402f17;

            --shell-max: 520px;
            --radius-lg: 14px;
            --radius-md: 9px;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        html { background: #021219; }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-x: clip;
            color: var(--text-primary);
            background:
                radial-gradient(760px 380px at 50% -150px, rgba(var(--accent-rgb), .11), transparent 68%),
                linear-gradient(180deg, #021219 0%, #03171e 48%, #02141a 100%);
            font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .container {
            width: min(var(--shell-max), calc(100% - 16px));
            margin: 0 auto;
            padding:
                max(10px, env(safe-area-inset-top))
                0
                max(14px, env(safe-area-inset-bottom));
        }

        /* ========================= BRAND HEADER ========================= */
        .header {
            position: relative;
            min-height: 68px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 10px 11px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, #03242d 0%, #04303a 62%, #043843 100%);
            box-shadow: 0 12px 28px rgba(0, 0, 0, .22);
        }

        .header-left {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left .logo-img {
            display: block;
            width: 88px;
            max-width: 25vw;
            height: 38px;
            flex: 0 0 auto;
            object-fit: contain;
            object-position: left center;
        }

        .header-left .title {
            min-width: 0;
            color: #effdff;
            font-size: 14px;
            font-weight: 760;
            letter-spacing: .018em;
            line-height: 1.14;
            white-space: nowrap;
        }

        .header-left .title small {
            display: block;
            margin-bottom: 4px;
            color: #89edf8;
            font-size: 6.8px;
            font-weight: 760;
            letter-spacing: .14em;
            text-transform: uppercase;
            opacity: .72;
        }

        .header-right {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .clock {
            color: rgba(236, 252, 255, .78);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 11px;
            font-weight: 680;
            font-variant-numeric: tabular-nums;
            letter-spacing: .025em;
            white-space: nowrap;
        }

        .live-badge {
            min-height: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 8px;
            border: 0;
            border-radius: 999px;
            color: #86e8ba;
            background: rgba(11, 59, 48, .62);
            box-shadow: inset 0 0 0 1px rgba(65, 216, 154, .08);
            font-size: 6.8px;
            font-weight: 820;
            letter-spacing: .09em;
            white-space: nowrap;
        }

        .live-badge .dot,
        .status-cell .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .live-badge[data-status="online"] .dot,
        .status-cell .dot {
            animation: pulse-dot 1.9s ease-in-out infinite;
        }

        .live-badge[data-status="connecting"] {
            color: var(--warning);
            background: rgba(64, 47, 23, .66);
            box-shadow: inset 0 0 0 1px rgba(255, 194, 103, .08);
        }
        .live-badge[data-status="connecting"] .dot { background: var(--warning); }

        .live-badge[data-status="offline"] {
            color: #ff9ca4;
            background: rgba(64, 33, 40, .68);
            box-shadow: inset 0 0 0 1px rgba(255, 125, 136, .08);
        }
        .live-badge[data-status="offline"] .dot { background: var(--danger); animation: none; }

        /* ========================= OPERATIONS PLANE ========================= */
        .workspace-plane {
            position: relative;
            margin-top: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            box-shadow: 0 14px 34px rgba(0, 0, 0, .22);
        }

        .workspace-datum {
            min-height: 33px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 11px;
            border-bottom: 1px solid var(--border-light);
            background: linear-gradient(90deg, #03212a 0%, #052c36 100%);
            color: var(--text-muted);
            font-size: 6.8px;
            font-weight: 760;
            letter-spacing: .11em;
            text-transform: uppercase;
        }

        .datum-index {
            color: var(--accent);
            white-space: nowrap;
        }

        .datum-rule {
            flex: 1 1 auto;
            height: 0;
        }

        .datum-title { white-space: nowrap; }

        .datum-sync {
            color: #6f9da6;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 6.4px;
            font-variant-numeric: tabular-nums;
            letter-spacing: .04em;
            white-space: nowrap;
        }

        /* ========================= LIVE SUMMARY ========================= */
        .online-count {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            min-height: 106px;
            border-bottom: 1px solid var(--border-light);
            background: linear-gradient(90deg, #052b35 0%, #06303a 48%, #05262f 100%);
        }

        .number-wrap {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 15px 14px 14px;
        }

        .online-count .number {
            display: flex;
            align-items: baseline;
            gap: 8px;
            color: #7ee9f5;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 38px;
            font-weight: 820;
            line-height: .92;
            font-variant-numeric: tabular-nums;
            letter-spacing: -.035em;
        }

        .online-count .unit {
            color: rgba(126, 233, 245, .54);
            font-size: 7.2px;
            font-weight: 820;
            letter-spacing: .12em;
        }

        .online-count .label {
            margin-top: 8px;
            color: #b7d5da;
            font-size: 8.5px;
            font-weight: 720;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .online-count .label .highlight {
            margin-right: 5px;
            color: var(--success);
        }

        .status-dots { display: none; }

        .summary-meta {
            min-width: 118px;
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
            padding: 8px;
            background: rgba(3, 23, 30, .16);
        }

        .summary-meta-item {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            padding: 8px 9px;
            border-radius: 7px;
            background: rgba(7, 45, 55, .46);
            box-shadow: inset 0 0 0 1px rgba(127, 214, 227, .055);
        }

        .summary-meta-item + .summary-meta-item {
            border-top: 0;
        }

        .summary-meta-item span {
            color: rgba(184, 216, 222, .56);
            font-size: 6.2px;
            font-weight: 780;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .summary-meta-item strong {
            margin-top: 4px;
            color: #d6eef2;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 10px;
            font-weight: 780;
            font-variant-numeric: tabular-nums;
            letter-spacing: .015em;
        }

        /* ========================= LIVE TABLE ========================= */
        .table-wrap {
            position: relative;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
            background: var(--bg-primary);
        }

        .table-wrap::-webkit-scrollbar { display: none; }

        table {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            border-collapse: collapse;
            table-layout: fixed;
        }

        thead th {
            height: 32px;
            max-width: 0;
            padding: 0 8px;
            overflow: hidden;
            text-align: left;
            color: #789ca4;
            background: #041b22;
            border-bottom: 1px solid #10343d;
            font-size: 7.1px;
            font-weight: 780;
            letter-spacing: .09em;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
        }

        thead th.col-durasi { color: #95b9c0; }

        tbody td {
            height: 44px;
            max-width: 0;
            padding: 5px 8px;
            overflow: hidden;
            border-bottom: 1px solid #0b3039;
            color: var(--text-primary);
            background: #03171e;
            vertical-align: middle;
        }

        tbody tr:nth-child(even) td { background: #04191f; }
        tbody tr:last-child td { border-bottom: 0; }

        .name-status {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .name-status-dot {
            width: 6px;
            height: 6px;
            flex: 0 0 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 3px rgba(65, 216, 154, .055);
            animation: pulse-dot 1.9s ease-in-out infinite;
        }

        .nama-cell {
            min-width: 0;
            display: block;
            overflow: hidden;
            color: #eaf9fb;
            font-size: 9.8px;
            font-weight: 730;
            letter-spacing: .012em;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* V22 compact/matte Legacy role language. */
        .role-tag {
            display: inline-block;
            max-width: 100%;
            padding: 4px 8px;
            overflow: hidden;
            border: 1px solid transparent;
            border-radius: 7px;
            font-size: 8px;
            font-weight: 750;
            letter-spacing: .035em;
            line-height: 1;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .role-tag.leader { background:#171f2b; color:#f0cf78; border-color:#65562b; }
        .role-tag.admin { background:#3a1a1a; color:#ff9b9b; border-color:#704040; }
        .role-tag.csline { background:#123f2f; color:#8ee0ae; border-color:#2b6f53; }
        .role-tag.cs { background:#142f4a; color:#9ec7f7; border-color:#31587f; }
        .role-tag.kapten { background:#423019; color:#f0c47d; border-color:#72532d; }
        .role-tag.kasir { background:#2d2348; color:#c9b5f5; border-color:#5a4780; }


        .timer-cell {
            display: block;
            color: #73e4b2;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 11.5px;
            font-weight: 780;
            letter-spacing: .005em;
            line-height: 1;
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .timer-cell.over-limit {
            color: #ff939c;
            font-weight: 820;
        }

        .empty-state,
        .loading-spinner {
            padding: 30px 16px;
            color: var(--text-muted);
            text-align: center;
            font-size: 9px;
        }

        .empty-state .icon { display: none; }

        .empty-state h3 {
            color: #759ba4;
            font-size: 9.5px;
            font-weight: 620;
            line-height: 1.5;
        }

        .loading-spinner .spinner {
            width: 20px;
            height: 20px;
            margin: 0 auto 9px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        /* ========================= FOOTER ========================= */
        .footer {
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 0 10px;
            color: #668892;
            font-size: 6.4px;
            font-weight: 700;
            letter-spacing: .075em;
            text-transform: uppercase;
        }

        .footer strong { color: #7aa4ad; }
        .footer-system { white-space: nowrap; }

        .col-nama { width: 43%; }
        .col-role { width: 25%; }
        .col-durasi { width: 32%; text-align: right; }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: .48; transform: scale(.78); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(2px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 390px) {
            .container {
                width: calc(100% - 12px);
                padding-top: max(7px, env(safe-area-inset-top));
            }
            .header { min-height: 64px; padding: 8px 9px; }
            .header-left { gap: 8px; }
            .header-left .logo-img { width: 76px; height: 32px; }
            .header-left .title { font-size: 12.5px; }
            .header-left .title small { font-size: 6.1px; }
            .clock { font-size: 9.8px; }
            .live-badge { min-height: 19px; padding: 3px 6px; font-size: 6.1px; }

            .workspace-datum { gap: 6px; padding: 0 8px; font-size: 6.1px; }
            .datum-title { display: none; }
            .datum-sync { font-size: 5.9px; }

            .online-count { min-height: 96px; }
            .number-wrap { padding: 13px 10px; }
            .online-count .number { font-size: 33px; }
            .online-count .label { font-size: 7.9px; }
            .summary-meta { min-width: 100px; }
            .summary-meta-item { padding: 8px; }

            thead th { padding: 0 6px; font-size: 6.6px; }
            tbody td { height: 43px; padding: 5px 6px; }
            .nama-cell { font-size: 8.8px; }
            .role-tag { padding: 4px 6px; font-size: 7.2px; }
            .timer-cell { font-size: 11px; }

            .col-nama { width: 43%; }
            .col-role { width: 24%; }
            .col-durasi { width: 33%; }
        }

        @media (max-width: 340px) {
            .container { width: calc(100% - 10px); }
            .header { min-height: 60px; }
            .header-left .logo-img { width: 66px; height: 29px; }
            .header-left .title { font-size: 11.2px; }
            .header-left .title small { display: none; }
            .clock { font-size: 9px; }
            .live-badge { gap: 4px; }

            .datum-sync { display: none; }
            .online-count .number { font-size: 29px; }
            .summary-meta { min-width: 88px; }
            .summary-meta-item strong { font-size: 9px; }

            thead th,
            tbody td { padding-left: 5px; padding-right: 5px; }
            .nama-cell { font-size: 8.2px; }
            .role-tag { padding-left: 5px; padding-right: 5px; font-size: 6.8px; }
            .timer-cell { font-size: 10.4px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .001ms !important;
            }
        }
    
        /* ========================= OFFICE SNAPSHOT v1.0 ========================= */
        .role-stack,
        .duration-stack {
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .role-stack {
            align-items: flex-start;
            gap: 4px;
        }

        .duration-stack {
            align-items: flex-end;
            gap: 4px;
        }

        .office-line {
            max-width: 100%;
            overflow: hidden;
            color: #729da6;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 6.4px;
            font-weight: 760;
            font-variant-numeric: tabular-nums;
            letter-spacing: .075em;
            line-height: 1;
            text-overflow: ellipsis;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .office-line::before {
            content: "OFFICE ";
            color: #4f7780;
            font-size: 5.7px;
            letter-spacing: .08em;
        }

        .timer-cell.near-limit {
            color: var(--warning);
        }

        .limit-line {
            max-width: 100%;
            overflow: hidden;
            color: #729da6;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 6.45px;
            font-weight: 730;
            font-variant-numeric: tabular-nums;
            letter-spacing: .02em;
            line-height: 1;
            text-align: right;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .limit-line strong {
            color: #9ec2c8;
            font-weight: 780;
        }

        .limit-line.near-limit {
            color: rgba(255, 194, 103, .76);
        }

        .limit-line.near-limit strong {
            color: var(--warning);
        }

        .limit-line.over-limit,
        .limit-line.over-limit strong {
            color: #ff939c;
        }

        .limit-line.pending,
        .office-line.pending {
            color: #68868d;
            opacity: .72;
        }

        .clock[data-clock-source="server"] {
            color: rgba(236, 252, 255, .84);
        }

        .clock[data-clock-source="local"] {
            color: rgba(255, 194, 103, .78);
        }

        @media (max-width: 390px) {
            .role-stack,
            .duration-stack { gap: 3px; }
            .office-line { font-size: 5.9px; }
            .office-line::before { font-size: 5.2px; }
            .limit-line { font-size: 5.9px; }
        }

        @media (max-width: 340px) {
            .office-line::before { content: ""; }
            .office-line { font-size: 5.7px; }
            .limit-line { font-size: 5.6px; letter-spacing: 0; }
        }

    </style>
</head>

    <div class="container">
        <header class="header">
            <div class="header-left">
                <img src="https://dashboard-izin.pages.dev/assets/Logo%20DDT%20-%20Full.png" alt="DDT" class="logo-img" width="176" height="76" decoding="async" fetchpriority="high" />

        <main class="workspace-plane">

                    <div class="summary-meta-item">

                            <th class="col-durasi">Durasi / Batas</th>

                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="3">
                                <div class="loading-spinner">
                                    <div class="spinner" aria-hidden="true"></div>
                                    <span>Memuat data izin</span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer class="footer">
            <span>© 2026 <strong>DDT Team</strong></span>
            <span class="footer-system">Secure Public Feed</span>
        </footer>
    </div>

            );

            // ============================================================
            // STATE
            // ============================================================
            var izinData = {};
            var realtimeChannel = null;
            var lastSuccessfulLoad = 0;
            var refreshInProgress = false;

            // Realtime remains primary. Snapshot is reconciliation only.
            var FALLBACK_REFRESH_MS = 60 * 1000;
            var realtimeReconnectTimer = null;
            var realtimeResetInProgress = false;

            // ============================================================
            // SERVER CLOCK AUTHORITY
            // Same midpoint / lowest-RTT model used by dashboard.
            // ============================================================
            var serverClockState = {
                offsetMs: 0,
                ready: false,
                lastSyncClientMs: 0,
                lastServerEpochMs: 0,
                rttMs: null,
                inFlight: null,
                failures: 0
            };

            var SERVER_CLOCK_RESYNC_MS = 5 * 60 * 1000;
            var heartbeatTimer = null;

            function readServerEpochMs(payload) {
                if (payload == null) return null;

                var value = payload;

                if (typeof value === 'string') {
                    try {
                        value = JSON.parse(value);
                    } catch (_) {}
                }

                if (value && typeof value === 'object') {
                    var epoch = Number(value.server_epoch_ms);
                    if (Number.isFinite(epoch)) return epoch;

                    if (value.server_time) {
                        var parsed = new Date(value.server_time).getTime();
                        if (Number.isFinite(parsed)) return parsed;
                    }
                }

                var primitive = Number(value);
                return Number.isFinite(primitive) ? primitive : null;
            }

            async function takeServerClockSample() {
                var t0 = Date.now();

                var result = await supabaseClient.rpc('get_server_clock');

                var t1 = Date.now();

                if (result.error) throw result.error;

                var serverMs = readServerEpochMs(result.data);

                if (!Number.isFinite(serverMs)) {
                    throw new Error('Server clock response tidak valid.');
                }

                var rtt = Math.max(0, t1 - t0);
                var midpoint = t0 + (rtt / 2);

                return {
                    offsetMs: serverMs - midpoint,
                    serverMs: serverMs,
                    rttMs: rtt,
                    sampledAtClientMs: t1
                };
            }

            async function syncServerClock(options) {
                options = options || {};

                if (serverClockState.inFlight) {
                    return serverClockState.inFlight;
                }

                var sampleCount = Math.max(
                    1,
                    Math.min(3, Number(options.samples) || 1)
                );

                serverClockState.inFlight = (async function() {
                    var collected = [];

                    try {
                        for (var i = 0; i < sampleCount; i += 1) {
                            try {
                                collected.push(await takeServerClockSample());
                            } catch (error) {
                                if (i === sampleCount - 1 && !collected.length) {
                                    throw error;
                                }
                            }
                        }

                        if (!collected.length) {
                            throw new Error('Tidak ada sample server clock.');
                        }

                        // Lowest RTT gives the cleanest midpoint estimate.
                        collected.sort(function(a, b) {
                            return a.rttMs - b.rttMs;
                        });

                        var best = collected[0];

                        serverClockState.offsetMs = best.offsetMs;
                        serverClockState.ready = true;
                        serverClockState.lastSyncClientMs = Date.now();
                        serverClockState.lastServerEpochMs = best.serverMs;
                        serverClockState.rttMs = best.rttMs;
                        serverClockState.failures = 0;

                        updateClock();
                        updateTimers();
                        scheduleHeartbeat();

                        return true;
                    } catch (error) {
                        serverClockState.failures += 1;
                        console.warn(
                            '⚠️ Server clock sync gagal; sementara menggunakan clock browser:',
                            error && error.message ? error.message : error
                        );

                        updateClock();
                        return false;
                    } finally {
                        serverClockState.inFlight = null;
                    }
                })();

                return serverClockState.inFlight;
            }

            function serverNowMs() {
                return Date.now() + (
                    serverClockState.ready
                        ? serverClockState.offsetMs
                        : 0
                );
            }

            function serverNowDate() {
                return new Date(serverNowMs());
            }

            async function ensureServerClockReady(maxAgeMs) {
                var maxAge = Number.isFinite(Number(maxAgeMs))
                    ? Number(maxAgeMs)
                    : 5 * 60 * 1000;

                var age = Date.now() - serverClockState.lastSyncClientMs;

                if (
                    serverClockState.ready &&
                    age >= 0 &&
                    age <= Math.max(0, maxAge)
                ) {
                    return true;
                }

                return syncServerClock({
                    samples: serverClockState.ready ? 1 : 3
                });
            }

            function resyncClockIfUseful() {
                if (document.hidden || !navigator.onLine) return;

                var age = Date.now() - serverClockState.lastSyncClientMs;

                if (!serverClockState.ready || age >= 60000) {
                    syncServerClock({
                        samples: serverClockState.ready ? 2 : 3
                    });
                }
            }

            // ============================================================
            // ROLE ORDER
            // ============================================================
            var ROLE_ORDER = {
                leader: 0,
                admin: 1,
                csline: 2,
                cs: 3,
                kapten: 4,
                kasir: 5
            };

            var ROLE_LABELS = {
                leader: 'Leader',
                admin: 'Admin',
                csline: 'CS Line',
                cs: 'CS',
                kapten: 'Kapten',
                kasir: 'Kasir'
            };

            // ============================================================
            // UTILITIES
            // ============================================================
            function escapeHtml(value) {
                return String(value == null ? '' : value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function normalizeName(name) {
                return String(name || '').trim().toUpperCase();
            }

            function parseTimestamp(value) {
                if (!value) return null;
                var date = new Date(value);
                return isNaN(date.getTime()) ? null : date;
            }

            function normalizeThresholdSeconds(value) {
                var number = Number(value);
                return Number.isFinite(number) && number > 0
                    ? Math.floor(number)
                    : null;
            }

            function formatClockHHMM(date) {
                if (!(date instanceof Date) || isNaN(date.getTime())) {
                    return '…';
                }

                return (
                    String(date.getHours()).padStart(2, '0') +
                    ':' +
                    String(date.getMinutes()).padStart(2, '0')
                );
            }

            function setLiveStatus(status, label) {
                var badge = document.querySelector('.live-badge');
                var labelEl = document.getElementById('liveStatusLabel');
                if (!badge) return;

                badge.setAttribute('data-status', status || 'offline');
                if (labelEl) labelEl.textContent = label || 'OFFLINE';
            }

            function markSync() {
                var el = document.getElementById('lastSyncDisplay');
                if (!el) return;

                var now = serverNowDate();

                el.textContent =
                    'SYNC ' +
                    String(now.getHours()).padStart(2, '0') + ':' +
                    String(now.getMinutes()).padStart(2, '0') + ':' +
                    String(now.getSeconds()).padStart(2, '0');
            }

            function showLoadError(message) {
                var tbody = document.getElementById('tableBody');
                if (!tbody) return;

                tbody.innerHTML = `
                    <tr>
                        <td colspan="3">
                            <div class="empty-state">
                                <div class="icon">⚠️</div>
                                <h3>${escapeHtml(message)}</h3>
                            </div>
                        </td>
                    </tr>
                `;
            }

            // ============================================================
            // OFFICE START SNAPSHOT AUTHORITY
            // No current Settings fallback is permitted for an active row.
            // ============================================================
            function activeThresholdSeconds(user) {
                return normalizeThresholdSeconds(
                    user && user.threshold_at_event_seconds
                );
            }

            function activeOfficeName(user) {
                var name = String(
                    user && user.office_name
                        ? user.office_name
                        : ''
                ).trim();

                return name || '…';
            }

            function activeDeadline(user) {
                var threshold = activeThresholdSeconds(user);
                var start = parseTimestamp(user && user.mulai);

                if (!threshold || !start) return null;

                return new Date(
                    start.getTime() +
                    threshold * 1000
                );
            }

            function activeTimingState(user, nowMs) {
                var start = parseTimestamp(user && user.mulai);
                var threshold = activeThresholdSeconds(user);

                var elapsed = start
                    ? Math.max(
                        0,
                        Math.floor(
                            (nowMs - start.getTime()) / 1000
                        )
                    )
                    : 0;

                if (!threshold) {
                    return {
                        elapsed: elapsed,
                        threshold: null,
                        progress: null,
                        near: false,
                        over: false,
                        deadline: null
                    };
                }

                var progress = Math.min(
                    100,
                    (elapsed / threshold) * 100
                );

                // Same strict authority as finish_izin:
                // exact threshold is NOT over-limit.
                var over = elapsed > threshold;
                var near = !over && progress >= 70;

                return {
                    elapsed: elapsed,
                    threshold: threshold,
                    progress: progress,
                    near: near,
                    over: over,
                    deadline: activeDeadline(user)
                };
            }

            function updateLimitSummary() {
                var target = document.getElementById('permitLimitDisplay');
                if (!target) return;

                var minutes = Object.keys(izinData)
                    .map(function(key) {
                        return activeThresholdSeconds(izinData[key]);
                    })
                    .filter(function(seconds) {
                        return Number.isFinite(seconds) && seconds > 0;
                    })
                    .map(function(seconds) {
                        return Math.max(1, Math.round(seconds / 60));
                    })
                    .filter(function(value, index, array) {
                        return array.indexOf(value) === index;
                    })
                    .sort(function(a, b) {
                        return a - b;
                    });

                if (!minutes.length) {
                    target.textContent = 'PER OFFICE';
                    return;
                }

                target.textContent =
                    minutes.join(' / ') +
                    (minutes.length === 1 ? ' MIN' : ' MIN');
            }

            // ============================================================
            // LOAD LIVE DATA
            // ============================================================
            async function loadPublicData(force) {
                if (refreshInProgress) return;

                var now = Date.now();

                if (
                    !force &&
                    lastSuccessfulLoad &&
                    (now - lastSuccessfulLoad) < 15000
                ) {
                    return;
                }

                refreshInProgress = true;

                try {
                    console.log('📥 Loading live izin...');

                    var result = await supabaseClient
                        .from('izin_anggota')
                        .select(
                            'nama,role,mulai,status,office_id,office_name,threshold_at_event_seconds'
                        )
                        .eq('status', 'izin')
                        .not('mulai', 'is', null)
                        .order('mulai', { ascending: true })
                        .limit(100);

                    if (result.error) throw result.error;

                    izinData = {};

                    (result.data || []).forEach(function(item) {
                        var key = normalizeName(item.nama);
                        if (!key) return;

                        izinData[key] = {
                            nama: item.nama,
                            role: item.role || 'cs',
                            mulai: item.mulai,
                            office_id: item.office_id || null,
                            office_name: item.office_name || null,
                            threshold_at_event_seconds:
                                normalizeThresholdSeconds(
                                    item.threshold_at_event_seconds
                                )
                        };
                    });

                    lastSuccessfulLoad = Date.now();

                    renderTable();
                    updateOnlineCount();
                    updateLimitSummary();
                    markSync();
                    setLiveStatus('online', 'LIVE');

                    console.log(
                        '✅ ' +
                        Object.keys(izinData).length +
                        ' anggota sedang izin'
                    );
                } catch (error) {
                    console.error('❌ Gagal mengambil live izin:', error);
                    setLiveStatus('offline', 'OFFLINE');

                    if (!lastSuccessfulLoad) {
                        showLoadError(
                            'Data belum dapat dibaca. Jalankan SQL akses Live View di Supabase.'
                        );
                    }
                } finally {
                    refreshInProgress = false;
                }
            }

            // ============================================================
            // REALTIME
            // ============================================================
            function applyRealtimePayload(payload) {
                var oldRow = payload.old || {};
                var newRow = payload.new || {};

                var oldKey = oldRow.nama
                    ? normalizeName(oldRow.nama)
                    : '';

                var newKey = newRow.nama
                    ? normalizeName(newRow.nama)
                    : '';

                if (oldKey) delete izinData[oldKey];
                if (newKey) delete izinData[newKey];

                if (
                    payload.eventType !== 'DELETE' &&
                    newRow.nama &&
                    newRow.status === 'izin' &&
                    newRow.mulai
                ) {
                    izinData[newKey] = {
                        nama: newRow.nama,
                        role: newRow.role || 'cs',
                        mulai: newRow.mulai,
                        office_id: newRow.office_id || null,
                        office_name: newRow.office_name || null,
                        threshold_at_event_seconds:
                            normalizeThresholdSeconds(
                                newRow.threshold_at_event_seconds
                            )
                    };
                }

                renderTable();
                updateOnlineCount();
                updateLimitSummary();
                markSync();
            }

            function scheduleRealtimeReconnect() {
                if (
                    realtimeReconnectTimer ||
                    realtimeResetInProgress
                ) {
                    return;
                }

                realtimeReconnectTimer = setTimeout(
                    async function() {
                        realtimeReconnectTimer = null;
                        realtimeResetInProgress = true;

                        var staleChannel = realtimeChannel;
                        realtimeChannel = null;

                        if (staleChannel) {
                            try {
                                await supabaseClient.removeChannel(
                                    staleChannel
                                );
                            } catch (error) {
                                console.warn(
                                    '⚠️ Gagal membersihkan channel Realtime lama:',
                                    error
                                );
                            }
                        }

                        realtimeResetInProgress = false;
                        subscribeRealtime();

                        if (document.visibilityState === 'visible') {
                            loadPublicData(true);
                            resyncClockIfUseful();
                        }
                    },
                    2500
                );
            }

            function subscribeRealtime() {
                if (
                    realtimeChannel ||
                    realtimeResetInProgress
                ) {
                    return;
                }

                setLiveStatus('connecting', 'CONNECTING');

                realtimeChannel = supabaseClient
                    .channel('public-live-izin-office-v1')
                    .on(
                        'postgres_changes',
                        {
                            event: '*',
                            schema: 'public',
                            table: 'izin_anggota'
                        },
                        function(payload) {
                            applyRealtimePayload(payload);
                        }
                    )
                    .subscribe(function(status) {
                        if (status === 'SUBSCRIBED') {
                            setLiveStatus('online', 'LIVE');
                            console.log('✅ Realtime connected');
                        } else if (
                            status === 'CHANNEL_ERROR' ||
                            status === 'TIMED_OUT' ||
                            status === 'CLOSED'
                        ) {
                            setLiveStatus('offline', 'OFFLINE');
                            console.warn('⚠️ Realtime status:', status);
                            scheduleRealtimeReconnect();
                        }
                    });
            }

            // ============================================================
            // RENDER TABLE
            // ============================================================
            function renderTable() {
                var tbody = document.getElementById('tableBody');

                var onlineUsers = Object.keys(izinData)
                    .map(function(key) {
                        return izinData[key];
                    })
                    .sort(function(a, b) {
                        var orderA =
                            ROLE_ORDER[a.role] !== undefined
                                ? ROLE_ORDER[a.role]
                                : 99;

                        var orderB =
                            ROLE_ORDER[b.role] !== undefined
                                ? ROLE_ORDER[b.role]
                                : 99;

                        if (orderA !== orderB) {
                            return orderA - orderB;
                        }

                        return normalizeName(a.nama)
                            .localeCompare(
                                normalizeName(b.nama)
                            );
                    });

                if (!onlineUsers.length) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="3">
                                <div class="empty-state">
                                    <div class="icon">😴</div>
                                    <h3>Belum ada yang izin</h3>
                                </div>
                            </td>
                        </tr>
                    `;
                    return;
                }

                var nowMs = serverNowMs();
                var rowHtml = '';

                onlineUsers.forEach(function(user, index) {
                    var timing = activeTimingState(
                        user,
                        nowMs
                    );

                    var minutes = Math.floor(
                        timing.elapsed / 60
                    );

                    var seconds =
                        timing.elapsed % 60;

                    var role =
                        user.role || 'cs';

                    var roleLabel =
                        ROLE_LABELS[role] || role;

                    var timerClass =
                        timing.over
                            ? 'over-limit'
                            : timing.near
                                ? 'near-limit'
                                : '';

                    var limitClass =
                        timing.over
                            ? 'over-limit'
                            : timing.near
                                ? 'near-limit'
                                : timing.threshold
                                    ? ''
                                    : 'pending';

                    var delay = index * 0.06;
                    var safeName = escapeHtml(user.nama);
                    var safeRole = escapeHtml(role);
                    var safeOffice = escapeHtml(
                        activeOfficeName(user)
                    );

                    var limitText = timing.threshold
                        ? (
                            '<strong>Batas ' +
                            escapeHtml(
                                formatClockHHMM(
                                    timing.deadline
                                )
                            ) +
                            '</strong> · ' +
                            Math.max(
                                1,
                                Math.round(
                                    timing.threshold / 60
                                )
                            ) +
                            'm'
                        )
                        : '<strong>Batas …</strong>';

                    rowHtml += `
                        <tr style="animation: fadeIn 0.25s ease ${delay}s both;">
                            <td class="col-nama">
                                <span class="name-status">
                                    <span class="name-status-dot" aria-hidden="true"></span>
                                    <span class="nama-cell">${safeName}</span>
                                </span>
                            </td>
                            <td class="col-role">
                                <span class="role-stack">
                                    <span class="role-tag ${safeRole}">${escapeHtml(roleLabel)}</span>
                                    <span class="office-line ${user.office_name ? '' : 'pending'}">${safeOffice}</span>
                                </span>
                            </td>
                            <td class="col-durasi">
                                <span class="duration-stack">
                                    <span
                                        class="timer-cell ${timerClass}"
                                        data-nama="${escapeHtml(normalizeName(user.nama))}"
                                    >${minutes}m ${String(seconds).padStart(2, '0')}s</span>
                                    <span
                                        class="limit-line ${limitClass}"
                                        data-limit-nama="${escapeHtml(normalizeName(user.nama))}"
                                    >${limitText}</span>
                                </span>
                            </td>
                        </tr>
                    `;
                });

                tbody.innerHTML = rowHtml;
            }

            // ============================================================
            // COUNTS / TIMERS
            // ============================================================
            function updateOnlineCount() {
                document.getElementById('totalOnline').textContent =
                    Object.keys(izinData).length;
            }

            function updateTimers() {
                var nowMs = serverNowMs();

                document
                    .querySelectorAll('.timer-cell[data-nama]')
                    .forEach(function(el) {
                        var key = el.getAttribute('data-nama');
                        var data = izinData[key];

                        if (!data || !data.mulai) return;

                        var timing = activeTimingState(
                            data,
                            nowMs
                        );

                        var minutes = Math.floor(
                            timing.elapsed / 60
                        );

                        var seconds =
                            timing.elapsed % 60;

                        el.textContent =
                            minutes +
                            'm ' +
                            String(seconds).padStart(2, '0') +
                            's';

                        el.className =
                            'timer-cell' +
                            (
                                timing.over
                                    ? ' over-limit'
                                    : timing.near
                                        ? ' near-limit'
                                        : ''
                            );

                        var limit = document.querySelector(
                            '.limit-line[data-limit-nama="' +
                            CSS.escape(key) +
                            '"]'
                        );

                        if (!limit) return;

                        if (!timing.threshold) {
                            limit.className =
                                'limit-line pending';
                            limit.innerHTML =
                                '<strong>Batas …</strong>';
                            return;
                        }

                        limit.className =
                            'limit-line' +
                            (
                                timing.over
                                    ? ' over-limit'
                                    : timing.near
                                        ? ' near-limit'
                                        : ''
                            );

                        limit.innerHTML =
                            '<strong>Batas ' +
                            escapeHtml(
                                formatClockHHMM(
                                    timing.deadline
                                )
                            ) +
                            '</strong> · ' +
                            Math.max(
                                1,
                                Math.round(
                                    timing.threshold / 60
                                )
                            ) +
                            'm';
                    });
            }

            // ============================================================
            // SERVER CLOCK DISPLAY + PHASE-LOCKED HEARTBEAT
            // ============================================================
            function updateClock() {
                var now = serverNowDate();
                var el = document.getElementById('clockDisplay');

                if (!el) return;

                el.textContent =
                    String(now.getHours()).padStart(2, '0') + ':' +
                    String(now.getMinutes()).padStart(2, '0') + ':' +
                    String(now.getSeconds()).padStart(2, '0');

                el.setAttribute(
                    'data-clock-source',
                    serverClockState.ready
                        ? 'server'
                        : 'local'
                );

                el.title =
                    serverClockState.ready
                        ? 'Waktu server'
                        : 'Menunggu sinkronisasi waktu server';
            }

            function stopHeartbeat() {
                if (heartbeatTimer) {
                    clearTimeout(heartbeatTimer);
                    heartbeatTimer = null;
                }
            }

            function scheduleHeartbeat() {
                stopHeartbeat();

                if (document.hidden) return;

                /*
                 * Align UI updates to the next SERVER second boundary.
                 * This removes the arbitrary setInterval phase difference
                 * that made Live View appear 1–3 seconds behind Dashboard.
                 */
                var nowMs = serverNowMs();
                var remainder = ((nowMs % 1000) + 1000) % 1000;
                var delay = Math.max(
                    35,
                    Math.round(1000 - remainder + 18)
                );

                heartbeatTimer = setTimeout(function() {
                    heartbeatTimer = null;

                    if (!document.hidden) {
                        updateClock();
                        updateTimers();
                    }

                    scheduleHeartbeat();
                }, delay);
            }

            function startClock() {
                updateClock();
                updateTimers();
                scheduleHeartbeat();
            }

            // ============================================================
            // INIT
            // ============================================================
            document.addEventListener(
                'DOMContentLoaded',
                function() {
                    console.log('🚀 Live View - DOM Ready');

                    startClock();

                    // Clock sync and data load can begin in parallel.
                    syncServerClock({ samples: 3 });
                    loadPublicData(true);
                    subscribeRealtime();

                    setInterval(function() {
                        if (document.visibilityState === 'visible') {
                            loadPublicData(true);
                        }
                    }, FALLBACK_REFRESH_MS);

                    setInterval(function() {
                        if (
                            document.visibilityState === 'visible' &&
                            navigator.onLine
                        ) {
                            syncServerClock({ samples: 1 });
                        }
                    }, SERVER_CLOCK_RESYNC_MS);

                    document.addEventListener(
                        'visibilitychange',
                        function() {
                            if (document.visibilityState === 'visible') {
                                resyncClockIfUseful();
                                updateClock();
                                updateTimers();
                                scheduleHeartbeat();

                                if (
                                    Date.now() -
                                    lastSuccessfulLoad >
                                    60000
                                ) {
                                    loadPublicData(true);
                                }
                            } else {
                                stopHeartbeat();
                            }
                        }
                    );

                    window.addEventListener(
                        'pageshow',
                        resyncClockIfUseful
                    );

                    window.addEventListener(
                        'online',
                        function() {
                            resyncClockIfUseful();

                            if (
                                document.visibilityState ===
                                'visible'
                            ) {
                                loadPublicData(true);
                            }

                            scheduleRealtimeReconnect();
                        }
                    );

                    window.addEventListener(
                        'offline',
                        function() {
                            setLiveStatus(
                                'offline',
                                'OFFLINE'
                            );
                        }
                    );
                }
            );

            window.addEventListener(
                'beforeunload',
                function() {
                    stopHeartbeat();

                    if (realtimeReconnectTimer) {
                        clearTimeout(realtimeReconnectTimer);
                        realtimeReconnectTimer = null;
                    }

                    if (realtimeChannel) {
                        supabaseClient.removeChannel(
                            realtimeChannel
                        );
                        realtimeChannel = null;
                    }
                }
            );
        })();
    </script>

</body>
</html>
