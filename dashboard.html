        const WIB_OFFSET = 7; // WIB = UTC+7

        /**
         * Konversi string ISO ke Date dengan zone WIB
         * Gunakan ini untuk semua operasi tanggal
         */
        function parseDateWIB(dateStr) {
            if (!dateStr) return null;
            // Pastikan string memiliki timezone info
            let str = dateStr;
            if (!str.endsWith('Z') && !str.includes('+')) {
                str = str + 'Z';
            }
            const date = new Date(str);
            // Tambahkan offset WIB untuk display
            return date;
        }

        /**
         * Mendapatkan tanggal WIB (hari ini) dalam format DateString
         */
        function getTodayWIB() {
            const now = new Date();
            // Konversi ke WIB
            const wibDate = new Date(now.getTime() + (WIB_OFFSET * 60 * 60 * 1000));
            return wibDate.toDateString();
        }

        /**
         * Mendapatkan tanggal WIB dari string ISO
         */
        function getDateStringWIB(isoStr) {
            if (!isoStr) return null;
            const date = parseDateWIB(isoStr);
            if (!date) return null;
            // Tambahkan offset WIB
            const wibDate = new Date(date.getTime() + (WIB_OFFSET * 60 * 60 * 1000));
            return wibDate.toDateString();
        }

        /**
         * Format tanggal WIB untuk display
         */
        function formatDateWIB(isoStr) {
            if (!isoStr) return '-';
            const date = parseDateWIB(isoStr);
            if (!date) return '-';
            // Tambahkan offset WIB
            const wibDate = new Date(date.getTime() + (WIB_OFFSET * 60 * 60 * 1000));
            return wibDate.toLocaleDateString('id-ID', {
                day: '2-digit',
                month: 'short',
                year: 'numeric'
            });
        }

        /**
         * Format waktu WIB untuk display
         */
        function formatTimeWIB(isoStr) {
            if (!isoStr) return '-';
            const date = parseDateWIB(isoStr);
            if (!date) return '-';
            // Tambahkan offset WIB
            const wibDate = new Date(date.getTime() + (WIB_OFFSET * 60 * 60 * 1000));
            return wibDate.toLocaleTimeString('id-ID', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        /**
         * Format tanggal WIB untuk filter (YYYY-MM-DD)
         */
        function getDateInputWIB(isoStr) {
            if (!isoStr) return '';
            const date = parseDateWIB(isoStr);
            if (!date) return '';
            const wibDate = new Date(date.getTime() + (WIB_OFFSET * 60 * 60 * 1000));
            const year = wibDate.getFullYear();
            const month = String(wibDate.getMonth() + 1).padStart(2, '0');
            const day = String(wibDate.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        /**
         * Mendapatkan timestamp ISO untuk database (selalu UTC)
         */
        function getISOTimeWIB(date) {
            // Kurangi offset WIB untuk simpan di UTC
            const utcDate = new Date(date.getTime() - (WIB_OFFSET * 60 * 60 * 1000));
            return utcDate.toISOString();
        }

        // ============================================================
        // REALTIME SUBSCRIPTION
        // ============================================================
        function subscribeToIzinChanges() {
            if (realtimeChannel) {
                supabaseDashboard.removeChannel(realtimeChannel);
                realtimeChannel = null;
            }

            console.log('🔌 Subscribing to izin_anggota changes...');

            realtimeChannel = supabaseDashboard
                .channel('izin_anggota_changes')
                .on(
                    'postgres_changes', {
                        event: '*',
                        schema: 'public',
                        table: 'izin_anggota'
                    },
                    (payload) => {
                        console.log('🔄 Real-time update received:', payload);

                        const { eventType, new: newRecord, old: oldRecord } = payload;

                        if (eventType === 'INSERT' || eventType === 'UPDATE') {
                            const nama = newRecord.nama;
                            if (dataIzin[nama]) {
                                dataIzin[nama].status = newRecord.status || 'none';

                                if (newRecord.mulai) {
                                    let mulaiStr = newRecord.mulai;
                                    if (!mulaiStr.endsWith('Z') && !mulaiStr.includes('+')) {
                                        mulaiStr = mulaiStr + 'Z';
                                    }
                                    dataIzin[nama].mulai = mulaiStr;
                                } else {
                                    dataIzin[nama].mulai = null;
                                }

                                dataIzin[nama].tanggal = newRecord.tanggal;
                                dataIzin[nama].selesai = newRecord.selesai;

                                console.log(
                                    `✅ Updated ${nama}: status=${newRecord.status}, mulai=${dataIzin[nama].mulai}`
                                    );
                            }
                        } else if (eventType === 'DELETE') {
                            const nama = oldRecord.nama;
                            if (dataIzin[nama]) {
                                dataIzin[nama].status = 'none';
                                dataIzin[nama].mulai = null;
                                dataIzin[nama].tanggal = null;
                                dataIzin[nama].selesai = null;
                                console.log(`✅ Removed ${nama} from izin list`);
                            }
                        }

                        renderAll();
                        updateCurrentCounts();
                        console.log('🔄 Dashboard updated via real-time subscription');
                    }
                )
                .subscribe((status) => {
                    console.log('📡 Subscription status:', status);
                });

            return realtimeChannel;
        }

        // ============================================================
        // LOAD DATA DARI DATABASE
        // ============================================================
        async function loadDataFromDatabase() {
            if (isLoading) return;
            isLoading = true;

            isDataReady = false;
            disableStartButtons();

            try {
                console.log('📥 Loading data from database...');

                // 1. Load users
                const { data: usersData, error: usersError } = await supabaseDashboard
                    .from('users')
                    .select('*');

                if (!usersError && usersData && usersData.length > 0) {
                    listUsers = usersData;
                    daftarAnggota = usersData.map(u => u.name);

                    usersData.forEach(user => {
                        const nama = user.name;
                        if (!dataIzin[nama]) {
                            dataIzin[nama] = {
                                status: 'none',
                                mulai: null,
                                selesai: null,
                                tanggal: null,
                                role: user.role
                            };
                        } else {
                            dataIzin[nama].role = user.role;
                        }
                    });
                    console.log(`✅ ${usersData.length} users loaded`);
                } else {
                    console.log('⚠️ No users found in database');
                }

                // 2. 🔥 FIX: Load ALL history data (no date filter) - preserve all data
                try {
                    const { data: historyDataDB, error: historyError } = await supabaseDashboard
                        .from('history')
                        .select('*')
                        .order('mulai', { ascending: false });

                    if (!historyError && historyDataDB) {
                        historyData = historyDataDB.map(h => ({
                            nama: h.nama,
                            tanggal: h.tanggal,
                            mulai: h.mulai,
                            selesai: h.selesai,
                            status: h.status || 'selesai',
                            role: h.role || 'cs',
                            durasiDetik: h.durasi_detik || 0,
                            isQuotaValid: h.is_quota_valid !== undefined ? h.is_quota_valid : true
                        }));
                        console.log(`✅ ${historyDataDB.length} history loaded (ALL DATA preserved)`);
                    } else {
                        console.log('⚠️ No history found');
                        historyData = [];
                    }
                } catch (err) {
                    console.log('⚠️ History table error:', err.message);
                    historyData = [];
                }

                // 3. Load izin aktif
                try {
                    const { data: izinData, error: izinError } = await supabaseDashboard
                        .from('izin_anggota')
                        .select('*');

                    if (!izinError && izinData) {
                        console.log(`📋 Found ${izinData.length} izin records in database`);

                        daftarAnggota.forEach(nama => {
                            if (dataIzin[nama]) {
                                dataIzin[nama].status = 'none';
                                dataIzin[nama].mulai = null;
                                dataIzin[nama].tanggal = null;
                                dataIzin[nama].selesai = null;
                            }
                        });

                        let aktifCount = 0;
                        izinData.forEach(item => {
                            if (dataIzin[item.nama]) {
                                dataIzin[item.nama].status = item.status || 'none';
                                if (item.mulai) {
                                    let mulaiStr = item.mulai;
                                    if (!mulaiStr.endsWith('Z') && !mulaiStr.includes('+')) {
                                        mulaiStr = mulaiStr + 'Z';
                                    }
                                    dataIzin[item.nama].mulai = mulaiStr;
                                } else {
                                    dataIzin[item.nama].mulai = null;
                                }
                                dataIzin[item.nama].tanggal = item.tanggal;
                                dataIzin[item.nama].selesai = item.selesai;
                                if (item.status === 'izin' && item.mulai) {
                                    aktifCount++;
                                    console.log(`✅ User ${item.nama} sedang izin sejak ${item.mulai}`);
                                }
                            }
                        });
                        console.log(`✅ ${aktifCount} users sedang izin (aktif)`);
                    }
                } catch (err) {
                    console.log('⚠️ Izin table error:', err.message);
                }

                // 4. Load voucher
                try {
                    const { data: voucherDataDB, error: voucherError } = await supabaseDashboard
                        .from('vouchers')
                        .select('*');

                    if (!voucherError && voucherDataDB) {
                        voucherData = {};

                            voucherData[v.nama] = v.jumlah || 0;

                    }
                } catch (err) {
                    console.log('⚠️ Voucher table error:', err.message);

                }

                // 5. Load settings
                try {
                    const { data: settingsData, error: settingsError } = await supabaseDashboard
                        .from('settings')
                        .select('*');

                    if (!settingsError && settingsData && settingsData.length > 0) {
                        settingsData.forEach(setting => {
                            if (setting.key === 'role_limits') {
                                try {
                                    limits = JSON.parse(setting.value);

                            }
                            if (setting.key === 'izin_settings') {
                                try {
                                    const izinSettings = JSON.parse(setting.value);
                                    if (izinSettings.jackpotLimitMinutes) {
                                        jackpotLimitMinutes = izinSettings.jackpotLimitMinutes;
                                    }
                                    if (izinSettings.maxIzinPerRole) {
                                        maxIzinPerRole = izinSettings.maxIzinPerRole;
                                    }
                                    updateSettingsUI();
                                    console.log('✅ izin_settings loaded');
                                } catch (e) { console.log('⚠️ Failed to parse izin_settings'); }
                            }
                            if (setting.key === 'ticker_settings') {
                                try {
                                    const tickerSettings = JSON.parse(setting.value);
                                    if (tickerSettings.items && Array.isArray(tickerSettings.items)) {
                                        tickerItems = tickerSettings.items;
                                    }
                                    if (tickerSettings.speed) {
                                        tickerSpeed = tickerSettings.speed;
                                    }
                                    updateTickerUI();
                                    updateTickerSpeedUI();
                                    console.log('✅ ticker_settings loaded');
                                } catch (e) { console.log('⚠️ Failed to parse ticker_settings'); }
                            }
                            if (setting.key === 'whitelist_ip') {
                                const input = document.getElementById('ipWhitelistInput');
                                if (input) input.value = setting.value || '0.0.0.0';
                                console.log('✅ whitelist_ip loaded');
                            }
                        });
                    } else {
                        console.log('⚠️ No settings found, using defaults');
                        const defaultSettings = [
                            { key: 'role_limits', value: JSON.stringify(DEFAULT_LIMITS) },
                            { key: 'izin_settings', value: JSON.stringify({ jackpotLimitMinutes: 15,
                                    maxIzinPerRole: DEFAULT_MAX_IZIN }) },
                            { key: 'whitelist_ip', value: '0.0.0.0' },
                            { key: 'ticker_settings', value: JSON.stringify({ items: DEFAULT_TICKER_ITEMS,
                                    speed: 30 }) }
                        ];
                        for (const setting of defaultSettings) {

        async function checkIPAccess() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                const userIP = data.ip;
                const { data: settings, error } = await supabaseDashboard
                    .from('settings')
                    .select('value')
                    .eq('key', 'whitelist_ip')
                    .maybeSingle();

                if (error) return;
                const whitelistIPs = settings?.value?.split(',').map(ip => ip.trim()) || ['0.0.0.0'];
                if (!whitelistIPs.includes(userIP) && whitelistIPs[0] !== '0.0.0.0') {
                    console.warn(`⚠️ IP ${userIP} tidak terdaftar di whitelist`);
                }
            } catch (err) {
                console.error('Gagal cek IP:', err);
            }
        }

        // ============================================================
        // AUTHENTICATION
        // ============================================================
        async function checkAuth() {
            isDataReady = false;

            console.log('🔍 checkAuth - Memulai...');

            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const hash = window.location.hash;

            try {
                const { data: { session } } = await supabaseDashboard.auth.getSession();

                if (session?.user?.email) {
                    const isRegistered = await checkUserRegistered(session.user.email);
                    if (!isRegistered) {
                        console.log('❌ User tidak terdaftar, tampilkan popup...');
                        showNotRegisteredPopup(session.user.email);
                        return;
                    }
                }
            } catch (err) {
                console.error('❌ Error checking user registration:', err);
                showNotRegisteredPopup('unknown@email.com');
                return;
            }

            if (code || (hash && hash.includes('access_token'))) {
                console.log('🔑 Detected OAuth redirect, processing...');
                try {
                    const { data, error } = await supabaseDashboard.auth.getSession();

                    if (error) {
                        console.error('❌ Error getting session after redirect:', error);
                        showNotRegisteredPopup('error@email.com');
                        return;
                    }

                    if (data?.session) {
                        console.log('✅ Session found after redirect for:', data.session.user.email);
                        currentUser = data.session.user;
                        window.history.replaceState({}, document.title, window.location.pathname);

                        renderTicker();
                        await loadDataFromDatabase();
                        await checkIPAccess();
                        await syncUserRoleFromDatabase();
                        updateUserUI();
                        updateProfileDropdown();
                        renderAll();
                        startTimerUpdates();
                        startClock();
                        console.log('✅ Dashboard siap!');
                        return;
                    } else {
                        console.log('⏳ No session yet after redirect, waiting...');
                        setTimeout(() => {
                            window.location.reload();
                        }, 1000);
                        return;
                    }
                } catch (err) {
                    console.error('❌ Error processing redirect:', err);
                    showNotRegisteredPopup('error@email.com');
                    return;
                }
            }

            if (TEST_MODE) {
                console.log('🧪 TEST MODE - Bypassing login...');
                currentUser = {
                    email: 'test@leader.com',
                    user_metadata: { full_name: 'Test Leader' }
                };
                currentUserRole = 'leader';
                userPermissions = ROLE_PERMISSIONS.leader;

                // ... (TEST MODE setup)
                return;
            }

            try {
                const { data: { session }, error } = await supabaseDashboard.auth.getSession();

                if (error) {
                    console.error('❌ Session error:', error);
                    showToast('❌ Error session: ' + error.message, 'error', 5000);
                    return;
                }

                if (!session) {
                    console.log('❌ No session found, redirecting to login...');
                    window.location.href = '/';
                    return;
                }

                currentUser = session.user;

                if (!currentUser) {
                    console.error('❌ No user found');
                    window.location.href = '/';
                    return;
                }

                console.log('✅ User authenticated:', currentUser.email);

                const isRegistered = await checkUserRegistered(currentUser.email);
                if (!isRegistered) {
                    return;
                }

                renderTicker();
                await loadDataFromDatabase();
                await checkIPAccess();
                await syncUserRoleFromDatabase();
                updateUserUI();
                updateProfileDropdown();
                startTimerUpdates();
                startClock();

                console.log('✅ Dashboard siap!');

            } catch (err) {
                console.error('❌ Error checkAuth:', err);
                showToast('❌ Error: ' + err.message, 'error', 5000);
            }
        }

        // ============================================================
        // SYNC USER ROLE
        // ============================================================
        async function syncUserRoleFromDatabase() {
            if (!currentUser || !currentUser.email) {
                console.warn('⚠️ Tidak ada user untuk sync role');
                return;
            }

            try {
                const formattedEmail = formatEmail(currentUser.email);
                console.log(`🔍 Mencari role untuk email: ${formattedEmail}`);

                const userFromDB = listUsers.find(u => u.email === formattedEmail);

                if (userFromDB && userFromDB.role) {
                    currentUserRole = userFromDB.role;
                    userPermissions = ROLE_PERMISSIONS[currentUserRole] || ROLE_PERMISSIONS.cs;
                    console.log(`✅ Role ditemukan di database: ${currentUserRole}`);
                    currentUser = { ...currentUser, ...userFromDB };
                } else {
                    console.log('⚠️ User tidak ditemukan di listUsers, mencoba query langsung...');
                    const { data: userData, error: userError } = await supabaseDashboard
                        .from('users')
                        .select('*')
                        .eq('email', formattedEmail)
                        .maybeSingle();

                    if (userError) {
                        console.error('❌ Error query user:', userError);
                        currentUserRole = 'cs';
                        userPermissions = ROLE_PERMISSIONS.cs;
                        return;
                    }

                    if (userData) {
                        currentUserRole = userData.role || 'cs';
                        userPermissions = ROLE_PERMISSIONS[currentUserRole] || ROLE_PERMISSIONS.cs;
                        currentUser = { ...currentUser, ...userData };
                        console.log(`✅ Role ditemukan via query langsung: ${currentUserRole}`);

                        if (!listUsers.some(u => u.email === formattedEmail)) {
                            listUsers.push(userData);
                            daftarAnggota.push(userData.name);
                            dataIzin[userData.name] = {
                                status: 'none',
                                mulai: null,
                                selesai: null,
                                tanggal: null,
                                role: userData.role
                            };
                        }
                    } else {
                        console.warn('⚠️ User tidak ditemukan di database, set default cs');
                        currentUserRole = 'cs';
                        userPermissions = ROLE_PERMISSIONS.cs;
                    }
                }
            } catch (err) {
                console.error('❌ Error sync role:', err);
                currentUserRole = 'cs';
                userPermissions = ROLE_PERMISSIONS.cs;
            }
        }

        // ============================================================
        // FUNGSI IZIN - DENGAN TIMEZONE WIB
        // ============================================================
        window.mulaiIzin = async function(nama) {
            const formattedNama = formatName(nama);
            const isLeaderOrCsLine = currentUserRole === 'leader' || currentUserRole === 'csline' || currentUserRole ===
                'admin';
            const isCurrentUser = isUserCurrent(formattedNama);

            if (!isLeaderOrCsLine && !isCurrentUser) {
                showToast(`⚠️ Anda hanya bisa mengklik START untuk diri Anda sendiri!`, 'warning');
                return;
            }

            if (!canIzinByDailyLimit(formattedNama)) {
                const used = getUsedIzinToday(formattedNama);
                const maxQuota = getMaxQuota(formattedNama);
                showToast(`⚠️ ${formattedNama} sudah mencapai batas maksimum izin hari ini (${used}/${maxQuota})!`,
                    'error');
                return;
            }

            const now = new Date();
            const data = dataIzin[formattedNama];
            // 🔥 Gunakan WIB untuk tanggal
            const todayWIB = getTodayWIB();

            if (data.status === 'izin') {
                showToast('⚠️ User sedang dalam izin! Klik END terlebih dahulu.', 'warning');
                return;
            }

            if (!TEST_MODE) {
                try {
                    const role = getRoleForUser(formattedNama);
                    // 🔥 Simpan waktu UTC di database
                    const mulaiISO = getISOTimeWIB(now);

                    const { data: result, error: rpcError } = await supabaseDashboard.rpc(
                        'start_izin', {
                            p_nama: formattedNama,
                            p_role: role,
                            p_tanggal: todayWIB,
                            p_mulai: mulaiISO
                        }
                    );

                    if (rpcError) {
                        console.error('❌ RPC Error:', rpcError);
                        showToast(`❌ Gagal memulai izin: ${rpcError.message}`, 'error');
                        return;
                    }

                    const resultData = typeof result === 'string' ? JSON.parse(result) : result;

                    if (!resultData.success) {
                        showToast(`⚠️ ${resultData.message}`, 'warning', 4000);

                        if (resultData.message && resultData.message.includes('Kuota penuh')) {
                            const roleLabel = ROLE_LABELS[role] || role;
                            const currentCount = resultData.current_count || 0;
                            const limit = resultData.limit || 0;

                            document.getElementById('popupMessage').innerHTML =
                                `Mohon menunggu beberapa saat kedepan <br /><span class="highlight">PS:</span> apabila urgent dapat konfirmasi ke <strong>Kapten</strong>.`;
                            document.getElementById('popupCurrentCount').textContent = currentCount;
                            document.getElementById('popupFooter').innerHTML =
                                `💡 Role <strong>${roleLabel}</strong> saat ini <span id="popupCurrentCount">${currentCount}</span> dari <strong>${limit}</strong> user sedang izin`;
                            document.getElementById('popupLimit').classList.add('show');
                        }
                        return;
                    }

                    isJackpotShown[formattedNama] = false;
                    data.status = 'izin';
                    data.mulai = mulaiISO;
                    data.selesai = null;
                    data.tanggal = todayWIB;
                    dataIzin[formattedNama] = data;

                    renderAll();
                    updateCurrentCounts();
                    showToast(`▶️ ${formattedNama} mulai izin!`, 'info');

                    await loadDataFromDatabase();
                    renderAll();

                } catch (err) {
                    console.error('❌ Error:', err);
                    showToast('❌ Gagal memulai izin: ' + err.message, 'error');
                }
                return;
            }

            // TEST MODE
            isJackpotShown[formattedNama] = false;
            data.status = 'izin';
            data.mulai = getISOTimeWIB(now);
            data.selesai = null;
            data.tanggal = todayWIB;
            dataIzin[formattedNama] = data;

            renderAll();
            updateCurrentCounts();
            showToast(`▶️ ${formattedNama} mulai izin!`, 'info');
        };

        // ============================================================
        // FUNGSI SELESAI IZIN - DENGAN TIMEZONE WIB & LOCK
        // ============================================================
        window.selesaiIzin = async function(nama) {
            const formattedNama = formatName(nama);
            
            // 🔥 PREVENT DOUBLE END
            if (endLock[formattedNama]) {
                console.log(`🔒 ${formattedNama} sedang diproses, abaikan klik ganda`);
                showToast(`⏳ ${formattedNama} sedang diproses, mohon tunggu...`, 'warning', 1500);
                return;
            }

            const isLeaderOrCsLine = currentUserRole === 'leader' || currentUserRole === 'csline' || currentUserRole === 'admin';
            const isCurrentUser = isUserCurrent(formattedNama);

            if (!isLeaderOrCsLine && !isCurrentUser) {
                showToast(`⚠️ Anda hanya bisa mengklik END untuk diri Anda sendiri!`, 'warning');
                return;
            }

            const data = dataIzin[formattedNama];
            if (data.status !== 'izin') {
                showToast('⚠️ User belum dalam status izin!', 'warning');
                return;
            }

            // 🔥 Lock untuk mencegah double-click
            endLock[formattedNama] = true;
            
            // 🔥 Disable tombol END sementara
            const endButtons = document.querySelectorAll(`.btn-action.end[onclick*="${formattedNama}"]`);
            endButtons.forEach(btn => {
                btn.disabled = true;
                btn.style.opacity = '0.5';
                btn.textContent = '⏳ ...';
            });

            try {
                const now = new Date();
                // 🔥 Gunakan WIB untuk selesai
                const selesaiISO = getISOTimeWIB(now);
                const mulaiDate = parseDateWIB(data.mulai);
                const durasiDetik = Math.floor((now.getTime() - mulaiDate.getTime()) / 1000);

                const batasDetik = (jackpotLimitMinutes * 60) - 1;
                const isOverLimit = durasiDetik > batasDetik;

                // 🔥 Simpan data sebelum diubah
                const currentData = { ...data };
                const todayWIB = getTodayWIB();

                // 🔥 Update status
                data.status = 'selesai';
                data.selesai = selesaiISO;

                const isQuotaValid = durasiDetik >= MIN_IZIN_DURATION_SECONDS;

                // 🔥 Buat history entry dengan WIB
                const historyEntry = {
                    nama: formattedNama,
                    tanggal: todayWIB,
                    mulai: data.mulai,
                    selesai: data.selesai,
                    status: 'selesai',
                    role: getRoleForUser(formattedNama),
                    durasiDetik: durasiDetik,
                    isQuotaValid: isQuotaValid
                };

                // 🔥 Update history
                historyData.push(historyEntry);
                historyData.sort((a, b) => new Date(b.mulai) - new Date(a.mulai));

                // 🔥 Update quota
                if (isQuotaValid) {
                    const usedCount = getUsedIzinToday(formattedNama);
                    const maxQuota = getMaxQuota(formattedNama);

                    if (!quotaData[formattedNama] || quotaData[formattedNama].date !== todayWIB) {
                        quotaData[formattedNama] = { count: 0, date: todayWIB };
                    }
                    quotaData[formattedNama].count = Math.min(usedCount, maxQuota);
                }

                // 🔥 Handle jackpot
                if (isOverLimit) {
                    addVoucher(formattedNama);
                    pendingVoucherClaim = formattedNama;
                }

                dataIzin[formattedNama] = data;

                // 🔥 SAVE TO DATABASE
                if (!TEST_MODE) {
                    try {
                        // Update izin_anggota
                        await supabaseDashboard
                            .from('izin_anggota')
                            .upsert({
                                nama: formattedNama,
                                status: 'selesai',
                                mulai: data.mulai,
                                selesai: data.selesai,
                                tanggal: todayWIB,
                                role: getRoleForUser(formattedNama)
                            }, { onConflict: 'nama' });

                        // Insert history
                        await supabaseDashboard
                            .from('history')
                            .insert({
                                nama: formattedNama,
                                tanggal: todayWIB,
                                mulai: data.mulai,
                                selesai: data.selesai,
                                status: 'selesai',
                                role: getRoleForUser(formattedNama),
                                durasi_detik: durasiDetik,
                                is_quota_valid: isQuotaValid
                            });

                        console.log(`✅ ${formattedNama} selesai izin, tersimpan di database`);

                    } catch (err) {
                        console.error('❌ Error simpan ke database:', err);
                        showToast(`⚠️ Gagal simpan ke database, tapi data tetap tersimpan di lokal`, 'warning', 3000);
                    }
                }

                // 🔥 Render UI
                renderAll();
                updateCurrentCounts();
                updateQuickStats();

                // 🔥 Show toast
                const menit = Math.floor(durasiDetik / 60);
                const detik = durasiDetik % 60;
                const used = getUsedIzinToday(formattedNama);
                const maxQuota = getMaxQuota(formattedNama);

                let pesan = `⏹️ Izin selesai! Durasi: ${menit}m ${detik}s`;

                if (!isQuotaValid) {
                    pesan += ` ⚠️ (Di bawah 2 menit, tidak mengurangi quota)`;
                    showToast(pesan, 'warning', 4000);
                } else {
                    pesan += ` ✅ Quota: ${used}/${maxQuota}`;
                    if (isOverLimit) {
                        pesan += ` 🎫 +1 Voucher!`;
                    }
                    showToast(pesan, 'success', 4000);
                }

                // 🔥 Show jackpot
                if (isOverLimit && !isJackpotShown[formattedNama]) {
                    isJackpotShown[formattedNama] = true;
                    setTimeout(() => {
                        showJackpot();
                    }, 500);
                }

            } catch (err) {
                console.error('❌ Error selesai izin:', err);
                showToast('❌ Gagal menyelesaikan izin: ' + err.message, 'error');
            } finally {
                // 🔥 Unlock setelah selesai
                setTimeout(() => {
                    endLock[formattedNama] = false;
                    // 🔥 Refresh tombol END
                    const endButtons = document.querySelectorAll(`.btn-action.end[onclick*="${formattedNama}"]`);
                    endButtons.forEach(btn => {
                        btn.disabled = false;
                        btn.style.opacity = '1';
                        btn.innerHTML = '<span class="icon">■</span> END';
                    });
                }, 1000);

                // 🔥 Reload data dari database untuk sync
                setTimeout(() => {
                    loadDataFromDatabase();
                }, 500);
            }
        };

        function updateStatsAndBadges() {
            let totalIzin = 0;

            daftarAnggota.forEach(nama => {
                const d = dataIzin[nama];
                if (d && d.status === 'izin') totalIzin++;
            });

            // 🔥 History hari ini menggunakan WIB

            const todayHistory = historyData.filter(h => {

                return historyDateWIB === todayWIB;
            });

            const badgeIzin = document.getElementById('sidebarBadgeIzin');
            const badgeTotal = document.getElementById('sidebarBadgeTotal');
            const badgeHistory = document.getElementById('sidebarBadgeHistory');

        // ============================================================
        // RENDER LIVE IZIN
        // ============================================================
        function renderLiveIzin() {
            const roleMap = {
                csline: document.getElementById('liveCsline'),
                cs: document.getElementById('liveCs'),
                kapten: document.getElementById('liveKapten'),
                kasir: document.getElementById('liveKasir')
            };

            const countMap = {
                csline: document.getElementById('countCsline'),
                cs: document.getElementById('countCs'),
                kapten: document.getElementById('countKapten'),
                kasir: document.getElementById('countKasir')
            };

            const visualIcons = ['🏃', '🚶', '🏊', '🧘', '🤸', '🏋️', '🧗', '🚴', '🕺', '💃'];

            Object.keys(roleMap).forEach(role => {
                if (roleMap[role]) roleMap[role].innerHTML = '';
                if (countMap[role]) countMap[role].textContent = '0';
            });

            const izinList = daftarAnggota
                .filter(nama => dataIzin[nama] && dataIzin[nama].status === 'izin')
                .map(nama => ({
                    nama: formatName(nama),
                    mulai: dataIzin[nama].mulai,
                    role: getRoleForUser(nama)
                }))
                .sort((a, b) => new Date(a.mulai) - new Date(b.mulai));

            const grouped = {};
            izinList.forEach(item => {
                if (!grouped[item.role]) grouped[item.role] = [];
                grouped[item.role].push(item);
            });

            const roleKeys = ['csline', 'cs', 'kapten', 'kasir'];
            let totalIzin = 0;

            roleKeys.forEach(role => {
                const items = grouped[role] || [];
                const container = roleMap[role];
                const countEl = countMap[role];

                if (countEl) countEl.textContent = items.length;
                totalIzin += items.length;

                if (!container) return;

                if (items.length === 0) {
                    container.innerHTML = `<div class="empty-live-col">Tidak ada yang izin</div>`;
                    return;
                }

                container.innerHTML = items.map((item, index) => {
                    const startTime = parseDateWIB(item.mulai);
                    const now = new Date();
                    const diff = Math.floor((now.getTime() - startTime.getTime()) / 1000);
                    const menit = Math.floor(diff / 60);
                    const detik = diff % 60;
                    const visual = visualIcons[index % visualIcons.length];
                    const batasDetik = (jackpotLimitMinutes * 60) - 1;
                    const isOverLimit = diff > batasDetik;

                    const overLimitClass = isOverLimit ? 'over-limit' : '';
                    const timerClass = isOverLimit ? 'over-limit' : '';
                    const warningBadge = isOverLimit ?
                        `<span class="warning-badge-col">⚠️ OVER</span>` :
                        '';

                    return `
                            <div class="live-card-col ${overLimitClass}" data-nama="${item.nama}">
                                <div>
                                    <span class="visual-fun-col">${visual}</span>
                                    <span class="nama" title="${item.nama}">${item.nama}</span>
                                    ${warningBadge}
                                </div>
                                <div class="timer-col ${timerClass}" data-start="${item.mulai}">
                                    ${menit}m ${detik}s
                                </div>
                            </div>
                        `;
                }).join('');
            });

            const liveCount = document.getElementById('liveCount');
            if (liveCount) liveCount.innerHTML = `<span>${totalIzin}</span> orang sedang izin`;
        }

        // ============================================================
        // RENDER DASHBOARD TABLE
        // ============================================================
        window.renderDashboardTable = function() {
            const tbody = document.getElementById('dashboardTableBody');
            if (!tbody) return;

            const search = document.getElementById('searchInput');
            const searchValue = search ? search.value.toLowerCase().trim() : '';

            const filterRole = document.getElementById('filterRoleDashboard');
            const filterRoleValue = filterRole ? filterRole.value : '';

            let filtered = daftarAnggota.filter(nama => {
                const matchName = formatName(nama).toLowerCase().includes(searchValue);
                const matchRole = !filterRoleValue || getRoleForUser(nama) === filterRoleValue;
                return matchName && matchRole;
            });

            if (daftarAnggota.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px;">Belum ada anggota</td></tr>`;
                return;
            }

            if (filtered.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px;">Anggota tidak ditemukan</td></tr>`;
                return;
            }

            const roleOrder = { leader: 0, csline: 1, cs: 2, kapten: 3, kasir: 4 };

            filtered.sort((a, b) => {
                const statusA = dataIzin[a]?.status || 'none';
                const statusB = dataIzin[b]?.status || 'none';
                const roleA = getRoleForUser(a);
                const roleB = getRoleForUser(b);

                if (statusA === 'izin' && statusB !== 'izin') return -1;
                if (statusA !== 'izin' && statusB === 'izin') return 1;

                return (roleOrder[roleA] || 99) - (roleOrder[roleB] || 99);
            });

            const roleLabels = {
                leader: 'Leader',
                csline: 'CS Line',
                cs: 'CS',
                kapten: 'Kapten',
                kasir: 'Kasir'
            };

            const isLeaderOrCsLine = currentUserRole === 'leader' || currentUserRole === 'csline' || currentUserRole ===
                'admin';

            tbody.innerHTML = filtered.map(nama => {
                const data = dataIzin[nama];
                if (!data) return '';

                const status = data.status;
                const role = getRoleForUser(nama);
                const roleLabel = roleLabels[role] || role;

                const used = getUsedIzinToday(nama);
                const maxQuota = getMaxQuota(nama);
                const voucher = getVoucherCount(nama);

                const remaining = maxQuota - used;
                let quotaClass = '';
                if (remaining <= 0) quotaClass = 'full';
                else if (remaining <= 2) quotaClass = 'warning';
                else quotaClass = 'ok';

                let statusHTML = '';
                let timerHTML = '-';
                let actionHTML = '';
                let rowClass = '';
                let progressHTML = '-';
                let mulaiHTML = '-';

                const isCurrentUser = isUserCurrent(nama);
                const canStart = (isLeaderOrCsLine || isCurrentUser) &&
                    canUserIzinLive(nama) &&
                    used < maxQuota;

                if (status === 'izin') {
                    rowClass = 'row-online';

                    if (!data.mulai) {
                        timerHTML = '0m 0s';
                    } else {
                        const tMulai = parseDateWIB(data.mulai);
                        const now = new Date();
                        const diffMs = now.getTime() - tMulai.getTime();
                        const diff = Math.floor(diffMs / 1000);
                        const validDiff = (diff > 0 && !isNaN(diff)) ? diff : 0;

                        const menit = Math.floor(validDiff / 60);
                        const detik = validDiff % 60;

                        const batasDetik = (jackpotLimitMinutes * 60) - 1;
                        const isOverLimit = validDiff > batasDetik;

                        const maxProgressDetik = jackpotLimitMinutes * 60;
                        const progressPercent = Math.min((validDiff / maxProgressDetik) * 100, 100);

                        let progressClass = '';
                        let textClass = '';

                        if (progressPercent >= 100) {
                            progressClass = 'full';
                            textClass = 'full';
                        } else if (isOverLimit) {
                            progressClass = 'danger';
                        } else if (progressPercent > 60) {
                            progressClass = 'warning';
                        }

                        const progressFill =
                            `<div class="progress-bar-fill ${progressClass}" style="width: ${progressPercent}%;"></div>`;

                        progressHTML = `
                                <div class="progress-container">
                                    <div class="progress-bar-wrap">
                                        ${progressFill}
                                    </div>
                                    <span class="progress-text ${textClass}">${Math.round(progressPercent)}%</span>
                                </div>
                            `;

                        // 🔥 Tampilkan waktu mulai dalam WIB
                        const jamMulai = formatTimeWIB(data.mulai);
                        mulaiHTML = `<span class="time-mulai">${jamMulai}</span>`;

                        statusHTML =
                            `<span class="status-badge online"><span class="dot"></span> Online</span>`;
                        timerHTML =
                            `<span class="timer-display ${isOverLimit ? 'over-limit' : ''}">${menit}m ${detik}s</span>`;
                    }

                    const canEnd = isLeaderOrCsLine || isCurrentUser;
                    actionHTML = `
                            <button class="btn-action end" onclick="selesaiIzin('${nama}')" ${!canEnd ? 'disabled' : ''}>
                                <span class="icon">■</span> END
                            </button>
                        `;
                } else {
                    rowClass = 'row-offline';
                    statusHTML =
                        `<span class="status-badge offline"><span class="dot"></span> Offline</span>`;

                    const loadingClass = !isDataReady ? 'loading-state' : '';
                    actionHTML = `
                            <button class="btn-action start ${loadingClass}" 
                                    onclick="mulaiIzin('${nama}')" 
                                    data-nama="${nama}"
                                    ${!canStart || !isDataReady ? 'disabled' : ''}>
                                <span class="icon">▶</span> START
                            </button>
                        `;
                    progressHTML = `
                            <div class="progress-container" style="justify-content:center;">
                                <span style="color:var(--text-muted);font-size:11px;font-weight:300;">-</span>
                            </div>
                        `;
                    mulaiHTML = `<span style="color:var(--text-muted);font-size:11px;">-</span>`;
                }

                let voucherDisplay = '-';
                if (voucher > 0) {
                    voucherDisplay = `<span class="voucher-badge" data-voucher="${voucher}">
                                            <span class="icon">🎫</span> ${voucher}
                                            <div class="voucher-tooltip">
                                                <div>
                                                    <span class="tooltip-icon">🎁</span>
                                                    <span class="tooltip-title">Voucher</span>
                                                </div>
                                                <div class="tooltip-divider"></div>
                                                <div class="tooltip-desc">🎫 Kutip Sampah Office</div>
                                            </div>
                                        </span>`;
                }

                return `
                        <tr class="${rowClass}">
                            <td class="col-status">${statusHTML}</td>
                            <td class="col-nama"><span class="nama-cell">${nama}</span></td>
                            <td class="col-role" style="text-align:center;"><span class="role-tag ${role}">${roleLabel}</span></td>
                            <td class="col-quota" style="text-align:center;">
                                <span class="quota-badge-modern ${quotaClass}">
                                    <span class="used">${used}</span>
                                    <span class="separator">/</span>
                                    <span class="total">${maxQuota}</span>
                                </span>
                            </td>
                            <td class="col-voucher" style="text-align:center;">${voucherDisplay}</td>
                            <td class="col-mulai" style="text-align:center;">${mulaiHTML}</td>
                            <td class="col-progress" style="text-align:center;">
                                <div style="display:flex;flex-direction:column;gap:2px;width:100%;align-items:center;">
                                    <div style="display:flex;align-items:center;gap:6px;width:100%;justify-content:center;">
                                        <span style="font-size:11px;color:var(--text-muted);min-width:45px;font-family:'Courier New',monospace;text-align:right;">${timerHTML}</span>
                                        ${progressHTML}
                                    </div>
                                </div>
                            </td>
                            <td class="col-aksi" style="text-align:center;">${actionHTML}</td>
                        </tr>
                    `;
            }).join('');

            document.querySelectorAll('.voucher-badge').forEach(function(el) {
                var tooltip = el.querySelector('.voucher-tooltip');
                if (!tooltip) return;

                el.addEventListener('mouseenter', function(e) {
                    var rect = el.getBoundingClientRect();
                    tooltip.style.left = (rect.left + rect.width / 2 - 110) + 'px';
                    tooltip.style.top = (rect.top - 50) + 'px';
                    tooltip.classList.add('visible');
                });

                el.addEventListener('mouseleave', function() {
                    tooltip.classList.remove('visible');
                });
            });

            renderLiveIzin();
        };

        // ============================================================
        // RENDER HISTORY - DENGAN FILTER WIB
        // ============================================================
        window.renderHistory = function() {
            const tbody = document.getElementById('historyBody');
            if (!tbody) return;

            const filterNama = document.getElementById('filterNama');
            const filterTanggal = document.getElementById('filterTanggal');
            const filterRole = document.getElementById('filterRole');
            const filterBulan = document.getElementById('filterBulan');

            // 🔥 Default ke hari ini (WIB)
            if (filterTanggal && !filterTanggal.value) {
                const todayWIB = new Date(new Date().getTime() + (WIB_OFFSET * 60 * 60 * 1000));
                const year = todayWIB.getFullYear();
                const month = String(todayWIB.getMonth() + 1).padStart(2, '0');
                const day = String(todayWIB.getDate()).padStart(2, '0');
                filterTanggal.value = `${year}-${month}-${day}`;
            }

            const namaValue = filterNama ? filterNama.value : '';
            const tanggalValue = filterTanggal ? filterTanggal.value : '';
            const roleValue = filterRole ? filterRole.value : '';
            const bulanValue = filterBulan ? filterBulan.value : '';

            let filtered = [...historyData];

            if (namaValue) {
                filtered = filtered.filter(h => h.nama === formatName(namaValue));
            }
            
            // 🔥 Filter menggunakan WIB
            if (tanggalValue) {
                const [year, month, day] = tanggalValue.split('-').map(Number);
                filtered = filtered.filter(h => {
                    const historyDateWIB = getDateStringWIB(h.mulai);
                    if (!historyDateWIB) return false;
                    const hDate = new Date(historyDateWIB);
                    return hDate.getFullYear() === year && 
                           hDate.getMonth() === month - 1 && 
                           hDate.getDate() === day;
                });
            }
            
            if (roleValue) {
                filtered = filtered.filter(h => h.role === roleValue);
            }
            
            if (bulanValue) {
                const [year, month] = bulanValue.split('-').map(Number);
                filtered = filtered.filter(h => {
                    const historyDateWIB = getDateStringWIB(h.mulai);
                    if (!historyDateWIB) return false;
                    const hDate = new Date(historyDateWIB);
                    return hDate.getFullYear() === year && hDate.getMonth() === month - 1;
                });
            }

            filtered.sort((a, b) => new Date(b.mulai) - new Date(a.mulai));

            const historyCount = document.getElementById('historyCount');
            if (historyCount) historyCount.textContent = filtered.length;

            if (filtered.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px;">Belum ada data history</td></tr>`;
                return;
            }

            const roleLabels = {
                leader: '👑 Leader',
                csline: '⭐ CS Line',
                cs: '💬 CS',
                kapten: '⚓ Kapten',
                kasir: '💰 Kasir'
            };

            tbody.innerHTML = filtered.map((item, index) => {
                const durasiDetik = item.durasiDetik || 0;
                const menit = Math.floor(durasiDetik / 60);
                const detik = durasiDetik % 60;

                const batasDetik = (jackpotLimitMinutes * 60) - 1;
                const isOverLimit = durasiDetik > batasDetik;
                const roleLabel = roleLabels[item.role] || item.role;

                // 🔥 Format dengan WIB
                const tanggal = formatDateWIB(item.mulai);
                const waktuMulai = formatTimeWIB(item.mulai);
                const waktuSelesai = formatTimeWIB(item.selesai);

                let durasiText = '';
                if (menit > 0) {
                    durasiText = `${menit} menit ${detik} detik`;
                } else {
                    durasiText = `${detik} detik`;
                }

                const durasiClass = isOverLimit ? 'durasi-red' : 'durasi-green';
                const statusBadge = isOverLimit ?
                    `<span class="badge telat">❌ Telat</span>` :
                    `<span class="badge selesai">✅ Selesai</span>`;

                return `
                        <tr>
                            <td>${index + 1}</td>
                            <td><span class="nama-cell">${item.nama}</span></td>
                            <td><span class="role-tag ${item.role}">${roleLabel}</span></td>
                            <td style="font-size:12px;color:var(--text-secondary);">${tanggal}</td>
                            <td class="time-detail">${waktuMulai}</td>
                            <td class="time-detail">${waktuSelesai}</td>
                            <td class="time-detail"><span class="${durasiClass}">${durasiText}</span></td>
                            <td>${statusBadge}</td>
                        </tr>
                    `;
            }).join('');
        };

        // ============================================================
        // UPDATE FILTER NAMA
        // ============================================================
        function updateFilterNama() {
            const select = document.getElementById('filterNama');
            if (!select) return;

            const currentValue = select.value;
            const sortedAnggota = [...daftarAnggota].sort((a, b) => a.localeCompare(b));

            select.innerHTML = '<option value="">Semua Anggota</option>';
            sortedAnggota.forEach(nama => {
                select.innerHTML += `<option value="${nama}">${nama}</option>`;
            });
            select.value = currentValue;
        }

        // ============================================================
        // EXPORT HISTORY - DENGAN WIB
        // ============================================================
        window.exportHistoryBulanan = function() {
            const filterBulan = document.getElementById('filterBulan');
            if (!filterBulan || !filterBulan.value) {
                showToast('⚠️ Pilih bulan terlebih dahulu!', 'warning');
                return;
            }

            const [year, month] = filterBulan.value.split('-').map(Number);
            const monthName = new Date(year, month - 1).toLocaleString('id-ID', { month: 'long', year: 'numeric' });

            const filtered = historyData.filter(h => {
                const historyDateWIB = getDateStringWIB(h.mulai);
                if (!historyDateWIB) return false;
                const d = new Date(historyDateWIB);
                return d.getFullYear() === year && d.getMonth() === month - 1;
            });

            if (filtered.length === 0) {
                showToast(`⚠️ Tidak ada data untuk bulan ${monthName}`, 'warning');
                return;
            }

            let csv = 'No,Nama,Role,Tanggal,Mulai,Selesai,Durasi(menit),Durasi(detik),Status\n';
            filtered.forEach((item, index) => {
                const durasiDetik = item.durasiDetik || 0;
                const menit = Math.floor(durasiDetik / 60);
                const detik = durasiDetik % 60;
                const batasDetik = (jackpotLimitMinutes * 60) - 1;
                const isOverLimit = durasiDetik > batasDetik;
                const status = isOverLimit ? 'Telat' : 'Selesai';
                
                const tanggal = formatDateWIB(item.mulai);
                const waktuMulai = formatTimeWIB(item.mulai);
                const waktuSelesai = formatTimeWIB(item.selesai);
                const roleLabel = ROLE_LABELS[item.role] || item.role;

                csv +=
                    `${index+1},${item.nama},${roleLabel},${tanggal},${waktuMulai},${waktuSelesai},${menit}.${detik},${durasiDetik},${status}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `history-izin-${year}-${String(month).padStart(2, '0')}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
            showToast(`✅ Export bulan ${monthName} berhasil!`, 'success');
        };

        window.exportHistory = function() {
            if (historyData.length === 0) {
                showToast('⚠️ Tidak ada data untuk diexport!', 'warning');
                return;
            }

            let csv = 'No,Nama,Role,Tanggal,Mulai,Selesai,Durasi(menit),Durasi(detik),Status\n';
            historyData.forEach((item, index) => {
                const durasiDetik = item.durasiDetik || 0;
                const menit = Math.floor(durasiDetik / 60);
                const detik = durasiDetik % 60;
                const batasDetik = (jackpotLimitMinutes * 60) - 1;
                const isOverLimit = durasiDetik > batasDetik;
                const status = isOverLimit ? 'Telat' : 'Selesai';
                
                const tanggal = formatDateWIB(item.mulai);
                const waktuMulai = formatTimeWIB(item.mulai);
                const waktuSelesai = formatTimeWIB(item.selesai);
                const roleLabel = ROLE_LABELS[item.role] || item.role;

                csv +=
                    `${index+1},${item.nama},${roleLabel},${tanggal},${waktuMulai},${waktuSelesai},${menit}.${detik},${durasiDetik},${status}\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `history-izin-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);
            showToast('✅ CSV berhasil diexport!', 'success');
        };

        function updateClock() {
            const now = new Date();
            // 🔥 Gunakan WIB untuk display
            const wibNow = new Date(now.getTime() + (WIB_OFFSET * 60 * 60 * 1000));
            
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            const day = days[wibNow.getDay()];
            const date = wibNow.getDate();
            const month = months[wibNow.getMonth()];
            const year = wibNow.getFullYear();

            const hours = String(wibNow.getHours()).padStart(2, '0');
            const minutes = String(wibNow.getMinutes()).padStart(2, '0');
            const seconds = String(wibNow.getSeconds()).padStart(2, '0');

            const dateEl = document.getElementById('dateDisplay');
            const timeEl = document.getElementById('timeDisplay');

            if (dateEl) dateEl.textContent = `${day}, ${date} ${month}, ${year}`;
            if (timeEl) timeEl.textContent = `${hours}:${minutes}:${seconds}`;

            updateGreeting();
        }

        function updateLiveTimers() {
            const now = new Date();
            const liveCards = document.querySelectorAll('.live-card-col .timer-col');

            liveCards.forEach((el) => {
                const startTime = el.dataset.start;
                if (startTime) {
                    const tStart = parseDateWIB(startTime);
                    const diff = Math.floor((now.getTime() - tStart.getTime()) / 1000);
                    const menit = Math.floor(diff / 60);
                    const detik = diff % 60;
                    const batasDetik = (jackpotLimitMinutes * 60) - 1;
                    const isOverLimit = diff > batasDetik;

                    if (isOverLimit) {
                        el.classList.add('over-limit');
                        el.closest('.live-card-col')?.classList.add('over-limit');
                    } else {
                        el.classList.remove('over-limit');
                        el.closest('.live-card-col')?.classList.remove('over-limit');
                    }

                    el.textContent = `${menit}m ${detik}s`;
                }
            });
        }

        function renderTicker() {
            const track = document.getElementById('tickerTrack');
            if (!track) return;

            const items = tickerItems.filter(item => item.trim() !== '');
            const speed = tickerSpeed || 30;

            let html = '';
            if (items.length === 0) {
                const defaultItems = [
                    '⏳ Memuat data...'
                ];
                const tripled = [...defaultItems, ...defaultItems, ...defaultItems, ...defaultItems, ...defaultItems,
                    ...defaultItems
                ];
                html = tripled.map(item => `<span class="ticker-item">${item}</span>`).join('');
            } else {
                const tripled = [...items, ...items, ...items];
                html = tripled.map(item => `<span class="ticker-item">${item}</span>`).join('');
            }

            track.innerHTML = html;
            track.style.opacity = '1';
            track.style.visibility = 'visible';
            track.style.animation = 'none';

            void track.offsetHeight;

            track.style.animation = `tickerScroll ${speed}s linear infinite`;
        }
