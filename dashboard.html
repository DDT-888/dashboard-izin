        // --- UPDATE SHIFT ACTIVE ---
        async function updateShiftActive() {
            if (!shiftActiveId) {
                console.warn('⚠️ No shiftActiveId, skipping update');
                return;
            }

            const userName = getCurrentUserName() || 'System';

            try {
                const shiftData = {
                    columns: shiftColumns.map(col => ({
                        id: col.id,
                        name: col.name,
                        note: col.note || '',
                        users: col.users.map(u => ({
                            id: u.id,
                            name: u.name,
                            role: u.role,
                            note: u.note || ''
                        }))
                    }))
                };

                const { error } = await supabaseDashboard
                    .from('shift_active')
                    .update({
                        shift_data: shiftData,
                        updated_at: new Date().toISOString(),
                        updated_by: userName
                    })
                    .eq('id', shiftActiveId);

                if (error) throw error;

                shiftIsDirty = false;
                console.log('✅ Shift active updated successfully');

            } catch (err) {
                console.error('❌ Error updating shift active:', err);
                showShiftToast('❌ Gagal menyimpan perubahan shift', 'error');
                throw err;
            }
        }

        // --- NOTE PANEL ---
        function toggleNotePanel(columnId) {
            const wrapper = document.querySelector(`.shift-column-wrapper[data-column-id="${columnId}"]`);
            const panel = document.getElementById(`notePanel_${columnId}`);
            if (!panel || !wrapper) return;

            const isOpen = panel.classList.contains('open');

            if (isOpen) {
                panel.classList.remove('open');
                wrapper.classList.remove('has-note-open');
            } else {
                panel.classList.add('open');
                wrapper.classList.add('has-note-open');
                setTimeout(() => {
                    syncNoteHeight(columnId);
                }, 350);
            }
        }

        function onNoteInput(columnId, userId, value) {
            const col = shiftColumns.find(c => c.id === columnId);
            if (!col) return;

            const user = col.users.find(u => u.id === userId);
            if (!user) return;

            user.note = value;
            shiftIsDirty = true;

            const indicator = document.querySelector(
                `.shift-column-wrapper[data-column-id="${columnId}"] .user-card-shift[data-user-id="${userId}"] .note-indicator`
            );
            if (indicator) {
                if (value && value.trim() !== '') {
                    indicator.classList.add('has-note');
                } else {
                    indicator.classList.remove('has-note');
                }
            }

            const badge = document.querySelector(`.shift-column-wrapper[data-column-id="${columnId}"] .note-badge`);
            if (badge) {
                const hasAnyNote = col.users.some(u => u.note && u.note.trim() !== '');
                if (hasAnyNote) {
                    badge.classList.add('has-note');
                    if (!badge.querySelector('.badge-dot')) {
                        const dot = document.createElement('span');
                        dot.className = 'badge-dot';
                        badge.prepend(dot);
                    }
                } else {
                    badge.classList.remove('has-note');
                    const dot = badge.querySelector('.badge-dot');
                    if (dot) dot.remove();
                }
            }

            const key = `${columnId}_${userId}`;
            if (noteDebounceTimers[key]) {
                clearTimeout(noteDebounceTimers[key]);
            }

            noteDebounceTimers[key] = setTimeout(async () => {
                try {
                    await updateShiftActive();
                    
                    const detail = user.note && user.note.trim() !== '' ?
                        `Menambahkan note untuk ${user.name}: "${user.note}"` :
                        `Menghapus note untuk ${user.name}`;
                    
                    insertShiftLog('EDIT_NOTE', getCurrentUserName(), detail);
                    console.log(`✅ Note saved for ${user.name}: "${user.note}"`);
                    
                } catch (err) {
                    console.error('❌ Error saving note:', err);
                    showShiftToast('❌ Gagal menyimpan note', 'error');
                } finally {
                    delete noteDebounceTimers[key];
                }
            }, 800);
        }

        // --- DRAG & DROP STAFF ---
        let staffDragData = null;

        function onStaffDragStart(e, userId, sourceType, columnId) {
            if (!canEditShift()) {
                e.preventDefault();
                return false;
            }

            staffDragData = {
                userId: userId,
                sourceType: sourceType,
                columnId: columnId || null
            };

            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('staff-drag', JSON.stringify(staffDragData));
            e.dataTransfer.setData('text/plain', JSON.stringify(staffDragData));

            const target = e.target.closest('.user-card-shift');
            if (target) {
                setTimeout(() => {
                    target.classList.add('dragging');
                }, 10);
            }

            if (e.target.closest('.user-card-shift')) {
                const rect = target.getBoundingClientRect();
                const dragImage = target.cloneNode(true);
                dragImage.style.position = 'fixed';
                dragImage.style.pointerEvents = 'none';
                dragImage.style.opacity = '0.7';
                dragImage.style.transform = 'scale(0.95)';
                dragImage.style.width = rect.width + 'px';
                dragImage.style.borderRadius = '8px';
                dragImage.style.background = 'var(--bg-card)';
                dragImage.style.boxShadow = 'var(--shadow-xl)';
                document.body.appendChild(dragImage);
                e.dataTransfer.setDragImage(dragImage, rect.width / 2, rect.height / 2);
                setTimeout(() => {
                    document.body.removeChild(dragImage);
                }, 100);
            }
        }

        function onStaffDragEnd(e) {
            const target = e.target.closest('.user-card-shift');
            if (target) {
                target.classList.remove('dragging');
            }
            document.querySelectorAll('.shift-column-dropzone.drag-over').forEach(el => {
                el.classList.remove('drag-over');
            });
            document.querySelectorAll('.shift-available-dropzone.drag-over').forEach(el => {
                el.classList.remove('drag-over');
            });
            document.querySelectorAll('.empty-drop.drag-over').forEach(el => {
                el.classList.remove('drag-over');
            });
            document.querySelectorAll('.shift-column-wrapper.drag-over-col').forEach(el => {
                el.classList.remove('drag-over-col');
            });
        }

        function onStaffDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';

            const wrapper = e.currentTarget.closest('.shift-column-wrapper');
            if (wrapper) {
                wrapper.classList.add('drag-over-col');
                const dropzone = wrapper.querySelector('.shift-column-dropzone');
                if (dropzone) {
                    dropzone.classList.add('drag-over');
                    const emptyDrop = dropzone.querySelector('.empty-drop');
                    if (emptyDrop) emptyDrop.classList.add('drag-over');
                }
            } else {
                const target = e.currentTarget;
                const dropzone = target.closest('.shift-available-dropzone');
                if (dropzone) {
                    dropzone.classList.add('drag-over');
                }
            }
        }

        function onStaffDragLeave(e) {
            const wrapper = e.currentTarget.closest('.shift-column-wrapper');
            if (wrapper) {
                wrapper.classList.remove('drag-over-col');
                const dropzone = wrapper.querySelector('.shift-column-dropzone');
                if (dropzone) {
                    dropzone.classList.remove('drag-over');
                    const emptyDrop = dropzone.querySelector('.empty-drop');
                    if (emptyDrop) emptyDrop.classList.remove('drag-over');
                }
            } else {
                const target = e.currentTarget;
                const dropzone = target.closest('.shift-available-dropzone');
                if (dropzone) {
                    dropzone.classList.remove('drag-over');
                }
            }
        }

        function onStaffDrop(e, targetColumnId) {
            e.preventDefault();

            document.querySelectorAll('.shift-column-wrapper.drag-over-col').forEach(el => {
                el.classList.remove('drag-over-col');
            });
            document.querySelectorAll('.shift-column-dropzone.drag-over').forEach(el => {
                el.classList.remove('drag-over');
            });
            document.querySelectorAll('.shift-available-dropzone.drag-over').forEach(el => {
                el.classList.remove('drag-over');
            });
            document.querySelectorAll('.empty-drop.drag-over').forEach(el => {
                el.classList.remove('drag-over');
            });

            if (!canEditShift()) {
                showShiftToast('❌ Anda tidak memiliki izin untuk mengatur shift!', 'error');
                return;
            }

            try {
                let rawData = e.dataTransfer.getData('staff-drag');

                if (!rawData) {
                    rawData = e.dataTransfer.getData('text/plain');
                }

                if (!rawData) {
                    showShiftToast('❌ Data staff tidak valid', 'error');
                    return;
                }

                const data = JSON.parse(rawData);
                const { userId, sourceType, columnId: sourceColumnId } = data;

                if (sourceType === 'column' && sourceColumnId === targetColumnId) {
                    showShiftToast('ℹ️ Staff sudah berada di kolom ini', 'info', 1500);
                    return;
                }

                let user = null;
                let userNote = '';

                if (sourceType === 'available') {
                    const idx = availableUsers.findIndex(u => String(u.id) === String(userId));
                    if (idx === -1) {
                        showShiftToast('❌ User tidak ditemukan di data staff', 'error');
                        return;
                    }
                    user = availableUsers.splice(idx, 1)[0];
                    userNote = '';
                } else {
                    const sourceColumn = shiftColumns.find(c => c.id === sourceColumnId);
                    if (!sourceColumn) {
                        showShiftToast('❌ Kolom sumber tidak ditemukan', 'error');
                        return;
                    }
                    const idx = sourceColumn.users.findIndex(u => String(u.id) === String(userId));
                    if (idx === -1) {
                        showShiftToast('❌ User tidak ditemukan di kolom sumber', 'error');
                        return;
                    }
                    user = sourceColumn.users.splice(idx, 1)[0];
                    userNote = user.note || '';
                }

                if (!user) {
                    showShiftToast('❌ Gagal menemukan user', 'error');
                    return;
                }

                const targetCol = shiftColumns.find(c => c.id === targetColumnId);
                if (!targetCol) {
                    availableUsers.push(user);
                    sortAvailableUsers();
                } else {
                    const exists = targetCol.users.some(u => String(u.id) === String(user.id));
                    if (!exists) {
                        user.note = userNote;
                        targetCol.users.push(user);
                        sortColumnUsers(targetCol);
                    } else {
                        availableUsers.push(user);
                        sortAvailableUsers();
                        showShiftToast(`ℹ️ ${user.name} sudah ada di kolom ini`, 'info', 1500);
                        renderShiftPage();
                        return;
                    }
                }

                shiftIsDirty = true;
                updateShiftActive();
                renderShiftPage();

                const fromLabel = sourceType === 'available' ? 'DATA STAFF' : shiftColumns.find(c => c.id ===
                    sourceColumnId)?.name || 'kolom lain';
                const toLabel = targetCol ? targetCol.name : 'DATA STAFF';
                insertShiftLog('MOVE_USER', getCurrentUserName(), `${user.name} dari ${fromLabel} ke ${toLabel}`);

                showShiftToast(`✅ ${user.name} dipindahkan`, 'success', 1200);

            } catch (err) {
                console.error('❌ Drop staff error:', err);
                showShiftToast('❌ Gagal memindahkan staff', 'error');
            }
        }

        // --- AVAILABLE DROP ZONE ---

            target.classList.add('drag-over');
        }

        function onAvailableDragLeave(e) {
            const target = e.currentTarget;
            target.classList.remove('drag-over');
        }

        function onAvailableDrop(e) {
            e.preventDefault();
            const target = e.currentTarget;
            target.classList.remove('drag-over');

            if (!canEditShift()) {
                showShiftToast('❌ Anda tidak memiliki izin untuk mengatur shift!', 'error');
                return;
            }

            try {
                let rawData = e.dataTransfer.getData('staff-drag');
                if (!rawData) {
                    rawData = e.dataTransfer.getData('text/plain');
                }

                if (!rawData) {
                    showShiftToast('❌ Data staff tidak valid', 'error');
                    return;
                }

                const data = JSON.parse(rawData);
                const { userId, sourceType, columnId: sourceColumnId } = data;

                if (sourceType === 'available') {
                    showShiftToast('ℹ️ Staff sudah berada di DATA STAFF', 'info', 1500);
                    return;
                }

                const sourceColumn = shiftColumns.find(c => c.id === sourceColumnId);
                if (!sourceColumn) {
                    showShiftToast('❌ Kolom sumber tidak ditemukan', 'error');

                }

                const idx = sourceColumn.users.findIndex(u => String(u.id) === String(userId));
                if (idx === -1) {
                    showShiftToast('❌ User tidak ditemukan di kolom sumber', 'error');

                sortAvailableUsers();

                shiftIsDirty = true;
                updateShiftActive();
                renderShiftPage();
                insertShiftLog('MOVE_USER', getCurrentUserName(), `${user.name} dari ${sourceColumn.name} ke DATA STAFF`);
                showShiftToast(`✅ ${user.name} dikembalikan ke DATA STAFF`, 'success', 1200);

            } catch (err) {
                console.error('❌ Drop available error:', err);
                showShiftToast('❌ Gagal mengembalikan staff', 'error');

        // --- DRAG & DROP KOLOM ---
        function onColumnDragStart(e, columnId) {
            const target = e.target.closest('.column-header');
            if (!target) {
                e.preventDefault();
                return false;
            }

            if (!canEditShift()) {
                e.preventDefault();
                return false;
            }

            columnDragData = {
                columnId: columnId
            };

            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('column-drag', JSON.stringify(columnDragData));

            const wrapper = e.target.closest('.shift-column-wrapper');
            if (wrapper) {
                setTimeout(() => {
                    wrapper.classList.add('dragging-col');
                }, 10);
            }
        }

        function onColumnDragEnd(e) {
            document.querySelectorAll('.shift-column-wrapper.dragging-col').forEach(el => {
                el.classList.remove('dragging-col');
            });
            document.querySelectorAll('.shift-column-wrapper.drag-over-col').forEach(el => {
                el.classList.remove('drag-over-col');
            });
        }

        function onColumnDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const target = e.currentTarget;
            const wrapper = target.closest('.shift-column-wrapper');
            if (wrapper && !wrapper.classList.contains('dragging-col')) {
                wrapper.classList.add('drag-over-col');
            }
        }

        function onColumnDragLeave(e) {
            const target = e.currentTarget;
            const wrapper = target.closest('.shift-column-wrapper');
            if (wrapper) {
                wrapper.classList.remove('drag-over-col');
            }
        }

        function onColumnDrop(e, targetColumnId) {
            e.preventDefault();
            const target = e.currentTarget;
            const wrapper = target.closest('.shift-column-wrapper');
            if (wrapper) {
                wrapper.classList.remove('drag-over-col');
            }

            if (!canEditShift()) {
                showShiftToast('❌ Anda tidak memiliki izin untuk mengatur shift!', 'error');
                return;
            }

            try {
                const rawData = e.dataTransfer.getData('column-drag');

                if (!rawData) {
                    return;
                }

                const data = JSON.parse(rawData);
                const { columnId: sourceColumnId } = data;

                if (!sourceColumnId || sourceColumnId === targetColumnId) {
                    return;
                }

                const sourceIndex = shiftColumns.findIndex(c => c.id === sourceColumnId);
                const targetIndex = shiftColumns.findIndex(c => c.id === targetColumnId);

                if (sourceIndex === -1 || targetIndex === -1) {
                    showShiftToast('❌ Kolom tidak ditemukan', 'error');
                    return;
                }

                const [movedColumn] = shiftColumns.splice(sourceIndex, 1);
                shiftColumns.splice(targetIndex, 0, movedColumn);

                shiftIsDirty = true;
                updateShiftActive();
                renderShiftPage();
                showShiftToast('✅ Kolom shift dipindahkan', 'success', 1200);

            } catch (err) {
                console.error('❌ Column drop error:', err);
                showShiftToast('❌ Gagal memindahkan kolom', 'error');
            }
        }

        // --- EDIT COLUMN NAME ---
        function editColumnName(columnId) {
            if (!canEditShift()) return;

            const col = shiftColumns.find(c => c.id === columnId);
            if (!col) return;

            const nameEl = document.querySelector(`.shift-column-wrapper[data-column-id="${columnId}"] .col-name`);
            if (!nameEl) return;

            if (nameEl.classList.contains('editing')) {
                const newName = nameEl.textContent.trim();
                if (newName && newName.length > 0 && newName !== col.name) {
                    const oldName = col.name;
                    col.name = newName.toUpperCase();
                    shiftIsDirty = true;
                    updateShiftActive();
                    insertShiftLog('EDIT_NAME', getCurrentUserName(), `Mengubah nama kolom "${oldName}" menjadi "${col.name}"`);
                }
                nameEl.classList.remove('editing');
                nameEl.contentEditable = false;
                renderShiftPage();
                return;
            }

            nameEl.contentEditable = true;
            nameEl.classList.add('editing');
            nameEl.focus();
            selectText(nameEl);

            nameEl.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    nameEl.blur();
                }
                if (e.key === 'Escape') {
                    nameEl.textContent = col.name;
                    nameEl.blur();
                }
            };

            nameEl.onblur = () => {
                const newName = nameEl.textContent.trim();
                if (newName && newName.length > 0 && newName !== col.name) {
                    const oldName = col.name;
                    col.name = newName.toUpperCase();
                    shiftIsDirty = true;
                    updateShiftActive();
                    insertShiftLog('EDIT_NAME', getCurrentUserName(), `Mengubah nama kolom "${oldName}" menjadi "${col.name}"`);
                } else {
                    nameEl.textContent = col.name;
                }
                nameEl.classList.remove('editing');
                nameEl.contentEditable = false;
                renderShiftPage();
            };
        }

        function selectText(el) {
            const range = document.createRange();
            range.selectNodeContents(el);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
        }

        // --- ADD / DELETE COLUMN ---
        function addShiftColumn() {
            if (!canEditShift()) return;

            const newId = `shift_${Date.now()}`;
            shiftColumns.push({
                id: newId,
                name: `SHIFT ${shiftColumns.length + 1}`,
                note: '',
                users: []
            });

            shiftIsDirty = true;
            updateShiftActive();
            renderShiftPage();
            insertShiftLog('ADD_COLUMN', getCurrentUserName(), `Menambahkan kolom SHIFT ${shiftColumns.length}`);
            showShiftToast('✅ Kolom shift ditambahkan', 'success', 1500);
        }

        function deleteShiftColumn(columnId) {
            if (!canEditShift()) return;

            if (shiftColumns.length <= 2) {
                showShiftToast('⚠️ Minimal 2 kolom shift harus ada!', 'warning');
                return;
            }

            if (!confirm(`Yakin ingin menghapus kolom ini? Staff akan kembali ke DATA STAFF.`)) return;

            const col = shiftColumns.find(c => c.id === columnId);
            if (!col) return;

            const colName = col.name;

            col.users.forEach(user => {
                if (!availableUsers.some(u => u.id === user.id)) {
                    availableUsers.push(user);
                }
            });

            sortAvailableUsers();
            shiftColumns = shiftColumns.filter(c => c.id !== columnId);
            shiftIsDirty = true;
            updateShiftActive();
            renderShiftPage();
            insertShiftLog('DELETE_COLUMN', getCurrentUserName(), `Menghapus kolom "${colName}"`);
            showShiftToast('✅ Kolom shift dihapus', 'success', 1500);
        }

        // --- RESET SHIFT ---
        function resetShift() {
            if (!canEditShift()) return;

            if (!confirm('⚠️ Yakin ingin mereset semua shift? Semua staff akan kembali ke DATA STAFF.')) return;

            const colNames = shiftColumns.map(c => c.name).join(', ');

            shiftColumns.forEach(col => {
                col.users.forEach(user => {
                    if (!availableUsers.some(u => u.id === user.id)) {
                        availableUsers.push(user);
                    }
                });
                col.users = [];
            });

            sortAvailableUsers();
            shiftIsDirty = true;
            updateShiftActive();
            renderShiftPage();
            insertShiftLog('RESET', getCurrentUserName(), `Mereset semua shift (${colNames})`);
            showShiftToast('✅ Shift di-reset', 'success', 1500);
        }

        // --- SAVE SHIFT (POPUP) ---
        function openSaveShiftPopup() {
            if (!canEditShift()) return;

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('saveShiftStart').value = today;
            document.getElementById('saveShiftEnd').value = today;
            document.getElementById('saveShiftPopup').classList.add('show');
        }

        function closeSaveShiftPopup() {
            document.getElementById('saveShiftPopup').classList.remove('show');
        }

        async function confirmSaveShift() {
            const startInput = document.getElementById('saveShiftStart');
            const endInput = document.getElementById('saveShiftEnd');

            if (!startInput || !endInput) return;

            const startDate = startInput.value;
            const endDate = endInput.value;

            if (!startDate || !endDate) {
                showShiftToast('⚠️ Pilih tanggal terlebih dahulu!', 'warning');
                return;
            }

            if (startDate > endDate) {
                showShiftToast('⚠️ Tanggal mulai harus <= tanggal akhir!', 'warning');
                return;
            }

            closeSaveShiftPopup();

            const userName = getCurrentUserName() || 'System';

            try {
                const shiftData = {
                    columns: shiftColumns.map(col => ({
                        id: col.id,
                        name: col.name,
                        note: col.note || '',
                        users: col.users.map(u => ({
                            id: u.id,
                            name: u.name,
                            role: u.role,
                            note: u.note || ''
                        }))
                    }))
                };

                const { error } = await supabaseDashboard
                    .from('shift_history')
                    .insert({
                        tanggal: startDate,
                        periode_start: startDate,
                        periode_end: endDate,
                        shift_data: JSON.stringify(shiftData),
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString(),
                        created_by: userName,
                        updated_by: userName,
                        notes: `Shift ${startDate} - ${endDate}`,
                        is_active: true
                    });

                if (error) throw error;

                insertShiftLog('SAVE', userName, `Menyimpan shift ke riwayat (${startDate} - ${endDate})`);
                showShiftToast(`✅ Shift berhasil disimpan ke riwayat! Periode: ${startDate} - ${endDate}`, 'success', 3000);
                loadShiftHistory();

            } catch (err) {
                console.error('❌ Error saving shift to history:', err);
                showShiftToast('❌ Gagal menyimpan shift ke riwayat: ' + err.message, 'error');
            }
        }

        // --- PREVIEW SHIFT ---
        function openShiftPreview() {
            const totalStaff = availableUsers.length + shiftColumns.reduce((sum, col) => sum + col.users.length, 0);

            let periodeStart = '';
            let periodeEnd = '';
            
            if (shiftActiveId) {
                const now = new Date();
                const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
                const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
                periodeStart = firstDay.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                periodeEnd = lastDay.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
            } else {
                const now = new Date();
                const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
                const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
                periodeStart = firstDay.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                periodeEnd = lastDay.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });

            previewData = {

                createdAt: new Date().toLocaleString('id-ID'),
                periodeStart: periodeStart,
                periodeEnd: periodeEnd
            };

            renderShiftPreview();
        }

                cs: 'CS',

                kasir: 'Kasir'

                            <div class="preview-card">

                                    <span class="count">${col.users.length} staff</span>
                                </div>

                                    const roleOrder = ['csline', 'cs', 'kapten', 'kasir'];

        // --- SHIFT TOAST ---
        function showShiftToast(message, type = 'info', duration = 2000) {
            let toast = document.getElementById('shiftToast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'shiftToast';
                toast.className = 'shift-toast';
                document.body.appendChild(toast);
            }

            toast.textContent = message;
            toast.className = `shift-toast ${type}`;
            toast.style.display = 'block';

            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.style.display = 'none';
            }, duration);
        }

        // --- LOAD SHIFT HISTORY ---
        async function loadShiftHistory() {
            try {
                const { data, error } = await supabaseDashboard
                    .from('shift_history')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                shiftHistoryData = data || [];
                renderShiftHistory();

            } catch (err) {
                console.error('❌ Error loading shift history:', err);
                showShiftToast('Gagal memuat riwayat shift: ' + err.message, 'error');
            }
        }

        // --- RENDER SHIFT HISTORY ---
        function renderShiftHistory() {
            const container = document.getElementById('historyShiftContent');
            if (!container) return;

            const searchInput = document.getElementById('historyShiftSearch');
            const filterSelect = document.getElementById('historyShiftFilter');

            const searchValue = searchInput?.value?.toLowerCase() || '';
            const filterValue = filterSelect?.value || 'all';

            let filtered = [...shiftHistoryData];

            if (searchValue) {
                filtered = filtered.filter(h => {
                    const periodStr = `${h.periode_start || ''} ${h.periode_end || ''}`.toLowerCase();
                    const creator = (h.updated_by || h.created_by || '').toLowerCase();
                    const notes = (h.notes || '').toLowerCase();
                    return periodStr.includes(searchValue) || 
                           creator.includes(searchValue) ||
                           notes.includes(searchValue);
                });
            }

            if (filterValue === 'this_month') {
                const now = new Date();
                const month = now.getMonth();
                const year = now.getFullYear();
                filtered = filtered.filter(h => {
                    const d = new Date(h.created_at);
                    return d.getMonth() === month && d.getFullYear() === year;
                });
            } else if (filterValue === 'last_month') {
                const now = new Date();
                const month = now.getMonth() - 1;
                const year = now.getFullYear();
                filtered = filtered.filter(h => {
                    const d = new Date(h.created_at);
                    return d.getMonth() === month && d.getFullYear() === year;
                });
            } else if (filterValue === 'last_3_months') {
                const threeMonthsAgo = new Date();
                threeMonthsAgo.setMonth(threeMonthsAgo.getMonth() - 3);
                filtered = filtered.filter(h => {
                    const d = new Date(h.created_at);
                    return d >= threeMonthsAgo;
                });
            } else if (filterValue === 'this_year') {
                const year = new Date().getFullYear();
                filtered = filtered.filter(h => {
                    const d = new Date(h.created_at);
                    return d.getFullYear() === year;
                });
            }

            filtered = filtered.map(h => {
                let totalStaff = 0;
                let shiftCount = 0;
                try {
                    const data = JSON.parse(h.shift_data);
                    if (data.columns) {
                        shiftCount = data.columns.length;
                        totalStaff = data.columns.reduce((sum, col) => sum + (col.users?.length || 0), 0);
                    }
                } catch (e) {}
                return { ...h, totalStaff, shiftCount };
            });

            const dateFormat = (dateStr) => {
                if (!dateStr) return '-';
                const d = new Date(dateStr);
                return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
            };

            const timeFormat = (dateStr) => {
                if (!dateStr) return '-';
                const d = new Date(dateStr);
                return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
            };

            const canEdit = canEditShift();
            const canOpen = canOpenHistory();

            container.innerHTML = `
                <div class="history-shift-container">
                    <div class="filter-bar">
                        <input type="text" id="historyShiftSearch" placeholder="🔍 Cari periode atau pembuat..." oninput="renderShiftHistory()" value="${searchValue}" />
                        <select id="historyShiftFilter" onchange="renderShiftHistory()">
                            <option value="all" ${filterValue === 'all' ? 'selected' : ''}>📅 Semua</option>
                            <option value="this_month" ${filterValue === 'this_month' ? 'selected' : ''}>Bulan Ini</option>
                            <option value="last_month" ${filterValue === 'last_month' ? 'selected' : ''}>Bulan Lalu</option>
                            <option value="last_3_months" ${filterValue === 'last_3_months' ? 'selected' : ''}>3 Bulan Terakhir</option>
                            <option value="this_year" ${filterValue === 'this_year' ? 'selected' : ''}>Tahun Ini</option>
                        </select>
                    </div>

                    <div class="history-table-wrap">
                        ${filtered.length === 0 ? `
                            <div class="history-empty">
                                <div class="icon">📭</div>
                                <h3>Belum ada riwayat shift</h3>
                                <p>${searchValue ? 'Tidak ditemukan data untuk pencarian "' + searchValue + '"' : 'Simpan shift pertama Anda untuk mulai melihat riwayat'}</p>
                            </div>
                        ` : `
                            <table>
                                <thead>
                                    <tr>
                                        <th style="width:40px;">#</th>
                                        <th>Periode</th>
                                        <th style="text-align:center;">Staff</th>
                                        <th style="text-align:center;">Shift</th>
                                        <th>Dibuat Oleh</th>
                                        <th style="text-align:center;">Tanggal</th>
                                        <th style="text-align:center;">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${filtered.map((item, index) => `
                                        <tr>
                                            <td>${index + 1}</td>
                                            <td>
                                                ${item.periode_start && item.periode_end ? 
                                                    `${dateFormat(item.periode_start)} - ${dateFormat(item.periode_end)}` : 
                                                    dateFormat(item.tanggal)}
                                            </td>
                                            <td style="text-align:center;font-weight:600;">${item.totalStaff}</td>
                                            <td style="text-align:center;font-weight:600;">${item.shiftCount}</td>
                                            <td>${item.updated_by || item.created_by || '-'}</td>
                                            <td style="text-align:center;font-size:11px;color:var(--text-muted);">
                                                ${dateFormat(item.created_at)} ${timeFormat(item.created_at)}
                                            </td>
                                            <td>
                                                <div class="col-actions">
                                                    ${canOpen ? `
                                                        <button class="action-btn open" onclick="openShiftFromHistory('${item.id}')" title="Buka">📂</button>
                                                    ` : ''}
                                                    <button class="action-btn preview" onclick="previewShiftFromHistory('${item.id}')" title="Preview">👁️</button>
                                                    ${canEdit ? `
                                                        <button class="action-btn delete" onclick="deleteShiftHistory('${item.id}')" title="Hapus">🗑️</button>
                                                    ` : ''}
                                                </div>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        `}
                    </div>

                    <div style="text-align:center;color:var(--text-muted);font-size:12px;padding:4px 0;">
                        Total: <strong>${filtered.length}</strong> riwayat shift
                        ${searchValue ? ` (pencarian: "${searchValue}")` : ''}
                    </div>
                </div>
            `;

            const newSearchInput = document.getElementById('historyShiftSearch');
            if (newSearchInput && searchValue) {
                newSearchInput.value = searchValue;
            }
        }

        // --- OPEN SHIFT FROM HISTORY ---
        async function openShiftFromHistory(historyId) {
            if (!canOpenHistory()) {
                showShiftToast('❌ Anda tidak memiliki izin untuk membuka shift!', 'error');
                return;
            }

            try {
                const { data, error } = await supabaseDashboard
                    .from('shift_history')
                    .select('*')
                    .eq('id', historyId)
                    .maybeSingle();

                if (error) throw error;
                if (!data) {
                    showShiftToast('❌ Data tidak ditemukan', 'error');
                    return;
                }

                const shiftData = JSON.parse(data.shift_data);

                shiftColumns = shiftData.columns.map(col => ({
                    id: col.id || `shift_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`,
                    name: col.name,
                    note: col.note || '',
                    users: []
                }));

                const { data: users, error: usersError } = await supabaseDashboard
                    .from('users')
                    .select('*')
                    .in('role', ['csline', 'cs', 'kapten', 'kasir']);

                if (usersError) throw usersError;

                const allUsers = users || [];
                const userMap = {};
                allUsers.forEach(u => userMap[u.id] = u);

                availableUsers = allUsers.map(u => ({ ...u }));
                sortAvailableUsers();

                shiftData.columns.forEach((col, index) => {
                    if (col.users) {
                        col.users.forEach(u => {
                            const user = userMap[u.id];
                            if (user) {
                                user.note = u.note || '';
                                shiftColumns[index].users.push(user);
                                const idx = availableUsers.findIndex(av => av.id === user.id);
                                if (idx !== -1) availableUsers.splice(idx, 1);
                            }
                        });
                    }
                });

                shiftIsDirty = false;

                const activeData = {
                    columns: shiftColumns.map(col => ({
                        id: col.id,
                        name: col.name,
                        note: col.note || '',
                        users: col.users.map(u => ({
                            id: u.id,
                            name: u.name,
                            role: u.role,
                            note: u.note || ''
                        }))
                    }))
                };

                await supabaseDashboard
                    .from('shift_active')
                    .update({
                        shift_data: activeData,
                        updated_at: new Date().toISOString(),
                        updated_by: getCurrentUserName() || 'System'
                    })
                    .eq('id', shiftActiveId);

                insertShiftLog('OPEN', getCurrentUserName() || 'System',
                    `Membuka shift dari riwayat (${data.periode_start} - ${data.periode_end})`);
                renderShiftPage();
                switchTab('shifts');
                showShiftToast(`✅ Shift ${data.periode_start} - ${data.periode_end} dimuat`, 'success', 2000);

            } catch (err) {
                console.error('❌ Error opening shift:', err);
                showShiftToast('❌ Gagal membuka shift: ' + err.message, 'error');
            }
        }

        // --- PREVIEW SHIFT FROM HISTORY ---
        function previewShiftFromHistory(historyId) {
            const item = shiftHistoryData.find(h => String(h.id) === String(historyId));
            if (!item) {
                showShiftToast('❌ Data tidak ditemukan di riwayat!', 'error');
                return;
            }

            try {
                const shiftData = JSON.parse(item.shift_data);
                let totalStaff = 0;
                const columns = shiftData.columns.map(col => {
                    const users = col.users || [];
                    totalStaff += users.length;
                    return {
                        ...col,
                        users: users.map(u => ({ ...u, note: u.note || '' }))
                    };
                });

                let periodeStart = '';
                let periodeEnd = '';
                
                if (item.periode_start && item.periode_end) {
                    const start = new Date(item.periode_start);
                    const end = new Date(item.periode_end);
                    periodeStart = start.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                    periodeEnd = end.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                } else if (item.tanggal) {
                    const date = new Date(item.tanggal);
                    const firstDay = new Date(date.getFullYear(), date.getMonth(), 1);
                    const lastDay = new Date(date.getFullYear(), date.getMonth() + 1, 0);
                    periodeStart = firstDay.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                    periodeEnd = lastDay.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                } else {
                    const now = new Date();
                    const firstDay = new Date(now.getFullYear(), now.getMonth(), 1);
                    const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0);
                    periodeStart = firstDay.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                    periodeEnd = lastDay.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                }

                previewData = {
                    tanggal: item.tanggal,
                    periodeStart: periodeStart,
                    periodeEnd: periodeEnd,
                    columns: columns,
                    totalStaff: totalStaff,
                    createdBy: item.updated_by || item.created_by || 'System',
                    createdAt: new Date(item.created_at).toLocaleString('id-ID')
                };

                renderShiftPreview();

            } catch (err) {
                console.error('❌ Error previewing shift:', err);
                showShiftToast('❌ Gagal preview shift: ' + err.message, 'error');
            }
        }

        // --- DELETE SHIFT HISTORY ---
        async function deleteShiftHistory(historyId) {
            if (!canDeleteHistory()) {
                showShiftToast('❌ Anda tidak memiliki izin untuk menghapus!', 'error');
                return;
            }

            const item = shiftHistoryData.find(h => String(h.id) === String(historyId));
            if (!item) {
                showShiftToast('❌ Data tidak ditemukan di riwayat!', 'error');
                return;
            }

            if (!confirm(
                    `⚠️ Yakin ingin menghapus riwayat shift untuk periode ${item.periode_start || item.tanggal} - ${item.periode_end || item.tanggal}?`
                    )) {
                return;
            }

            try {
                const { error } = await supabaseDashboard
                    .from('shift_history')
                    .delete()
                    .eq('id', historyId);

                if (error) {
                    console.error('❌ Error deleting from database:', error);
                    showShiftToast('❌ Gagal menghapus: ' + error.message, 'error');
                    return;
                }

                shiftHistoryData = shiftHistoryData.filter(h => h.id !== historyId);
                renderShiftHistory();
                showShiftToast('✅ Riwayat shift dihapus', 'success', 2000);

            } catch (err) {
                console.error('❌ Error deleting history:', err);
                showShiftToast('❌ Gagal menghapus: ' + err.message, 'error');
            }
        }

        // --- SHIFT LOGS ---
        function queueShiftLog(action, userName, details) {
            pendingLogs.push({ 
                action: action, 
                user_name: userName, 
                details: details, 
                created_at: new Date().toISOString() 
            });
            
            if (pendingLogs.length >= 5) {
                flushShiftLogs();
                return;
            }
            
            clearTimeout(logBatchTimer);
            logBatchTimer = setTimeout(flushShiftLogs, 10000);
        }

        async function flushShiftLogs() {
            if (pendingLogs.length === 0) return;
            
            const logs = [...pendingLogs];
            pendingLogs = [];
            
            try {
                const { error } = await supabaseDashboard
                    .from('shift_logs')
                    .insert(logs);
                    
                if (error) console.error('❌ Error inserting shift logs batch:', error);
            } catch (err) {
                console.error('❌ Error flushing shift logs:', err);
            }
        }

        function insertShiftLog(action, userName, details) {
            queueShiftLog(action, userName, details);
        }

        async function loadShiftLogs() {
            try {
                const { data, error } = await supabaseDashboard
                    .from('shift_logs')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (error) throw error;

                shiftLogs = data || [];
                renderShiftLogs();

            } catch (err) {
                console.error('❌ Error loading shift logs:', err);
            }
        }

        function renderShiftLogs() {
            const body = document.getElementById('shiftLogBody');
            if (!body) return;

            if (shiftLogs.length === 0) {
                body.innerHTML = `<div class="log-empty">Tidak ada log aktivitas</div>`;
                return;
            }

            const formatTime = (dateStr) => {
                const d = new Date(dateStr);
                return d.toLocaleString('id-ID', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            };

            body.innerHTML = shiftLogs.map(log => `
                <div class="log-entry">
                    <span class="log-time">${formatTime(log.created_at)}</span>
                    <span class="log-user">${log.user_name}</span>
                    <span class="log-action">${log.details || log.action}</span>
                </div>
            `).join('');

            body.scrollTop = 0;
        }

        function refreshShiftLogs() {
            showShiftToast('🔄 Memuat ulang log...', 'info', 1000);
            loadShiftLogs();
        }

        function downloadShiftLogs() {
            if (shiftLogs.length === 0) {
                showShiftToast('⚠️ Tidak ada log untuk didownload', 'warning');
                return;
            }

            const formatTime = (dateStr) => {
                const d = new Date(dateStr);
                return d.toLocaleString('id-ID', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            };

            let csv = 'Waktu,User,Aksi,Detail\n';
            shiftLogs.forEach(log => {
                csv += `${formatTime(log.created_at)},${log.user_name},${log.action},"${log.details || ''}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `shift-logs-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            window.URL.revokeObjectURL(url);

            showShiftToast('✅ Log berhasil didownload!', 'success');
        }

        // --- AUTO SAVE BEFORE UNLOAD ---
        window.addEventListener('beforeunload', function() {
            Object.keys(noteDebounceTimers).forEach(key => {
                clearTimeout(noteDebounceTimers[key]);
                delete noteDebounceTimers[key];
            });
            
            flushShiftLogs();
            
            if (shiftIsDirty && shiftActiveId) {
                updateShiftActive();
            }
        });

        console.log('✅ Shift functions loaded successfully!');

        // ============================================================
        // VISIBILITY CHANGE HANDLER
        // ============================================================
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
                const now = Date.now();
                if (now - lastVisibilityLoad > 15000) {
                    console.log('👁️ Tab became visible, checking data...');
                    lastVisibilityLoad = now;
                    if (!isLoading && isDataReady) {
                        loadDataFromDatabase();
                    }
                    startPeriodicRefresh();
                } else {
                    console.log('⏸️ Visibility reload skipped (cooldown)');
                }
            }
        });

        // ============================================================
        // LOAD EMOTICONS & INIT
        // ============================================================
        loadUserEmoticons();

        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Dashboard Izin - Starting...');

            loadTheme();

            const lastTab = localStorage.getItem('lastTab') || 'dashboard';
            console.log(`📌 Last tab: ${lastTab}`);

            renderTicker();
            checkAuth();

            if (!document.getElementById('shiftPreviewModal')) {
                const modal = document.createElement('div');
                modal.id = 'shiftPreviewModal';
                modal.className = 'shift-preview-modal';
                document.body.appendChild(modal);
            }

            const originalCheckAuth = checkAuth;
            checkAuth = async function() {
                await originalCheckAuth();
                setTimeout(() => {
                    const savedTab = localStorage.getItem('lastTab') || 'dashboard';
                    if (document.getElementById(`tab-${savedTab}`)) {
                        switchTab(savedTab);
                    }
                }, 500);
            };
        });

        console.log('✅ Dashboard siap!');
    </script>
</body>
</html>
