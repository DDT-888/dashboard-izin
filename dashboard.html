                    else if (role === 'kapten') counts.kapten++;
                    else if (role === 'kasir') counts.kasir++;

            if (role === 'kapten' && counts.kapten >= limit) return false;
            if (role === 'kasir' && counts.kasir >= limit) return false;
            return true;

        // ============================================================

        // ============================================================
        function showToast(message, type = 'info', duration = 3000) {
            const oldToast = document.getElementById('toastNotification');
            if (oldToast) {
                oldToast.classList.add('hiding');
                setTimeout(() => {
                    if (oldToast.parentNode) oldToast.remove();
                }, 400);
            }

            const toast = document.createElement('div');
            toast.id = 'toastNotification';
            toast.className = `toast-notification ${type}`;
            
            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️',
                jackpot: '🎰'
            };
            const icon = icons[type] || 'ℹ️';
            
            let cleanMessage = message;
            cleanMessage = cleanMessage.replace(/^[✅❌⚠️ℹ️🎰▶️⏹️]+\s*/, '');
            
            toast.innerHTML = `
                <button class="toast-close" onclick="closeToast(this)">✕</button>
                <span class="toast-icon">${icon}</span>
                <span class="toast-message">${cleanMessage}</span>
                <div class="toast-progress"></div>
            `;
            
            document.body.appendChild(toast);
            
            void toast.offsetHeight;
            toast.style.display = 'block';
            
            const timeoutId = setTimeout(() => {
                closeToast(toast);
            }, duration);
            
            toast.dataset.timeoutId = timeoutId;
            
            toast.addEventListener('mouseenter', () => {
                clearTimeout(parseInt(toast.dataset.timeoutId));
                const progress = toast.querySelector('.toast-progress');
                if (progress) {
                    progress.style.animationPlayState = 'paused';
                }
            });
            
            toast.addEventListener('mouseleave', () => {
                const remaining = duration;
                const newTimeout = setTimeout(() => {
                    closeToast(toast);
                }, remaining);
                toast.dataset.timeoutId = newTimeout;
                const progress = toast.querySelector('.toast-progress');
                if (progress) {
                    progress.style.animationPlayState = 'running';
                }
            });
        }

        function closeToast(element) {
            if (element && element.classList && element.classList.contains('toast-close')) {
                element = element.closest('.toast-notification');
            }
            
            if (!element || !element.classList) return;
            
            if (element.dataset.timeoutId) {
                clearTimeout(parseInt(element.dataset.timeoutId));
            }
            
            element.classList.add('hiding');
            setTimeout(() => {
                if (element.parentNode) {
                    element.remove();
                }
            }, 400);
        }

                    btn.disabled = !canStart;

        // --- RENDER TICKER ---
        function renderTicker() {
            const track = document.getElementById('tickerTrack');
            if (!track) return;

            const items = tickerItems.filter(item => item.trim() !== '');
            const speed = tickerSpeed || 30;

            let html = '';
            if (items.length === 0) {
                const defaultItems = ['⏳ Memuat data...'];
                const tripled = [...defaultItems, ...defaultItems, ...defaultItems, ...defaultItems, ...defaultItems,
                    ...defaultItems
                ];
                html = tripled.map(item => `<span class="ticker-item">${item}</span>`).join('');
            } else {
                const tripled = [...items, ...items, ...items];
                html = tripled.map(item => `<span class="ticker-item">${item}</span>`).join('');
            }

            track.innerHTML = html;
            track.style.opacity = '1';
            track.style.visibility = 'visible';
            track.style.animation = 'none';

            void track.offsetHeight;
            track.style.animation = `tickerScroll ${speed}s linear infinite`;
        }

                csline: document.getElementById('countCsline'),
                cs: document.getElementById('countCs'),
                kapten: document.getElementById('countKapten'),
                kasir: document.getElementById('countKasir')
            };

            Object.keys(roleMap).forEach(role => {
                if (roleMap[role]) roleMap[role].innerHTML = '';
                if (countMap[role]) countMap[role].textContent = '0';
            });

            const izinList = daftarAnggota
                .filter(nama => dataIzin[nama] && dataIzin[nama].status === 'izin')
                .map(nama => ({
                    nama: formatName(nama),
                    mulai: dataIzin[nama].mulai,
                    role: getRoleForUser(nama),
                    emoticon: getUserEmoticon(nama) // 🔥 AMBIL EMOTICON PER USER
                }))
                .sort((a, b) => new Date(a.mulai) - new Date(b.mulai));

            const grouped = {};
            izinList.forEach(item => {
                if (!grouped[item.role]) grouped[item.role] = [];
                grouped[item.role].push(item);
            });

            const roleKeys = ['csline', 'cs', 'kapten', 'kasir'];
            let totalIzin = 0;

            roleKeys.forEach(role => {
                const items = grouped[role] || [];
                const container = roleMap[role];
                const countEl = countMap[role];

                if (countEl) countEl.textContent = items.length;
                totalIzin += items.length;

                if (!container) return;

                if (items.length === 0) {
                    container.innerHTML = `<div class="empty-live-col">Tidak ada yang izin</div>`;
                    return;
                }

                container.innerHTML = items.map((item) => {
                    const startTime = new Date(item.mulai);
                    const now = new Date();
                    const diff = Math.floor((now - startTime) / 1000);
                    const menit = Math.floor(diff / 60);
                    const detik = diff % 60;
                    // 🔥 PAKAI EMOTICON PER USER
                    const visual = item.emoticon || '😎';
                    const batasDetik = (jackpotLimitMinutes * 60) - 1;
                    const isOverLimit = diff > batasDetik;

                    const overLimitClass = isOverLimit ? 'over-limit' : '';
                    const timerClass = isOverLimit ? 'over-limit' : '';
                    const warningBadge = isOverLimit ?
                        `<span class="warning-badge-col">⚠️ OVER</span>` :
                        '';

                    return `
                            <div class="live-card-col ${overLimitClass}" data-nama="${item.nama}">
                                <div>
                                    <span class="visual-fun-col">${visual}</span>
                                    <span class="nama" title="${item.nama}">${item.nama}</span>
                                    ${warningBadge}
                                </div>
                                <div class="timer-col ${timerClass}" data-start="${item.mulai}">
                                    ${menit}m ${detik}s
                                </div>
                            </div>
                        `;
                }).join('');
            });

            const liveCount = document.getElementById('liveCount');
            if (liveCount) liveCount.innerHTML = `<span>${totalIzin}</span> orang sedang izin`;
        }

        // --- RENDER DASHBOARD TABLE (DENGAN EMOTICON RANDOM) ---
        window.renderDashboardTable = function() {
            const tbody = document.getElementById('dashboardTableBody');
            if (!tbody) return;

            const search = document.getElementById('searchInput');
            const searchValue = search ? search.value.toLowerCase().trim() : '';

            const filterRole = document.getElementById('filterRoleDashboard');
            const filterRoleValue = filterRole ? filterRole.value : '';

            let filtered = daftarAnggota.filter(nama => {
                const matchName = formatName(nama).toLowerCase().includes(searchValue);
                const matchRole = !filterRoleValue || getRoleForUser(nama) === filterRoleValue;
                return matchName && matchRole;
            });

            if (daftarAnggota.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px;">Belum ada anggota</td></tr>`;
                return;
            }

            if (filtered.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px;">Anggota tidak ditemukan</td></tr>`;
                return;
            }

            const roleOrder = { leader: 0, csline: 1, cs: 2, kapten: 3, kasir: 4 };

            filtered.sort((a, b) => {
                const statusA = dataIzin[a]?.status || 'none';
                const statusB = dataIzin[b]?.status || 'none';
                const roleA = getRoleForUser(a);
                const roleB = getRoleForUser(b);

                if (statusA === 'izin' && statusB !== 'izin') return -1;
                if (statusA !== 'izin' && statusB === 'izin') return 1;

                return (roleOrder[roleA] || 99) - (roleOrder[roleB] || 99);
            });

            const roleLabels = {
                leader: 'Leader',
                csline: 'CS Line',
                cs: 'CS',
                kapten: 'Kapten',
                kasir: 'Kasir'
            };

            const isLeaderOrCsLine = currentUserRole === 'leader' || currentUserRole === 'csline' || currentUserRole ===
                'admin';

            tbody.innerHTML = filtered.map(nama => {
                const data = dataIzin[nama];
                if (!data) return '';

                const status = data.status;
                const role = getRoleForUser(nama);
                const roleLabel = roleLabels[role] || role;

                const used = getUsedIzinToday(nama);
                const maxQuota = getMaxQuota(nama);
                const voucher = getVoucherCount(nama);

                const remaining = maxQuota - used;
                let quotaClass = '';
                if (remaining <= 0) quotaClass = 'full';
                else if (remaining <= 2) quotaClass = 'warning';
                else quotaClass = 'ok';

                let statusHTML = '';
                let timerHTML = '-';
                let actionHTML = '';
                let rowClass = '';
                let progressHTML = '-';
                let mulaiHTML = '-';

                const isCurrentUser = isUserCurrent(nama);
                const canStart = (isLeaderOrCsLine || isCurrentUser) &&
                    canUserIzinLive(nama) &&
                    used < maxQuota;

                if (status === 'izin') {
                    rowClass = 'row-online';

                    if (!data.mulai) {
                        timerHTML = '0m 0s';
                    } else {
                        let mulaiStr = data.mulai;
                        if (!mulaiStr.endsWith('Z')) {
                            mulaiStr = mulaiStr + 'Z';
                        }

                        const tMulai = new Date(mulaiStr);
                        const now = new Date();
                        const diffMs = now.getTime() - tMulai.getTime();
                        const diff = Math.floor(diffMs / 1000);
                        const validDiff = (diff > 0 && !isNaN(diff)) ? diff : 0;

                        const menit = Math.floor(validDiff / 60);
                        const detik = validDiff % 60;

                        const batasDetik = (jackpotLimitMinutes * 60) - 1;
                        const isOverLimit = validDiff > batasDetik;
                        const isJackpot = isOverLimit;

                        const maxProgressDetik = jackpotLimitMinutes * 60;
                        const progressPercent = Math.min((validDiff / maxProgressDetik) * 100, 100);

                        let progressClass = '';
                        let textClass = '';

                        if (progressPercent >= 100) {
                            progressClass = 'full';
                            textClass = 'full';
                        } else if (isJackpot) {
                            progressClass = 'jackpot';
                        } else if (isOverLimit) {
                            progressClass = 'danger';
                        } else if (progressPercent > 60) {
                            progressClass = 'warning';
                        }

                        const progressFill =
                            `<div class="progress-bar-fill ${progressClass}" style="width: ${progressPercent}%;"></div>`;

                        progressHTML = `
                                <div class="progress-container">
                                    <div class="progress-bar-wrap">
                                        ${progressFill}
                                    </div>
                                    <span class="progress-text ${textClass}">${Math.round(progressPercent)}%</span>
                                </div>
                            `;

                        const jamMulai = tMulai.toLocaleTimeString('id-ID', {
                            hour: '2-digit',
                            minute: '2-digit'
                        });
                        mulaiHTML = `<span class="time-mulai">${jamMulai}</span>`;

                        statusHTML =
                            `<span class="status-badge online"><span class="dot"></span> Online</span>`;
                        timerHTML =
                            `<span class="timer-display ${isOverLimit ? 'over-limit' : ''}">${menit}m ${detik}s</span>`;
                    }

                    const canEnd = isLeaderOrCsLine || isCurrentUser;
                    actionHTML = `
                            <button class="btn-action end" onclick="selesaiIzin('${nama}')" ${!canEnd ? 'disabled' : ''}>
                                <span class="icon">■</span> END
                            </button>
                        `;
                } else {
                    rowClass = 'row-offline';
                    statusHTML =
                        `<span class="status-badge offline"><span class="dot"></span> Offline</span>`;

                    const loadingClass = !isDataReady ? 'loading-state' : '';

                    let tooltipIcon = '⏳';
                    let tooltipTitle = 'Informasi';
                    let tooltipDesc = '';
                    let tooltipStatusText = 'ℹ️ Informasi';
                    let tooltipStatusClass = 'info';
                    let tooltipFooter = '';

                    const isQuotaFull = used >= maxQuota;
                    const isLimitFull = !canUserIzinLive(nama);

                    let hasTooltipData = false;

                    if (isQuotaFull) {
                        tooltipIcon = '📊';
                        tooltipTitle = 'Kuota Penuh';
                        tooltipDesc = `${used} dari ${maxQuota} izin telah digunakan hari ini.`;
                        tooltipStatusText = '❌ Tidak dapat START';
                        tooltipStatusClass = 'danger';
                        tooltipFooter = 'Hubungi Leader atau CS Line';
                        hasTooltipData = true;
                    } else if (isLimitFull) {
                        tooltipIcon = '⏳';
                        tooltipTitle = 'Sedang Ada Izin';
                        tooltipDesc = `Ada anggota ${roleLabel} yang sedang izin.`;
                        tooltipStatusText = '⏳ Mohon tunggu';
                        tooltipStatusClass = 'warning';
                        tooltipFooter = 'Coba beberapa saat lagi';
                        hasTooltipData = true;
                    } else if (!isLeaderOrCsLine && !isCurrentUser) {
                        tooltipIcon = '🔒';
                        tooltipTitle = 'Akses Terbatas';
                        tooltipDesc = `Anda hanya bisa memulai izin untuk diri sendiri.`;
                        tooltipStatusText = 'ℹ️ Hanya untuk akun sendiri';
                        tooltipStatusClass = 'info';
                        tooltipFooter = 'Silakan gunakan akun Anda sendiri';
                        hasTooltipData = true;
                    }

                    const tooltipAttrs = hasTooltipData ? `
                        data-tooltip-icon="${tooltipIcon}"
                        data-tooltip-title="${tooltipTitle}"
                        data-tooltip-desc="${tooltipDesc}"
                        data-tooltip-status="${tooltipStatusText}"
                        data-tooltip-status-class="${tooltipStatusClass}"
                        data-tooltip-footer="${tooltipFooter}"
                    ` : '';

                    actionHTML = `
                            <button class="btn-action start ${loadingClass}" 
                                    onclick="mulaiIzin('${nama}')" 
                                    data-nama="${nama}"
                                    ${tooltipAttrs}
                                    ${!canStart || !isDataReady ? 'disabled' : ''}
                                    style="position:relative;">
                                <span class="icon">▶</span> START
                            </button>
                        `;

                    progressHTML = `
                            <div class="progress-container" style="justify-content:center;">
                                <span style="color:var(--text-muted);font-size:11px;font-weight:300;">-</span>
                            </div>
                        `;
                    mulaiHTML = `<span style="color:var(--text-muted);font-size:11px;">-</span>`;
                }

                let voucherDisplay = '-';
                if (voucher > 0) {
                    voucherDisplay = `<span class="voucher-badge" data-voucher="${voucher}" style="cursor:pointer;">
                                            <span class="icon">🎫</span> ${voucher}
                                        </span>`;
                }

                return `
                        <tr class="${rowClass}">
                            <td class="col-status">${statusHTML}</td>
                            <td class="col-nama"><span class="nama-cell">${nama}</span></td>
                            <td class="col-role" style="text-align:center;"><span class="role-tag ${role}">${roleLabel}</span></td>
                            <td class="col-quota" style="text-align:center;">
                                <span class="quota-badge-modern ${quotaClass}">
                                    <span class="used">${used}</span>
                                    <span class="separator">/</span>
                                    <span class="total">${maxQuota}</span>
                                </span>
                            </td>
                            <td class="col-voucher" style="text-align:center;">${voucherDisplay}</td>
                            <td class="col-mulai" style="text-align:center;">${mulaiHTML}</td>
                            <td class="col-progress" style="text-align:center;">
                                <div style="display:flex;flex-direction:column;gap:2px;width:100%;align-items:center;">
                                    <div style="display:flex;align-items:center;gap:6px;width:100%;justify-content:center;">
                                        <span style="font-size:11px;color:var(--text-muted);min-width:45px;font-family:'Courier New',monospace;text-align:right;">${timerHTML}</span>

                        </tr>
                    `;

            document.querySelectorAll('.btn-action.start:disabled').forEach(function(btn) {

                btn.removeEventListener('mouseleave', handleStartMouseLeave);

                btn.addEventListener('mouseenter', handleStartMouseEnter);

                el.removeEventListener('mouseenter', handleVoucherMouseEnter);
                el.removeEventListener('mouseleave', handleVoucherMouseLeave);

                el.addEventListener('mouseenter', handleVoucherMouseEnter);

                const today = new Date();
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                filterTanggal.value = `${year}-${month}-${day}`;
            }

            const namaValue = filterNama ? filterNama.value : '';
            const tanggalValue = filterTanggal ? filterTanggal.value : '';
            const roleValue = filterRole ? filterRole.value : '';
            const bulanValue = filterBulan ? filterBulan.value : '';

            let filtered = [...historyData];

            if (tanggalValue) {
                const selectedDate = new Date(tanggalValue + 'T00:00:00');
                const dateStr = selectedDate.toDateString();
                filtered = filtered.filter(h => {
                    const historyDate = new Date(h.mulai);
                    return historyDate.toDateString() === dateStr;
                });
            }

            if (namaValue) {
                filtered = filtered.filter(h => h.nama === formatName(namaValue));
            }
            if (roleValue) {
                filtered = filtered.filter(h => h.role === roleValue);
            }
            if (bulanValue) {
                const [year, month] = bulanValue.split('-').map(Number);
                filtered = filtered.filter(h => {
                    const d = new Date(h.mulai);
                    return d.getFullYear() === year && d.getMonth() === month - 1;
                });
            }

            filtered.sort((a, b) => new Date(b.mulai) - new Date(a.mulai));

            const historyCount = document.getElementById('historyCount');
            if (historyCount) historyCount.textContent = filtered.length;

            if (filtered.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px;">Tidak ada data history untuk tanggal yang dipilih</td></tr>`;
                return;
            }

            const roleLabels = {
                leader: '👑 Leader',
                csline: '⭐ CS Line',
                cs: '💬 CS',
                kapten: '⚓ Kapten',
                kasir: '💰 Kasir'
            };

            tbody.innerHTML = filtered.map((item, index) => {
                const tMulai = new Date(item.mulai);
                const tSelesai = new Date(item.selesai);
                const durasiDetik = Math.floor((tSelesai - tMulai) / 1000);
                const menit = Math.floor(durasiDetik / 60);
                const detik = durasiDetik % 60;

                const batasDetik = (jackpotLimitMinutes * 60) - 1;
                const isOverLimit = durasiDetik > batasDetik;
                const roleLabel = roleLabels[item.role] || item.role;

                const tanggal = tMulai.toLocaleDateString('id-ID', {
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric'
                });
                const waktuMulai = tMulai.toLocaleTimeString('id-ID', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                const waktuSelesai = tSelesai.toLocaleTimeString('id-ID', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                let durasiText = '';
                if (menit > 0) {
                    durasiText = `${menit} menit ${detik} detik`;
                } else {
                    durasiText = `${detik} detik`;
                }

                const statusBadge = isOverLimit ?
                    `<span class="badge telat">❌ Telat</span>` :
                    `<span class="badge selesai">✅ Selesai</span>`;

                return `
                        <tr>
                            <td>${index + 1}</td>
                            <td><span class="nama-cell">${item.nama}</span></td>
                            <td><span class="role-tag ${item.role}">${roleLabel}</span></td>
                            <td style="font-size:12px;color:var(--text-secondary);">${tanggal}</td>
                            <td class="time-detail">${waktuMulai}</td>
                            <td class="time-detail">${waktuSelesai}</td>
                            <td class="time-detail"><span>${durasiText}</span></td>
                            <td>${statusBadge}</td>
                        </tr>
                    `;
            }).join('');
        };

        // ============================================================
        // TOOLTIP FUNCTIONS
        // ============================================================
        function handleStartMouseEnter(e) {
            const btn = e.currentTarget;

            const hasData = btn.dataset.tooltipTitle &&
                btn.dataset.tooltipTitle !== 'Informasi' &&
                btn.dataset.tooltipDesc &&
                btn.dataset.tooltipDesc !== '';

            if (!hasData) return;

            if (tooltipTimeout) {
                clearTimeout(tooltipTimeout);
                tooltipTimeout = null;
            }

            const tooltipData = {
                icon: btn.dataset.tooltipIcon || '⏳',
                title: btn.dataset.tooltipTitle || 'Informasi',
                desc: btn.dataset.tooltipDesc || '',
                statusText: btn.dataset.tooltipStatus || 'ℹ️ Informasi',
                statusClass: btn.dataset.tooltipStatusClass || 'info',
                footer: btn.dataset.tooltipFooter || ''
            };

            tooltipTimeout = setTimeout(() => {
                showTooltip(btn, tooltipData);
            }, 300);
        }

        function handleStartMouseLeave(e) {
            if (tooltipTimeout) {
                clearTimeout(tooltipTimeout);
                tooltipTimeout = null;
            }

            setTimeout(() => {
                hideTooltip();
            }, 50);
        }

        function showTooltip(btn, tooltipData) {
            const tooltipEl = document.getElementById('startTooltipGlobal');
            if (!tooltipEl) return;

            const iconEl = document.getElementById('tooltipIcon');
            iconEl.textContent = tooltipData.icon || '⏳';
            iconEl.className = 'tooltip-icon ' + (tooltipData.statusClass || 'info');

            document.getElementById('tooltipTitle').textContent = tooltipData.title || 'Informasi';
            document.getElementById('tooltipDesc').textContent = tooltipData.desc || '';

            const statusEl = document.getElementById('tooltipStatus');
            statusEl.textContent = tooltipData.statusText || 'ℹ️ Informasi';
            statusEl.className = 'tooltip-status ' + (tooltipData.statusClass || 'info');

            document.getElementById('tooltipFooter').textContent = tooltipData.footer || '';

            const rect = btn.getBoundingClientRect();
            const tooltipWidth = 280;
            let leftPos = rect.left + rect.width / 2 - tooltipWidth / 2;

            if (leftPos < 10) leftPos = 10;
            if (leftPos + tooltipWidth > window.innerWidth - 10) {
                leftPos = window.innerWidth - tooltipWidth - 10;
            }

            tooltipEl.style.left = leftPos + 'px';
            tooltipEl.style.top = (rect.top - 95) + 'px';

            tooltipEl.classList.add('visible');
            isTooltipVisible = true;
        }

        function hideTooltip() {
            const tooltipEl = document.getElementById('startTooltipGlobal');
            if (!tooltipEl) return;
            tooltipEl.classList.remove('visible');
            isTooltipVisible = false;
        }

        function startClock() {

        function updateClock() {
            const now = new Date();
            const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            const day = days[now.getDay()];
            const date = now.getDate();
            const month = months[now.getMonth()];
            const year = now.getFullYear();

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            const dateEl = document.getElementById('dateDisplay');
            const timeEl = document.getElementById('timeDisplay');

            if (dateEl) dateEl.textContent = `${day}, ${date} ${month}, ${year}`;
            if (timeEl) timeEl.textContent = `${hours}:${minutes}:${seconds}`;

            updateGreeting();
        }

        // ============================================================
        // LOAD DATA DARI DATABASE
        // ============================================================
        async function loadDataFromDatabase() {
            if (isLoading) return;
            isLoading = true;

            hideTooltip();
            hideVoucherTooltip();

            isDataReady = false;
            disableStartButtons();

            try {
                console.log('📥 Loading data from database...');

                const usersPromise = supabaseDashboard
                    .from('users')
                    .select('id, name, role, email, created_at')
                    .limit(100);

                // 🔥 PERBAIKAN: HISTORY TANPA LIMIT
                const historyPromise = supabaseDashboard
                    .from('history')
                    .select('id, nama, tanggal, mulai, selesai, status, role, durasi_detik, is_quota_valid')
                    .order('mulai', { ascending: false });

                const [usersResult, historyResult, izinResult, voucherResult, settingsResult] = await Promise.all([
                    usersPromise,
                    historyPromise,
                    supabaseDashboard.from('izin_anggota').select('*'),
                    supabaseDashboard.from('vouchers').select('*'),
                    supabaseDashboard.from('settings').select('*')
                ]);

                if (!usersResult.error && usersResult.data && usersResult.data.length > 0) {
                    listUsers = usersResult.data;
                    daftarAnggota = usersResult.data.map(u => u.name);

                    usersResult.data.forEach(user => {
                        const nama = user.name;
                        if (!dataIzin[nama]) {
                            dataIzin[nama] = {
                                status: 'none',
                                mulai: null,
                                selesai: null,
                                tanggal: null,
                                role: user.role
                            };
                        } else {
                            dataIzin[nama].role = user.role;
                        }
                    });
                    console.log(`✅ ${usersResult.data.length} users loaded`);
                }

                if (!historyResult.error && historyResult.data) {
                    historyData = historyResult.data.map(h => ({
                        nama: h.nama,
                        tanggal: h.tanggal,
                        mulai: h.mulai,
                        selesai: h.selesai,
                        status: h.status || 'selesai',
                        role: h.role || 'cs',
                        durasiDetik: h.durasi_detik || 0,
                        isQuotaValid: h.is_quota_valid !== undefined ? h.is_quota_valid : true
                    }));
                    console.log(`✅ ${historyResult.data.length} history loaded (ALL)`);
                } else {
                    console.log('⚠️ No history found');
                    historyData = [];
                }

                if (!izinResult.error && izinResult.data) {
                    console.log(`📋 Found ${izinResult.data.length} izin records in database`);

                    daftarAnggota.forEach(nama => {
                        if (dataIzin[nama]) {
                            dataIzin[nama].status = 'none';
                            dataIzin[nama].mulai = null;
                            dataIzin[nama].tanggal = null;
                            dataIzin[nama].selesai = null;
                        }
                    });

                    izinResult.data.forEach(item => {
                        if (dataIzin[item.nama]) {
                            dataIzin[item.nama].status = item.status || 'none';
                            if (item.mulai) {
                                let mulaiStr = item.mulai;
                                if (!mulaiStr.endsWith('Z') && !mulaiStr.includes('+')) {
                                    mulaiStr = mulaiStr + 'Z';
                                }
                                dataIzin[item.nama].mulai = mulaiStr;
                            } else {
                                dataIzin[item.nama].mulai = null;
                            }
                            dataIzin[item.nama].tanggal = item.tanggal;
                            dataIzin[item.nama].selesai = item.selesai;
                        }
                    });
                }

                if (!voucherResult.error && voucherResult.data) {
                    voucherData = {};
                    voucherResult.data.forEach(v => {
                        voucherData[v.nama] = v.jumlah || 0;
                    });
                    console.log(`✅ ${voucherResult.data.length} voucher loaded`);
                } else {
                    voucherData = {};
                }

                if (!settingsResult.error && settingsResult.data && settingsResult.data.length > 0) {
                    settingsResult.data.forEach(setting => {
                        if (setting.key === 'role_limits') {
                            try {
                                limits = JSON.parse(setting.value);
                                updateLimitUI();
                                console.log('✅ role_limits loaded');
                            } catch (e) { console.log('⚠️ Failed to parse role_limits'); }
                        }
                        if (setting.key === 'izin_settings') {
                            try {
                                const izinSettings = JSON.parse(setting.value);
                                if (izinSettings.jackpotLimitMinutes) {
                                    jackpotLimitMinutes = izinSettings.jackpotLimitMinutes;
                                }
                                if (izinSettings.maxIzinPerRole) {
                                    maxIzinPerRole = izinSettings.maxIzinPerRole;
                                }
                                updateSettingsUI();
                                console.log('✅ izin_settings loaded');
                            } catch (e) { console.log('⚠️ Failed to parse izin_settings'); }
                        }
                        if (setting.key === 'ticker_settings') {
                            try {
                                const tickerSettings = JSON.parse(setting.value);
                                if (tickerSettings.items && Array.isArray(tickerSettings.items)) {
                                    tickerItems = tickerSettings.items;
                                }
                                if (tickerSettings.speed) {
                                    tickerSpeed = tickerSettings.speed;
                                }
                                updateTickerUI();
                                updateTickerSpeedUI();
                                console.log('✅ ticker_settings loaded');
                            } catch (e) { console.log('⚠️ Failed to parse ticker_settings'); }
                        }
                        if (setting.key === 'whitelist_ip') {
                            const input = document.getElementById('ipWhitelistInput');
                            if (input) input.value = setting.value || '0.0.0.0';
                            console.log('✅ whitelist_ip loaded');
                        }
                    });
                }

                renderAll();
                updateQuickStats();
                console.log('✅ All data loaded successfully!');

                isDataReady = true;
                enableStartButtons();

                updateProfileDropdown();
                renderTicker();

                subscribeToIzinChanges();

                if (!isShiftInitialized) {
                    await loadShiftActiveData();
                    isShiftInitialized = true;
                }

                lastDataLoad = Date.now();

            } catch (err) {
                console.error('❌ Error loading data:', err);
            } finally {
                isLoading = false;
                isInitialLoad = false;
            }
        }

        // ============================================================

        // ============================================================
        async function checkAuth() {
            isDataReady = false;

            console.log('🔍 checkAuth - Memulai...');

            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const hash = window.location.hash;

            try {
                const { data: { session } } = await supabaseDashboard.auth.getSession();

                if (session?.user?.email) {
                    const isRegistered = await checkUserRegistered(session.user.email);
                    if (!isRegistered) {
                        console.log('❌ User tidak terdaftar, tampilkan popup...');
                        showNotRegisteredPopup(session.user.email);
                        return;
                    }
                }
            } catch (err) {
                console.error('❌ Error checking user registration:', err);
                showNotRegisteredPopup('unknown@email.com');
                return;
            }

            if (code || (hash && hash.includes('access_token'))) {
                console.log('🔑 Detected OAuth redirect, processing...');
                try {
                    const { data, error } = await supabaseDashboard.auth.getSession();

                    if (error) {
                        console.error('❌ Error getting session after redirect:', error);
                        showNotRegisteredPopup('error@email.com');
                        return;

                        await syncUserRoleFromDatabase();
                        updateUserUI();
                        updateProfileDropdown();
                        renderAll();
                        startTimerUpdates();
                        startClock();
                        console.log('✅ Dashboard siap!');
                        return;
                    } else {
                        console.log('⏳ No session yet after redirect, waiting...');
                        setTimeout(() => {
                            window.location.reload();
                        }, 1000);

                    }

                const menuManagement = document.getElementById('menuManagement');

        function updateLiveTimers() {
            const now = new Date();
            const liveCards = document.querySelectorAll('.live-card-col .timer-col');

            liveCards.forEach((el) => {
                const startTime = el.dataset.start;
                if (startTime) {
                    const diff = Math.floor((now - new Date(startTime)) / 1000);
                    const menit = Math.floor(diff / 60);
                    const detik = diff % 60;
                    const batasDetik = (jackpotLimitMinutes * 60) - 1;
                    const isOverLimit = diff > batasDetik;

                    if (isOverLimit) {
                        el.classList.add('over-limit');
                        el.closest('.live-card-col')?.classList.add('over-limit');
                    } else {
                        el.classList.remove('over-limit');
                        el.closest('.live-card-col')?.classList.remove('over-limit');
                    }

                    el.textContent = `${menit}m ${detik}s`;
                }
            });
        }

        window.mulaiIzin = async function(nama) {
            const formattedNama = formatName(nama);
            const isLeaderOrCsLine = currentUserRole === 'leader' || currentUserRole === 'csline' || currentUserRole ===
                'admin';
            const isCurrentUser = isUserCurrent(formattedNama);

            if (!isLeaderOrCsLine && !isCurrentUser) {
                showToast(`⚠️ Anda hanya bisa mengklik START untuk diri Anda sendiri!`, 'warning');
                return;
            }

            if (!canIzinByDailyLimit(formattedNama)) {
                const used = getUsedIzinToday(formattedNama);
                const maxQuota = getMaxQuota(formattedNama);
                showToast(`⚠️ ${formattedNama} sudah mencapai batas maksimum izin hari ini (${used}/${maxQuota})!`,
                    'error');
                return;
            }

            const now = new Date();
            const data = dataIzin[formattedNama];
            const today = now.toDateString();

            if (data.status === 'izin') {
                showToast('⚠️ User sedang dalam izin! Klik END terlebih dahulu.', 'warning');
                return;
            }

            if (!TEST_MODE) {
                try {
                    const role = getRoleForUser(formattedNama);
                    const mulaiISO = now.toISOString();

                    const { data: result, error: rpcError } = await supabaseDashboard.rpc(
                        'start_izin', {
                            p_nama: formattedNama,
                            p_role: role,
                            p_tanggal: today,
                            p_mulai: mulaiISO
                        }
                    );

                    if (rpcError) {
                        console.error('❌ RPC Error:', rpcError);
                        showToast(`❌ Gagal memulai izin: ${rpcError.message}`, 'error');
                        return;
                    }

                    const resultData = typeof result === 'string' ? JSON.parse(result) : result;

                    if (!resultData.success) {
                        showToast(`⚠️ ${resultData.message}`, 'warning', 4000);

                        if (resultData.message && resultData.message.includes('Kuota penuh')) {
                            const roleLabel = ROLE_LABELS[role] || role;
                            const currentCount = resultData.current_count || 0;
                            const limit = resultData.limit || 0;

                            document.getElementById('popupMessage').innerHTML =
                                `Mohon menunggu beberapa saat kedepan <br /><span class="highlight">PS:</span> apabila urgent dapat konfirmasi ke <strong>Kapten</strong>.`;
                            document.getElementById('popupCurrentCount').textContent = currentCount;
                            document.getElementById('popupFooter').innerHTML =
                                `💡 Role <strong>${roleLabel}</strong> saat ini <span id="popupCurrentCount">${currentCount}</span> dari <strong>${limit}</strong> user sedang izin`;
                            document.getElementById('popupLimit').classList.add('show');
                        }
                        return;
                    }

                    isJackpotShown[formattedNama] = false;
                    data.status = 'izin';
                    data.mulai = mulaiISO;
                    data.selesai = null;
                    data.tanggal = today;
                    dataIzin[formattedNama] = data;

                    renderAll();
                    updateCurrentCounts();
                    showToast(`${formattedNama} mulai izin!`, 'info');

                    await loadDataFromDatabase();
                    renderAll();

                } catch (err) {
                    console.error('❌ Error:', err);
                    showToast('❌ Gagal memulai izin: ' + err.message, 'error');
                }
                return;
            }

            isJackpotShown[formattedNama] = false;
            data.status = 'izin';
            data.mulai = now.toISOString();
            data.selesai = null;
            data.tanggal = today;
            dataIzin[formattedNama] = data;

            renderAll();
            updateCurrentCounts();
            showToast(`${formattedNama} mulai izin!`, 'info');
        };

        window.selesaiIzin = async function(nama) {
            const formattedNama = formatName(nama);

            if (endLock[formattedNama]) {
                showToast(`⏳ ${formattedNama} sedang diproses, mohon tunggu...`, 'warning', 1500);
                return;
            }

            const isLeaderOrCsLine = currentUserRole === 'leader' || currentUserRole === 'csline' || currentUserRole ===
                'admin';
            const isCurrentUser = isUserCurrent(formattedNama);

            if (!isLeaderOrCsLine && !isCurrentUser) {
                showToast(`⚠️ Anda hanya bisa mengklik END untuk diri Anda sendiri!`, 'warning');
                return;
            }

            const now = new Date();
            const data = dataIzin[formattedNama];
            if (data.status !== 'izin') {
                showToast('⚠️ User belum dalam status izin!', 'warning');
                return;
            }

            endLock[formattedNama] = true;

            const endButtons = document.querySelectorAll(`.btn-action.end[onclick*="${formattedNama}"]`);
            endButtons.forEach(btn => {
                btn.disabled = true;
                btn.style.opacity = '0.5';
                btn.textContent = '⏳ ...';
            });

            try {
                const selesaiTime = now.toISOString();
                const durasiDetik = Math.floor((now - new Date(data.mulai)) / 1000);

                const batasDetik = (jackpotLimitMinutes * 60) - 1;
                const isOverLimit = durasiDetik > batasDetik;

                data.status = 'selesai';
                data.selesai = selesaiTime;

                const isQuotaValid = durasiDetik >= MIN_IZIN_DURATION_SECONDS;

                const historyEntry = {
                    nama: formattedNama,
                    tanggal: data.tanggal,
                    mulai: data.mulai,
                    selesai: data.selesai,
                    status: 'selesai',
                    role: getRoleForUser(formattedNama),
                    durasiDetik: durasiDetik,
                    isQuotaValid: isQuotaValid
                };

                historyData.push(historyEntry);
                historyData.sort((a, b) => new Date(b.mulai) - new Date(a.mulai));

                if (isQuotaValid) {
                    const today = new Date().toDateString();
                    const validHistory = historyData.filter(h =>
                        h.nama === formattedNama &&
                        h.tanggal === today &&
                        h.status === 'selesai' &&
                        h.durasiDetik >= MIN_IZIN_DURATION_SECONDS
                    );

                    const usedCount = validHistory.length;
                    const maxQuota = getMaxQuota(formattedNama);

                    if (!quotaData[formattedNama] || quotaData[formattedNama].date !== today) {
                        quotaData[formattedNama] = { count: 0, date: today };
                    }
                    quotaData[formattedNama].count = Math.min(usedCount, maxQuota);
                }

                if (isOverLimit) {
                    addVoucher(formattedNama);
                    pendingVoucherClaim = formattedNama;
                }

                dataIzin[formattedNama] = data;

                if (!TEST_MODE) {
                    try {
                        await supabaseDashboard
                            .from('izin_anggota')
                            .upsert({
                                nama: formattedNama,
                                status: 'selesai',
                                mulai: data.mulai,
                                selesai: data.selesai,
                                tanggal: data.tanggal,
                                role: getRoleForUser(formattedNama)
                            }, { onConflict: 'nama' });

                        await supabaseDashboard
                            .from('history')
                            .insert({
                                nama: formattedNama,
                                tanggal: data.tanggal,
                                mulai: data.mulai,
                                selesai: data.selesai,
                                status: 'selesai',
                                role: getRoleForUser(formattedNama),
                                durasi_detik: durasiDetik,
                                is_quota_valid: isQuotaValid
                            });

                    } catch (err) {
                        console.error('❌ Error simpan ke database:', err);
                    }
                }

                renderAll();
                updateCurrentCounts();
                updateQuickStats();

                const menit = Math.floor(durasiDetik / 60);
                const detik = durasiDetik % 60;
                const used = getUsedIzinToday(formattedNama);
                const maxQuota = getMaxQuota(formattedNama);

                let pesan = `Izin selesai! Durasi: ${menit}m ${detik}s`;

                if (!isQuotaValid) {
                    pesan += ` ⚠️ (Di bawah 2 menit, tidak mengurangi quota)`;
                    showToast(pesan, 'warning', 4000);
                } else {
                    pesan += ` ✅ Quota: ${used}/${maxQuota}`;
                    if (isOverLimit) {
                        pesan += ` 🎫 +1 Voucher!`;
                    }
                    showToast(pesan, 'success', 4000);
                }

                if (isOverLimit && !isJackpotShown[formattedNama]) {
                    isJackpotShown[formattedNama] = true;
                    setTimeout(() => {
                        showJackpot();
                    }, 500);
                }

            } catch (err) {
                console.error('❌ Error selesai izin:', err);
                showToast('❌ Gagal menyelesaikan izin: ' + err.message, 'error');
            } finally {
                setTimeout(() => {
                    endLock[formattedNama] = false;
                    const endButtons = document.querySelectorAll(`.btn-action.end[onclick*="${formattedNama}"]`);
                    endButtons.forEach(btn => {
                        btn.disabled = false;
                        btn.style.opacity = '1';
                        btn.innerHTML = '<span class="icon">■</span> END';
                    });
                }, 1000);

                setTimeout(() => {
                    loadDataFromDatabase();
                }, 500);
            }
        };

        window.exportHistory = function() {
            const filterTanggal = document.getElementById('filterTanggal');
            const selectedDate = filterTanggal ? filterTanggal.value : '';

            let dataToExport = [...historyData];

            if (selectedDate) {
                const selectedDateObj = new Date(selectedDate + 'T00:00:00');
                const dateStr = selectedDateObj.toDateString();
                dataToExport = dataToExport.filter(h => {
                    const historyDate = new Date(h.mulai);
                    return historyDate.toDateString() === dateStr;
                });
            }

            if (dataToExport.length === 0) {
                const dateDisplay = selectedDate ?
                    new Date(selectedDate).toLocaleDateString('id-ID') :
                    'Semua data';
                showToast(`⚠️ Tidak ada data untuk tanggal ${dateDisplay}!`, 'warning');
                return;
            }

            let csv = 'No,Nama,Role,Tanggal,Mulai,Selesai,Durasi(menit),Durasi(detik),Status\n';
            dataToExport.forEach((item, index) => {
                const tMulai = new Date(item.mulai);
                const tSelesai = new Date(item.selesai);
                const durasiDetik = Math.floor((tSelesai - tMulai) / 1000);
                const menit = Math.floor(durasiDetik / 60);
                const detik = durasiDetik % 60;
                const batasDetik = (jackpotLimitMinutes * 60) - 1;
                const isOverLimit = durasiDetik > batasDetik;
                const status = isOverLimit ? 'Telat' : 'Selesai';
                const tanggal = tMulai.toLocaleDateString('id-ID');
                const waktuMulai = tMulai.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit',

                const waktuSelesai = tSelesai.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit',
                    second: '2-digit' });
                const roleLabel = ROLE_LABELS[item.role] || item.role;

                    `${index+1},${item.nama},${roleLabel},${tanggal},${waktuMulai},${waktuSelesai},${menit}.${detik},${durasiDetik},${status}\n`;

        // ============================================================
        // REALTIME SUBSCRIPTION (IZIN)
        // ============================================================
        function subscribeToIzinChanges() {
            if (realtimeChannel) {
                supabaseDashboard.removeChannel(realtimeChannel);
                realtimeChannel = null;
            }

            console.log('🔌 Subscribing to izin_anggota changes...');

            realtimeChannel = supabaseDashboard
                .channel('izin_anggota_changes')
                .on(
                    'postgres_changes', {
                        event: '*',
                        schema: 'public',
                        table: 'izin_anggota'
                    },
                    (payload) => {
                        console.log('🔄 Real-time update received:', payload);

                        const { eventType, new: newRecord, old: oldRecord } = payload;

                        if (eventType === 'INSERT' || eventType === 'UPDATE') {
                            const nama = newRecord.nama;
                            if (dataIzin[nama]) {
                                dataIzin[nama].status = newRecord.status || 'none';

                                if (newRecord.mulai) {
                                    let mulaiStr = newRecord.mulai;
                                    if (!mulaiStr.endsWith('Z') && !mulaiStr.includes('+')) {
                                        mulaiStr = mulaiStr + 'Z';
                                    }
                                    dataIzin[nama].mulai = mulaiStr;
                                } else {
                                    dataIzin[nama].mulai = null;
                                }

                                dataIzin[nama].tanggal = newRecord.tanggal;
                                dataIzin[nama].selesai = newRecord.selesai;
                            }
                        } else if (eventType === 'DELETE') {
                            const nama = oldRecord.nama;
                            if (dataIzin[nama]) {
                                dataIzin[nama].status = 'none';
                                dataIzin[nama].mulai = null;
                                dataIzin[nama].tanggal = null;
                                dataIzin[nama].selesai = null;
                            }
                        }

                        renderAll();
                        updateCurrentCounts();
                        console.log('🔄 Dashboard updated via real-time subscription');
                    }
                )
                .subscribe((status) => {
                    console.log('📡 Subscription status:', status);
                });

            return realtimeChannel;
        }

        // ============================================================
        // SWITCH TAB
        // ============================================================
        function switchTab(tab) {
            localStorage.setItem('lastTab', tab);

            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(el => {
                const text = el.textContent.trim();
                if (tab === 'dashboard' && text.includes('Dashboard')) el.classList.add('active');
                else if (tab === 'users' && text.includes('Users')) el.classList.add('active');
                else if (tab === 'voucher' && text.includes('Voucher')) el.classList.add('active');
                else if (tab === 'history' && text.includes('History')) el.classList.add('active');
                else if (tab === 'shifts' && text.includes('Shift Kerja')) el.classList.add('active');
                else if (tab === 'historyshift' && text.includes('Riwayat Shift')) el.classList.add('active');
                else if (tab === 'settings' && text.includes('Settings')) el.classList.add('active');
            });

            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            const tabEl = document.getElementById(`tab-${tab}`);
            if (tabEl) tabEl.classList.add('active');

            const titles = {
                'dashboard': '📊 Dashboard',
                'users': '👤 Users',
                'voucher': '🎫 Voucher',
                'history': '📜 History',
                'shifts': '📅 Shift Kerja',
                'historyshift': '📋 Riwayat Shift',
                'settings': '⚙️ Settings'
            };
            const pageTitle = document.getElementById('pageTitle');
            if (pageTitle) pageTitle.innerHTML = `${titles[tab] || '📊 Dashboard'} <small>Izin Anggota</small>`;

            closeSidebar();

            if (tab === 'dashboard') {
                const now = Date.now();
                if (now - lastDataLoad > 60000) {
                    console.log('🔄 Data expired, refreshing...');
                    loadDataFromDatabase();
                } else {
                    renderDashboardTable();
                }
            } else if (tab === 'users') {
                renderUsersPage();
            } else if (tab === 'voucher') {
                renderVoucherPage();
            } else if (tab === 'history') {
                const filterTanggal = document.getElementById('filterTanggal');
                if (filterTanggal) {
                    const today = new Date();
                    const year = today.getFullYear();
                    const month = String(today.getMonth() + 1).padStart(2, '0');
                    const day = String(today.getDate()).padStart(2, '0');
                    filterTanggal.value = `${year}-${month}-${day}`;
                }
                renderHistory();
            } else if (tab === 'shifts') {
                if (!isShiftInitialized) {
                    loadShiftActiveData();
                    isShiftInitialized = true;
                } else {
                    renderShiftPage();
                }
            } else if (tab === 'historyshift') {
                loadShiftHistory();
            } else if (tab === 'settings') {
                loadIPWhitelist();
                updateSettingsUI();
                updateLimitUI();
                updateTickerUI();
                updateTickerSpeedUI();
                const canManageLimits = userPermissions.canManageLimits;
                const container = document.getElementById('limitSettingsContainer');
                if (container) container.style.display = canManageLimits ? 'block' : 'none';
                const canEdit = userPermissions.canEditSettings;
                document.querySelectorAll('.view-only-indicator').forEach(el => {
                    el.style.display = canEdit ? 'none' : 'inline-flex';
                });
            }
        }

        window.switchTab = switchTab;

        // ============================================================
        // TOGGLE SIDEBAR
        // ============================================================
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('show');
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            if (sidebar) sidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('show');
        }

        window.toggleSidebar = toggleSidebar;
        window.closeSidebar = closeSidebar;

        // ============================================================
        // LOGOUT
        // ============================================================
        window.logout = async function() {
            stopPeriodicRefresh();

            await flushShiftLogs();

            if (TEST_MODE) {
                showToast('🧪 TEST MODE: Logout tidak tersedia. Refresh halaman untuk reset.', 'warning');
                return;
            }
            await supabaseDashboard.auth.signOut();
            window.location.href = '/';
        };

        // ============================================================
        // SHIFT FUNCTIONS (DIPOTONG KARENA PANJANG - SAMA SEPERTI SEBELUMNYA)
        // ============================================================
        // ... (Semua fungsi shift sama seperti sebelumnya)
        // Saya tidak tulis ulang karena sangat panjang

        // ============================================================
        // VISIBILITY CHANGE HANDLER
        // ============================================================
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
                const now = Date.now();
                if (now - lastVisibilityLoad > 15000) {
                    console.log('👁️ Tab became visible, checking data...');
                    lastVisibilityLoad = now;
                    if (!isLoading && isDataReady) {
                        loadDataFromDatabase();
                    }
                    startPeriodicRefresh();
                } else {
                    console.log('⏸️ Visibility reload skipped (cooldown)');
                }
            }
        });

        // ============================================================
        // LOAD EMOTICONS & INIT
        // ============================================================
        loadUserEmoticons();

        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Dashboard Izin - Starting...');

            loadTheme();

            const lastTab = localStorage.getItem('lastTab') || 'dashboard';
            console.log(`📌 Last tab: ${lastTab}`);

            renderTicker();
            checkAuth();

            if (!document.getElementById('shiftPreviewModal')) {
                const modal = document.createElement('div');
                modal.id = 'shiftPreviewModal';
                modal.className = 'shift-preview-modal';
                document.body.appendChild(modal);
            }

            const originalCheckAuth = checkAuth;
            checkAuth = async function() {
                await originalCheckAuth();
                setTimeout(() => {
                    const savedTab = localStorage.getItem('lastTab') || 'dashboard';
                    if (document.getElementById(`tab-${savedTab}`)) {
                        switchTab(savedTab);
                    }
                }, 500);
            };
        });

        console.log('✅ Dashboard siap!');
    </script>
</body>
</html>
