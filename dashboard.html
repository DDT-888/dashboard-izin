            track.style.animation = `tickerScroll ${speed}s linear infinite`;
            track.style.opacity = '1';
            track.style.visibility = 'visible';

            showToast(`👁️ Preview ticker dengan kecepatan ${speed} detik!`, 'success', 2000);

            setTimeout(() => {
                renderTicker();
            }, 5000);
        };

        // ============================================================
        // FUNGSI GLOBAL
        // ============================================================
        window.switchTab = function(tab) {
            currentTab = tab;
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(el => {
                const text = el.textContent.trim();
                if (tab === 'dashboard' && text.includes('Dashboard')) el.classList.add('active');
                else if (tab === 'users' && text.includes('Users')) el.classList.add('active');
                else if (tab === 'voucher' && text.includes('Voucher')) el.classList.add('active');
                else if (tab === 'history' && text.includes('History')) el.classList.add('active');
                else if (tab === 'settings' && text.includes('Settings')) el.classList.add('active');
            });

            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            const tabEl = document.getElementById(`tab-${tab}`);
            if (tabEl) tabEl.classList.add('active');

            const titles = {
                'dashboard': '📊 Dashboard',
                'users': '👤 Users',
                'voucher': '🎫 Voucher',
                'history': '📜 History',
                'settings': '⚙️ Settings'
            };
            const pageTitle = document.getElementById('pageTitle');
            if (pageTitle) pageTitle.innerHTML = `${titles[tab]} <small>Izin Anggota</small>`;
            closeSidebar();

            if (tab === 'dashboard') renderDashboardTable();
            else if (tab === 'users') renderUsersPage();
            else if (tab === 'voucher') renderVoucherPage();
            else if (tab === 'history') {
                const filterTanggal = document.getElementById('filterTanggal');
                if (filterTanggal) {
                    const todayWIB = new Date(new Date().getTime() + (WIB_OFFSET * 60 * 60 * 1000));
                    const year = todayWIB.getFullYear();
                    const month = String(todayWIB.getMonth() + 1).padStart(2, '0');
                    const day = String(todayWIB.getDate()).padStart(2, '0');
                    filterTanggal.value = `${year}-${month}-${day}`;
                }
                renderHistory();
            } else if (tab === 'settings') {
                loadIPWhitelist();
                updateSettingsUI();
                updateLimitUI();
                updateTickerUI();
                updateTickerSpeedUI();
                const canManageLimits = userPermissions.canManageLimits;
                const container = document.getElementById('limitSettingsContainer');
                if (container) container.style.display = canManageLimits ? 'block' : 'none';

                const canEdit = userPermissions.canEditSettings;
                document.querySelectorAll('.view-only-indicator').forEach(el => {
                    el.style.display = canEdit ? 'none' : 'inline-flex';
                });
            }
        };

        window.toggleSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            if (sidebar) sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('show');
        };

        window.closeSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            if (sidebar) sidebar.classList.remove('open');
            if (overlay) overlay.classList.remove('show');
        };

        window.logout = async function() {
            if (TEST_MODE) {
                showToast('🧪 TEST MODE: Logout tidak tersedia. Refresh halaman untuk reset.', 'warning');
                return;
            }
            await supabaseDashboard.auth.signOut();
            window.location.href = '/';
        };

        async function loadIPWhitelist() {
            if (!userPermissions.canViewSettings) {
                const input = document.getElementById('ipWhitelistInput');
                const btn = document.getElementById('btnSaveIP');
                if (input) input.disabled = true;
                if (btn) btn.disabled = true;
                return;
            }

            try {
                const { data, error } = await supabaseDashboard
                    .from('settings')
                    .select('value')
                    .eq('key', 'whitelist_ip')
                    .maybeSingle();

                if (error) throw error;
                const input = document.getElementById('ipWhitelistInput');
                if (input) input.value = data?.value || '';
            } catch (err) {
                console.error('Gagal load IP whitelist:', err);
                if (TEST_MODE) {
                    const input = document.getElementById('ipWhitelistInput');
                    if (input) input.value = '78.138.14.26';
                }
            }
        }

        function renderUsers() {
            renderUsersPage();
        }

        // ============================================================
        // RENDER USERS PAGE
        // ============================================================
        function renderUsersPage() {
            const container = document.getElementById('usersContent');
            if (!container) return;

            const canManage = userPermissions.canManage;

            const roleLabels = {
                leader: '👑 Leader',
                csline: '⭐ CS Line',
                cs: '💬 CS',
                kapten: '⚓ Kapten',
                kasir: '💰 Kasir',
                admin: '🔴 Admin'
            };

            const sortedUsers = [...listUsers].sort((a, b) => {
                const orderA = ROLE_ORDER_SORT[a.role] !== undefined ? ROLE_ORDER_SORT[a.role] : 99;
                const orderB = ROLE_ORDER_SORT[b.role] !== undefined ? ROLE_ORDER_SORT[b.role] : 99;
                return orderA - orderB;
            });

            const roleCounts = {
                leader: 0,
                csline: 0,
                cs: 0,
                kapten: 0,
                kasir: 0
            };

            sortedUsers.forEach(user => {
                if (roleCounts[user.role] !== undefined) {
                    roleCounts[user.role]++;
                }
            });

            let userRows = '';
            if (sortedUsers.length === 0) {
                userRows =
                    `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:20px;font-size:13px;">Belum ada user terdaftar</td></tr>`;
            } else {
                userRows = sortedUsers.map((user, index) => {
                    const roleClass = `role-${user.role}`;
                    const roleLabel = roleLabels[user.role] || user.role;
                    const tanggal = new Date(user.created_at).toLocaleDateString('id-ID', {
                        day: '2-digit',
                        month: 'short',
                        year: 'numeric'
                    });
                    const isCurrentUser = getCurrentUserEmail() === user.email;

                    return `
                            <tr>
                                <td>${index + 1}</td>
                                <td>
                                    <span class="nama-cell">${user.name}</span>
                                    ${isCurrentUser ? '<span style="font-size:10px;color:var(--text-muted);margin-left:4px;">(Anda)</span>' : ''}
                                </td>
                                <td style="text-transform:lowercase;font-size:12px;color:var(--text-secondary);">${user.email}</td>
                                <td><span class="badge ${roleClass}">${roleLabel}</span></td>
                                <td style="font-size:12px;color:var(--text-secondary);">${tanggal}</td>
                                <td>
                                    <button class="btn-hapus" onclick="hapusUser('${user.id}', '${user.email}')" 
                                        ${!canManage || isCurrentUser ? 'disabled' : ''}>
                                        🗑️ Hapus
                                    </button>
                                </td>
                            </tr>
                        `;
                }).join('');
            }

            const viewOnlyText = !canManage ?
                '<span style="font-size:11px;color:var(--text-muted);margin-left:10px;">👁️ View Only</span>' : '';

            container.innerHTML = `
                    <h2 style="margin:16px 0 12px;color:var(--text-primary);font-size:18px;">📝 Register User</h2>

                    <div class="form-anggota">
                        <div class="group">
                            <label>📧 Email User</label>
                            <input type="email" id="inputUserEmail" placeholder="user@email.com" style="text-transform:lowercase;" ${!canManage ? 'disabled' : ''} />
                        </div>
                        <div class="group">
                            <label>👤 Nama User</label>
                            <input type="text" id="inputUserName" placeholder="Nama User" style="text-transform:uppercase;" ${!canManage ? 'disabled' : ''} />
                        </div>
                        <div class="group">
                            <label>🎭 Role</label>
                            <select id="inputUserRole" ${!canManage ? 'disabled' : ''}>
                                <option value="leader">👑 Leader</option>
                                <option value="csline">⭐ CS Line</option>
                                <option value="cs">💬 CS</option>
                                <option value="kapten">⚓ Kapten</option>
                                <option value="kasir">💰 Kasir</option>
                            </select>
                        </div>
                        <button onclick="tambahUser()" id="btnTambahUser" ${!canManage ? 'disabled' : ''}>➕ Tambah User</button>
                        ${viewOnlyText}
                    </div>

                    <div style="display:flex;justify-content:space-between;align-items:center;margin:16px 0 12px;flex-wrap:wrap;gap:8px;">
                        <h3 style="color:var(--text-primary);font-size:17px;margin:0;">📋 List User</h3>
                        <div class="role-summary">
                            <span>👑 Leader: <strong>${roleCounts.leader}</strong></span>
                            <span class="separator">|</span>
                            <span>⭐ CS Line: <strong>${roleCounts.csline}</strong></span>
                            <span class="separator">|</span>
                            <span>💬 CS: <strong>${roleCounts.cs}</strong></span>
                            <span class="separator">|</span>
                            <span>⚓ Kapten: <strong>${roleCounts.kapten}</strong></span>
                            <span class="separator">|</span>
                            <span>💰 Kasir: <strong>${roleCounts.kasir}</strong></span>
                        </div>
                    </div>

                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Nama</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Dibuat</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody">
                                ${userRows}
                            </tbody>
                        </table>
                    </div>
                    <div class="history-count">Total User: <span id="userCount">${sortedUsers.length}</span></div>
                `;

            const userCount = document.getElementById('userCount');
            if (userCount) userCount.textContent = sortedUsers.length;
        }

        // ============================================================
        // RENDER VOUCHER PAGE
        // ============================================================
        function renderVoucherPage() {
            const container = document.getElementById('voucherContent');
            if (!container) return;

            if (!userPermissions.canViewVoucher) {
                container.innerHTML = `
                        <div class="access-denied">
                            <div class="icon">🔒</div>
                            <h3>Akses Ditolak</h3>
                            <p>Anda tidak memiliki izin untuk mengakses halaman ini.</p>
                        </div>
                    `;
                return;
            }

            const voucherList = listUsers
                .map(user => ({
                    ...user,
                    voucher: getVoucherCount(user.name)
                }))
                .filter(user => user.voucher > 0)
                .sort((a, b) => b.voucher - a.voucher);

            let rows = '';
            if (voucherList.length === 0) {
                rows = `
                        <tr>
                            <td colspan="${userPermissions.canManageVoucher ? 5 : 4}" style="text-align:center;color:var(--text-muted);padding:24px;font-size:13px;">
                                <div style="font-size:40px;margin-bottom:8px;">🎫</div>
                                Belum ada anggota yang memiliki voucher
                            </td>
                        </tr>
                    `;
            } else {
                rows = voucherList.map((user, index) => {
                    const roleClass = `role-${user.role}`;
                    const roleLabels = {
                        leader: '👑 Leader',
                        csline: '⭐ CS Line',
                        cs: '💬 CS',
                        kapten: '⚓ Kapten',
                        kasir: '💰 Kasir'
                    };
                    const roleLabel = roleLabels[user.role] || user.role;
                    const canRemove = userPermissions.canManageVoucher && user.voucher > 0;

                    const actionColumn = userPermissions.canManageVoucher ? `
                            <td>
                                <button class="btn-voucher" onclick="kurangiVoucher('${user.name}')" ${!canRemove ? 'disabled' : ''}>
                                    ➖ Kurangi 1
                                </button>
                            </td>
                        ` : '';

                    return `
                            <tr>
                                <td>${index + 1}</td>
                                <td><span class="nama-cell">${user.name}</span></td>
                                <td><span class="badge ${roleClass}">${roleLabel}</span></td>
                                <td>
                                    <span class="voucher-badge" style="font-size:14px;padding:4px 14px;">
                                        <span class="icon">🎫</span> ${user.voucher}
                                        <div class="voucher-tooltip">
                                            <div>
                                                <span class="tooltip-icon">🎁</span>
                                                <span class="tooltip-title">Voucher</span>
                                            </div>
                                            <div class="tooltip-divider"></div>
                                            <div class="tooltip-desc">🎫 Kutip Sampah Office</div>
                                        </div>
                                    </span>
                                </td>
                                ${actionColumn}
                            </tr>
                        `;
                }).join('');
            }

            const totalVoucher = Object.values(voucherData).reduce((a, b) => a + b, 0);

            const headers = userPermissions.canManageVoucher ?
                ['#', 'Nama', 'Role', '🎫 Voucher', 'Aksi'] :
                ['#', 'Nama', 'Role', '🎫 Voucher'];

            const headerRow = headers.map(h => `<th>${h}</th>`).join('');

            const infoText = userPermissions.canManageVoucher ?
                '💡 Klik <strong>Kurangi 1</strong> untuk mengurangi voucher yang sudah digunakan' :
                '👀 Mode Lihat - Hanya Leader & CS Line yang dapat mengurangi voucher';

            container.innerHTML = `
                    <h2 style="margin:16px 0 12px;color:var(--text-primary);font-size:18px;">🎫 Manajemen Voucher</h2>
                    <div style="background:var(--bg-card);border-radius:8px;padding:12px 16px;margin-bottom:16px;box-shadow:var(--shadow-md);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border:1px solid var(--border-color);">
                        <div>
                            <span style="font-weight:600;color:var(--text-primary);font-size:14px;">Total Voucher:</span>
                            <span class="voucher-badge" style="font-size:14px;padding:4px 14px;margin-left:8px;">
                                <span class="icon">🎫</span> ${totalVoucher}
                                <div class="voucher-tooltip">
                                    <div>
                                        <span class="tooltip-icon">🎁</span>
                                        <span class="tooltip-title">Voucher</span>
                                    </div>
                                    <div class="tooltip-divider"></div>
                                    <div class="tooltip-desc">🎫 Kutip Sampah Office</div>
                                </div>
                            </span>
                        </div>
                        <div style="font-size:12px;color:var(--text-muted);">
                            ${infoText}
                        </div>
                    </div>

                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    ${headerRow}
                                </tr>
                            </thead>
                            <tbody>
                                ${rows}
                            </tbody>
                        </table>
                    </div>
                    <div class="history-count">Total User dengan Voucher: <strong>${voucherList.length}</strong> user</div>
                `;

            document.querySelectorAll('.voucher-badge').forEach(function(el) {
                var tooltip = el.querySelector('.voucher-tooltip');
                if (!tooltip) return;

                el.addEventListener('mouseenter', function(e) {
                    var rect = el.getBoundingClientRect();
                    tooltip.style.left = (rect.left + rect.width / 2 - 110) + 'px';
                    tooltip.style.top = (rect.top - 50) + 'px';
                    tooltip.classList.add('visible');
                });

                el.addEventListener('mouseleave', function() {
                    tooltip.classList.remove('visible');
                });
            });
        }

        // ============================================================
        // INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Dashboard Izin - Starting...');

            // 🔥 Load theme dari localStorage
            loadTheme();

            renderTicker();
            checkAuth();

            // 🔥 Set default filter date to today WIB
            const filterTanggal = document.getElementById('filterTanggal');
            if (filterTanggal) {
                const todayWIB = new Date(new Date().getTime() + (WIB_OFFSET * 60 * 60 * 1000));
                const year = todayWIB.getFullYear();
                const month = String(todayWIB.getMonth() + 1).padStart(2, '0');
                const day = String(todayWIB.getDate()).padStart(2, '0');
                filterTanggal.value = `${year}-${month}-${day}`;
            }
        });
    </script>
