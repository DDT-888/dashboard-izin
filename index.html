<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Dashboard Izin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            background: #0a0e1a;
            overflow: hidden;
        }

        /* ========== BACKGROUND ========== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(rgba(0, 0, 0, 0.40), rgba(0, 0, 0, 0.40)),
                url('https://cdn.areabermain.club/assets/cdn/az1/2026/06/06/20260606/ae8c3495e13e910c466ef3e8c26d2b42/bg-piala-dunia-final.png') no-repeat center center;
            background-size: cover;
            z-index: 0;
            animation: bgFadeIn 1.2s ease-out;
        }

        @keyframes bgFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* ========== VIGNETTE ========== */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.15) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* ========== OVERLAY UTAMA ========== */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 26, 0.35);
            z-index: 1;
            backdrop-filter: blur(1px);
        }

        /* ========== ANIMASI MASUK ========== */
        .login-container {
            background: rgba(13, 18, 48, 0.75);
            padding: 40px 45px 35px;
            border-radius: 23px;
            border: 1px solid rgba(0, 229, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 70px rgba(0, 200, 255, 0.08);
            max-width: 440px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
            animation: cardZoomIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.95);
        }

        @keyframes cardZoomIn {
            0% {
                opacity: 0;
                transform: scale(0.92);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.03) 0%, transparent 70%);
            animation: rotateGlow 20s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========== GLOW BERGERAK DI BELAKANG LOGO ========== */
        .logo-glow {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            animation: glowMove 6s ease-in-out infinite alternate;
        }

        @keyframes glowMove {
            0% {
                transform: translate(-10px, -10px) scale(1);
                opacity: 0.4;
            }
            50% {
                transform: translate(10px, 5px) scale(1.2);
                opacity: 0.8;
            }
            100% {
                transform: translate(-5px, 15px) scale(0.9);
                opacity: 0.5;
            }
        }

        /* ========== LOGO - KIRI ATAS ========== */
        .login-logo {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .login-logo .logo-img {
            max-width: 125px;
            height: auto;
            filter: drop-shadow(0 0 25px rgba(0, 229, 255, 0.08));
            transition: 0.3s;
            position: relative;
            z-index: 1;
        }

        .login-logo .logo-img:hover {
            filter: drop-shadow(0 0 40px rgba(0, 229, 255, 0.15));
            transform: scale(1.05);
        }

        /* ========== JAM ========== */
        .clock-container {
            position: fixed;
            top: 24px;
            right: 28px;
            z-index: 3;
            text-align: right;
            animation: fadeInClock 1s ease-out 0.5s forwards;
            opacity: 0;
        }

        @keyframes fadeInClock {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .clock-container .clock-time {
            font-size: 24px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.03);
        }

        .clock-container .clock-date {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 2px;
            margin-top: 2px;
            font-weight: 300;
        }

        /* ========== TITLE - TENGAH ========== */
        .login-title {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
            width: 100%;
        }

        .login-title h1 {
            font-size: 33px;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #00e5ff, #00b8d4, #7c4dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
            text-shadow: 0 0 60px rgba(0, 229, 255, 0.05);
            width: 100%;
            text-align: justify;
            text-align-last: justify;
        }

        .login-title .subtitle-main {
            font-size: 13px;
            color: rgba(0, 229, 255, 0.25);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 3px;
            font-weight: 300;
            text-align: right;
            padding-right: 2px;
        }

        /* ========== GOOGLE BUTTON ========== */
        .g-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 20px;
            background: rgba(0, 229, 255, 0.04);
            border: 1px solid rgba(0, 229, 255, 0.1);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .g-btn:hover {
            background: rgba(0, 229, 255, 0.08);
            border-color: rgba(0, 229, 255, 0.2);
            color: #00e5ff;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.05);
            transform: translateY(-2px);
        }

        .g-btn:active {
            transform: scale(0.98);
        }

        .g-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .g-btn img {
            width: 24px;
            height: 24px;
        }

        .error-msg {
            color: #f44336;
            font-size: 14px;
            margin-top: 16px;
            display: none;
            background: rgba(244, 67, 54, 0.05);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(244, 67, 54, 0.05);
            position: relative;
            z-index: 1;
        }

        .loading-spinner {
            display: none;
            margin: 20px auto;
            border: 4px solid rgba(0, 229, 255, 0.05);
            border-top: 4px solid #00e5ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-message {
            margin-top: 16px;
            font-size: 14px;
            color: rgba(0, 229, 255, 0.4);
            display: none;
            position: relative;
            z-index: 1;
        }

        .status-message.show {
            display: block;
            animation: pulseText 1.5s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* ========== DIVIDER ========== */
        .login-container .divider {
            display: flex;
            align-items: center;
            margin: 28px 0 22px;
            position: relative;
            z-index: 1;
        }

        .login-container .divider::before,
        .login-container .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(0, 229, 255, 0.06);
        }

        .login-container .divider span {
            padding: 0 16px;
            color: rgba(0, 229, 255, 0.25);
            font-size: 15px;
        }

        /* ========== IP INFO ========== */
        .ip-info {
            margin-top: 22px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            padding: 10px 14px;
            background: rgba(0, 229, 255, 0.02);
            border-radius: 8px;
            border: 1px solid rgba(0, 229, 255, 0.04);
            position: relative;
            z-index: 1;
            word-break: break-all;
        }

        .ip-info .status-ok {
            color: #00e676;
            font-weight: 600;
        }

        .ip-info .status-blocked {
            color: #f44336;
            font-weight: 600;
        }

        /* ========== FOOTER ========== */
        .login-footer {
            margin-top: 22px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.12);
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        /* ========== CORNER DECORATIONS ========== */
        .login-container .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: rgba(0, 229, 255, 0.04);
            border-style: solid;
            border-width: 0;
            pointer-events: none;
            z-index: 0;
        }
        .login-container .corner.tl {
            top: 12px;
            left: 12px;
            border-top-width: 1px;
            border-left-width: 1px;
            border-radius: 4px 0 0 0;
        }
        .login-container .corner.tr {
            top: 12px;
            right: 12px;
            border-top-width: 1px;
            border-right-width: 1px;
            border-radius: 0 4px 0 0;
        }
        .login-container .corner.bl {
            bottom: 12px;
            left: 12px;
            border-bottom-width: 1px;
            border-left-width: 1px;
            border-radius: 0 0 0 4px;
        }
        .login-container .corner.br {
            bottom: 12px;
            right: 12px;
            border-bottom-width: 1px;
            border-right-width: 1px;
            border-radius: 0 0 4px 0;
        }

        /* ========== PARTIKEL ========== */
        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            background: rgba(0, 229, 255, 0.12);
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) translateX(0px) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) translateX(var(--drift)) scale(1);
                opacity: 0;
            }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px 28px;
                margin: 10px;
                border-radius: 20px;
            }
            .login-title h1 {
                font-size: 27px;
                letter-spacing: 3px;
            }
            .login-logo .logo-img {
                max-width: 90px;
            }
            .login-title {
                margin-bottom: 26px;
            }
            .login-title .subtitle-main {
                font-size: 11px;
                letter-spacing: 4px;
            }
            .g-btn {
                font-size: 14px;
                padding: 12px 16px;
            }
            .login-container .corner {
                width: 20px;
                height: 20px;
            }
            body::before {
                background-size: cover;
                background-position: center;
            }
            .login-container .divider {
                margin: 22px 0 18px;
            }
            .login-container .divider span {
                font-size: 13px;
            }
            .ip-info {
                margin-top: 18px;
            }
            .login-footer {
                margin-top: 18px;
                font-size: 10px;
            }
            .logo-glow {
                width: 80px;
                height: 80px;
                top: 5px;
                left: 5px;
            }
            .clock-container {
                top: 16px;
                right: 18px;
            }
            .clock-container .clock-time {
                font-size: 18px;
            }
            .clock-container .clock-date {
                font-size: 9px;
            }
        }

        @media (max-width: 380px) {
            .login-container {
                padding: 20px 16px 20px;
                border-radius: 18px;
            }
            .login-title h1 {
                font-size: 23px;
                letter-spacing: 2px;
            }
            .login-logo .logo-img {
                max-width: 75px;
            }
            .login-logo {
                margin-bottom: 18px;
            }
            .login-title {
                margin-bottom: 22px;
            }
            .login-title .subtitle-main {
                font-size: 10px;
                letter-spacing: 3px;
            }
            .g-btn {
                font-size: 12px;
                padding: 10px 12px;
                gap: 8px;
            }
            .g-btn img {
                width: 20px;
                height: 20px;
            }
            .ip-info {
                font-size: 10px;
                padding: 8px 10px;
            }
            .login-container .divider span {
                font-size: 11px;
            }
            .logo-glow {
                width: 60px;
                height: 60px;
                top: 5px;
                left: 5px;
            }
            .clock-container {
                top: 12px;
                right: 14px;
            }
            .clock-container .clock-time {
                font-size: 15px;
            }
            .clock-container .clock-date {
                font-size: 8px;
            }
            .login-footer {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== VIGNETTE ===== -->
    <div class="vignette"></div>

    <!-- ===== JAM ===== -->
    <div class="clock-container" id="clockContainer">
        <div class="clock-time" id="clockTime">--:--:--</div>
        <div class="clock-date" id="clockDate">Loading...</div>
    </div>

    <!-- ===== PARTIKEL ===== -->
    <div id="particles"></div>

    <div class="login-container">
        <!-- Corner Decorations -->
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <!-- Glow Bergerak -->
        <div class="logo-glow"></div>

        <!-- ===== LOGO - KIRI ATAS ===== -->
        <div class="login-logo">
            <img src="https://cdn.areabermain.club/assets/cdn/az1/2026/07/08/20260708/8a08b19ab55c1f8c92bb0404eb934a1f/image-photoroom.png" alt="DDT" class="logo-img" />
        </div>

        <!-- ===== TITLE - TENGAH ===== -->
        <div class="login-title">
            <h1>DASHBOARD DDT</h1>
            <div class="subtitle-main">Our Site • Our Pride</div>
        </div>

        <!-- ===== GOOGLE BUTTON ===== -->
        <button class="g-btn" id="loginBtn">
            <img src="https://www.google.com/favicon.ico" alt="Google" />
            Login dengan Google
        </button>

        <div class="loading-spinner" id="loadingSpinner"></div>
        <div class="status-message" id="statusMessage">⏳ Mengalihkan ke dashboard...</div>
        <div class="error-msg" id="errorMsg"></div>

        <!-- ===== DIVIDER ===== -->
        <div class="divider">
            <span>🔒</span>
        </div>

        <!-- ===== IP INFO ===== -->
        <div class="ip-info" id="ipInfo">
            🔍 Mengecek IP Anda...
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="login-footer">v1.0 • Shark Engine</div>
    </div>

    <!-- ============================================================ -->
    <!-- SUPABASE CLIENT -->
    <!-- ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script>
        // ============================================================
        // KONFIGURASI SUPABASE
        // ============================================================
        const SUPABASE_URL = 'https://kdmxjficzigsumvcsrtn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkbXhqZmljemlnc3VtdmNzcnRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMTI4MDAsImV4cCI6MjA5ODg4ODgwMH0.LTh93wC11NeydKGlrkxSreaSTQFq5KiidWisQ09CqnM';

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        console.log('🚀 Supabase client initialized');

        // ============================================================
        // ELEMEN DOM
        // ============================================================
        const loginBtn = document.getElementById('loginBtn');
        const spinner = document.getElementById('loadingSpinner');
        const errorMsg = document.getElementById('errorMsg');
        const ipInfo = document.getElementById('ipInfo');
        const statusMsg = document.getElementById('statusMessage');

        // ============================================================
        // JAM
        // ============================================================
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const timeEl = document.getElementById('clockTime');
            const dateEl = document.getElementById('clockDate');
            
            if (timeEl) {
                timeEl.textContent = `${hours}:${minutes}:${seconds}`;
            }
            
            if (dateEl) {
                const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                const dayName = days[now.getDay()];
                const monthName = months[now.getMonth()];
                const date = now.getDate();
                const year = now.getFullYear();
                dateEl.textContent = `${dayName}, ${date} ${monthName} ${year}`;
            }
        }

        // ============================================================
        // PARTIKEL
        // ============================================================
        function createParticles() {
            const container = document.getElementById('particles');
            const count = 18;
            
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 4 + 2;
                const left = Math.random() * 100;
                const duration = Math.random() * 15 + 10;
                const delay = Math.random() * 20;
                const drift = (Math.random() - 0.5) * 80;
                
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = left + '%';
                particle.style.setProperty('--drift', drift + 'px');
                particle.style.animationDuration = duration + 's';
                particle.style.animationDelay = delay + 's';
                particle.style.opacity = Math.random() * 0.4 + 0.1;
                
                container.appendChild(particle);
            }
        }

        // ============================================================
        // CEK SESSION
        // ============================================================
        async function checkSession() {
            try {
                console.log('🔍 Checking session...');
                const { data: { session } } = await supabaseClient.auth.getSession();

                if (session) {
                    console.log('✅ Session found, redirecting to dashboard...');
                    statusMsg.textContent = '✅ Login berhasil! Mengalihkan ke dashboard...';
                    statusMsg.classList.add('show');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 500);
                    return true;
                }
                console.log('❌ No session found');
                return false;
            } catch (err) {
                console.error('❌ Error check session:', err);
                return false;
            }
        }

        // ============================================================
        // CEK IP
        // ============================================================
        async function checkIP() {
            try {
                ipInfo.textContent = '🔍 Mengecek IP Anda...';

                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                const userIP = data.ip;
                console.log('📡 IP User:', userIP);

                const { data: settings, error } = await supabaseClient
                    .from('settings')
                    .select('value')
                    .eq('key', 'whitelist_ip')
                    .single();

                if (error) {
                    console.error('❌ Gagal ambil whitelist:', error);
                    ipInfo.textContent = '⚠️ Gagal cek whitelist';
                    return;
                }

                const whitelistIPs = settings.value.split(',').map(ip => ip.trim());

                if (!whitelistIPs.includes(userIP)) {
                    ipInfo.innerHTML =
                        `📡 IP: <strong>${userIP}</strong> <span class="status-blocked">⛔ Tidak terdaftar!</span>`;
                    loginBtn.disabled = true;
                    loginBtn.style.opacity = '0.4';
                    errorMsg.textContent = '⛔ Akses ditolak! IP Anda tidak terdaftar. Hubungi admin.';
                    errorMsg.style.display = 'block';
                } else {
                    ipInfo.innerHTML =
                        `📡 IP: <strong>${userIP}</strong> <span class="status-ok">✅ Terdaftar</span>`;
                    loginBtn.disabled = false;
                }
            } catch (err) {
                console.error('❌ Gagal cek IP:', err);
                ipInfo.textContent = '⚠️ Gagal mengecek IP: ' + err.message;
            }
        }

        // ============================================================
        // LOGIN WITH GOOGLE
        // ============================================================
        async function loginWithGoogle() {
            console.log('🚀 Login button clicked');

            loginBtn.disabled = true;
            spinner.style.display = 'block';
            statusMsg.classList.remove('show');
            errorMsg.style.display = 'none';

            try {
                // Cek IP sebelum login
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                const userIP = ipData.ip;
                console.log('📡 Login IP:', userIP);

                const { data: settings, error: settingsError } = await supabaseClient
                    .from('settings')
                    .select('value')
                    .eq('key', 'whitelist_ip')
                    .single();

                if (settingsError) throw settingsError;

                const whitelistIPs = settings.value.split(',').map(ip => ip.trim());

                if (!whitelistIPs.includes(userIP)) {
                    errorMsg.textContent = `⛔ IP ${userIP} tidak terdaftar! Hubungi admin.`;
                    errorMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    spinner.style.display = 'none';
                    return;
                }

                const redirectTo = window.location.origin + '/dashboard.html';
                console.log('🔗 Redirect to:', redirectTo);

                statusMsg.textContent = '⏳ Mengalihkan ke Google Login...';
                statusMsg.classList.add('show');

                const { data, error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: redirectTo,
                    },
                });

                if (error) throw error;

                console.log('✅ OAuth berhasil, redirect ke Google...');

            } catch (err) {
                console.error('❌ Login error:', err);
                errorMsg.textContent = '❌ Gagal login: ' + err.message;
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                spinner.style.display = 'none';
                statusMsg.classList.remove('show');
            }
        }

        // ============================================================
        // HANDLE REDIRECT DARI GOOGLE
        // ============================================================
        async function handleRedirect() {
            console.log('🔍 Checking for OAuth redirect...');

            const hash = window.location.hash;
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');

            if (hash && hash.includes('access_token')) {
                console.log('🔑 Detected OAuth redirect with token hash');
                statusMsg.textContent = '✅ Login berhasil! Menunggu redirect...';
                statusMsg.classList.add('show');

                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1000);
                return true;
            }

            if (code) {
                console.log('🔑 Detected OAuth redirect with code');
                statusMsg.textContent = '✅ Login berhasil! Menunggu redirect...';
                statusMsg.classList.add('show');

                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1000);
                return true;
            }

            return false;
        }

        // ============================================================
        // EVENT LISTENER
        // ============================================================
        loginBtn.addEventListener('click', loginWithGoogle);

        // ============================================================
        // INIT
        // ============================================================
        async function init() {
            console.log('🚀 Dashboard Izin - Login Page');
            console.log('📍 URL:', window.location.href);
            console.log('🔗 Redirect target:', window.location.origin + '/dashboard.html');

            // Buat partikel
            createParticles();

            // Mulai jam
            updateClock();
            setInterval(updateClock, 1000);

            // Cek apakah ini redirect dari OAuth
            const isRedirect = await handleRedirect();
            if (isRedirect) return;

            // Cek session
            const hasSession = await checkSession();
            if (hasSession) return;

            // Cek IP
            await checkIP();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
