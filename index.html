<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Dashboard Izin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            background: #0a0e1a;
            overflow: hidden;
        }

        /* ========== BACKGROUND ========== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(rgba(0, 0, 0, 0.40), rgba(0, 0, 0, 0.40)),
                url('https://cdn.areabermain.club/assets/cdn/az1/2026/06/06/20260606/ae8c3495e13e910c466ef3e8c26d2b42/bg-piala-dunia-final.png') no-repeat center center;
            background-size: cover;
            z-index: 0;
            animation: bgFadeIn 1.2s ease-out;
        }

        @keyframes bgFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* ========== VIGNETTE ========== */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.15) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* ========== OVERLAY UTAMA ========== */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 26, 0.35);
            z-index: 1;
            backdrop-filter: blur(1px);
        }

        /* ========== ANIMASI MASUK ========== */
        .login-container {
            background: rgba(13, 18, 48, 0.75);
            padding: 40px 45px 35px;
            border-radius: 23px;
            border: 1px solid rgba(0, 229, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 70px rgba(0, 200, 255, 0.08);
            max-width: 440px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
            animation: cardZoomIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.95);
        }

        @keyframes cardZoomIn {
            0% {
                opacity: 0;
                transform: scale(0.92);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.03) 0%, transparent 70%);
            animation: rotateGlow 20s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========== GLOW BERGERAK DI BELAKANG LOGO ========== */
        .logo-glow {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            animation: glowMove 6s ease-in-out infinite alternate;
        }

        @keyframes glowMove {
            0% {
                transform: translate(-10px, -10px) scale(1);
                opacity: 0.4;
            }
            50% {
                transform: translate(10px, 5px) scale(1.2);
                opacity: 0.8;
            }
            100% {
                transform: translate(-5px, 15px) scale(0.9);
                opacity: 0.5;
            }
        }

        /* ========== LOGO - KIRI ATAS ========== */
        .login-logo {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .login-logo .logo-img {
            max-width: 125px;
            height: auto;
            filter: drop-shadow(0 0 25px rgba(0, 229, 255, 0.08));
            transition: 0.3s;
            position: relative;
            z-index: 1;
        }

        .login-logo .logo-img:hover {
            filter: drop-shadow(0 0 40px rgba(0, 229, 255, 0.15));
            transform: scale(1.05);
        }

        /* ========== JAM ========== */
        .clock-container {
            position: fixed;
            top: 24px;
            right: 28px;
            z-index: 3;
            text-align: right;
            animation: fadeInClock 1s ease-out 0.5s forwards;
            opacity: 0;
        }

        @keyframes fadeInClock {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .clock-container .clock-time {
            font-size: 24px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.03);
        }

        .clock-container .clock-date {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 2px;
            margin-top: 2px;
            font-weight: 300;
        }

        /* ========== TITLE - TENGAH ========== */
        .login-title {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
            width: 100%;
        }

        .login-title h1 {
            font-size: 33px;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #00e5ff, #00b8d4, #7c4dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
            text-shadow: 0 0 60px rgba(0, 229, 255, 0.05);
            width: 100%;
            text-align: justify;
            text-align-last: justify;
        }

        .login-title .subtitle-main {
            font-size: 13px;
            color: rgba(0, 229, 255, 0.25);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 3px;
            font-weight: 300;
            text-align: right;
            padding-right: 2px;
        }

        /* ========== GOOGLE BUTTON ========== */
        .g-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 20px;
            background: rgba(0, 229, 255, 0.04);
            border: 1px solid rgba(0, 229, 255, 0.1);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .g-btn:hover {
            background: rgba(0, 229, 255, 0.08);
            border-color: rgba(0, 229, 255, 0.2);
            color: #00e5ff;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.05);
            transform: translateY(-2px);
        }

        .g-btn:active {
            transform: scale(0.98);
        }

        .g-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .g-btn img {
            width: 24px;
            height: 24px;
        }

        .error-msg {
            color: #f44336;
            font-size: 14px;
            margin-top: 16px;
            display: none;
            background: rgba(244, 67, 54, 0.05);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(244, 67, 54, 0.05);
            position: relative;
            z-index: 1;
        }

        .loading-spinner {
            display: none;
            margin: 20px auto;
            border: 4px solid rgba(0, 229, 255, 0.05);
            border-top: 4px solid #00e5ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-message {
            margin-top: 16px;
            font-size: 14px;
            color: rgba(0, 229, 255, 0.4);
            display: none;
            position: relative;
            z-index: 1;
        }

        .status-message.show {
            display: block;
            animation: pulseText 1.5s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* ========== DIVIDER ========== */
        .login-container .divider {
            display: flex;
            align-items: center;
            margin: 28px 0 22px;
            position: relative;
            z-index: 1;
        }

        .login-container .divider::before,
        .login-container .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(0, 229, 255, 0.06);
        }

        .login-container .divider span {
            padding: 0 16px;
            color: rgba(0, 229, 255, 0.25);
            font-size: 15px;
        }

        /* ========== IP INFO ========== */
        .ip-info {
            margin-top: 22px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            padding: 10px 14px;
            background: rgba(0, 229, 255, 0.02);
            border-radius: 8px;
            border: 1px solid rgba(0, 229, 255, 0.04);
            position: relative;
            z-index: 1;
            word-break: break-all;
        }

        .ip-info .status-ok {
            color: #00e676;
            font-weight: 600;
        }

        .ip-info .status-blocked {
            color: #f44336;
            font-weight: 600;
        }

        /* ========== FOOTER ========== */
        .login-footer {
            margin-top: 22px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.12);
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        /* ========== CORNER DECORATIONS ========== */
        .login-container .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: rgba(0, 229, 255, 0.04);
            border-style: solid;
            border-width: 0;
            pointer-events: none;
            z-index: 0;
        }
        .login-container .corner.tl {
            top: 12px;
            left: 12px;
            border-top-width: 1px;
            border-left-width: 1px;
            border-radius: 4px 0 0 0;
        }
        .login-container .corner.tr {
            top: 12px;
            right: 12px;
            border-top-width: 1px;
            border-right-width: 1px;
            border-radius: 0 4px 0 0;
        }
        .login-container .corner.bl {
            bottom: 12px;
            left: 12px;
            border-bottom-width: 1px;
            border-left-width: 1px;
            border-radius: 0 0 0 4px;
        }
        .login-container .corner.br {
            bottom: 12px;
            right: 12px;
            border-bottom-width: 1px;
            border-right-width: 1px;
            border-radius: 0 0 4px 0;
        }

        /* ========== PARTIKEL ========== */
        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            background: rgba(0, 229, 255, 0.12);
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) translateX(0px) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) translateX(var(--drift)) scale(1);
                opacity: 0;
            }
        }


        /* ========== ACCESS DENIED POPUP - DASHBOARD v2.7.1 SYNC ========== */
        .access-denied-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(2, 15, 20, 0.72);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            animation: accessFadeIn 0.2s ease;
        }

        @keyframes accessFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .access-denied-card {
            position: relative;
            overflow: hidden;
            width: 432px;
            max-width: calc(100vw - 42px);
            padding: 22px;
            border-radius: 18px;
            background:
                radial-gradient(circle at 93% 2%, rgba(0,229,255,.10), transparent 34%),
                linear-gradient(180deg, rgba(255,255,255,.025), transparent 38%),
                rgba(13,18,48,.98);
            border: 1px solid rgba(255,107,107,.18);
            box-shadow:
                0 32px 90px rgba(0,0,0,.42),
                inset 0 1px 0 rgba(255,255,255,.045);
            animation: accessCardIn .22s cubic-bezier(.22,.61,.36,1);
        }

        @keyframes accessCardIn {
            from { opacity: 0; transform: translateY(8px) scale(.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .access-denied-topline {
            position: absolute;
            top: 0;
            left: 36px;
            right: 36px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #ff6b6b, #00e5ff, transparent);
            opacity: .8;
        }

        .access-denied-heading {
            display: flex;
            align-items: center;
            gap: 11px;
            margin-bottom: 13px;
        }

        .access-denied-icon {
            width: 42px;
            height: 42px;
            flex: 0 0 42px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            background: rgba(255,107,107,.08);
            color: #ff7f88;
            border: 1px solid rgba(255,107,107,.18);
        }

        .access-denied-icon svg,
        .access-denied-button-icon svg {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.9;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .access-denied-icon svg {
            width: 20px;
            height: 20px;
        }

        .access-denied-eyebrow {
            margin-bottom: 4px;
            color: rgba(255,255,255,.33);
            font-size: 7px;
            font-weight: 850;
            letter-spacing: 1px;
        }

        .access-denied-card h2 {
            margin: 0;
            color: rgba(255,255,255,.94);
            font-size: 17px;
            font-weight: 820;
            letter-spacing: -.2px;
        }

        .access-denied-message {
            margin: 0 0 13px;
            color: rgba(255,255,255,.68);
            font-size: 13px;
            line-height: 1.55;
            text-align: left;
        }

        .access-denied-message strong {
            color: rgba(255,255,255,.92);
        }

        .access-denied-info {
            position: relative;
            padding: 11px 12px 11px 14px;
            border-radius: 10px;
            background:
                linear-gradient(90deg, rgba(0,229,255,.045), transparent 60%),
                rgba(255,255,255,.025);
            color: rgba(255,255,255,.58);
            border: 1px solid rgba(0,229,255,.08);
            font-size: 12px;
            line-height: 1.5;
            text-align: left;
        }

        .access-denied-info::before {
            content: "";
            position: absolute;
            left: 0;
            top: 9px;
            bottom: 9px;
            width: 2px;
            border-radius: 999px;
            background: #00e5ff;
            opacity: .72;
        }

        .access-denied-info strong {
            color: #7eeef9;
        }

        .access-denied-logout {
            width: 100%;
            min-height: 39px;
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border-radius: 10px;
            border: 1px solid rgba(0,229,255,.22);
            background: linear-gradient(135deg, #008fa5, #00b8d4);
            color: #fff;
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .1px;
            cursor: pointer;
            transition: .18s ease;
            box-shadow: 0 8px 18px rgba(0,184,212,.14);
        }

        .access-denied-logout:hover {
            transform: translateY(-1px);
            box-shadow: 0 11px 24px rgba(0,184,212,.20);
        }

        .access-denied-button-icon {
            width: 15px;
            height: 15px;
            display: grid;
            place-items: center;
        }

        .access-denied-button-icon svg {
            width: 15px;
            height: 15px;
        }

        .divider-lock {
            width: 18px;
            height: 18px;
            display: inline-grid;
            place-items: center;
            color: rgba(0,229,255,.28);
        }

        .divider-lock svg {
            width: 15px;
            height: 15px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* ========== RESPONSIVE ========== */
        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px 28px;
                margin: 10px;
                border-radius: 20px;
            }
            .login-title h1 {
                font-size: 27px;
                letter-spacing: 3px;
            }
            .login-logo .logo-img {
                max-width: 90px;
            }
            .login-title {
                margin-bottom: 26px;
            }
            .login-title .subtitle-main {
                font-size: 11px;
                letter-spacing: 4px;
            }
            .g-btn {
                font-size: 14px;
                padding: 12px 16px;
            }
            .login-container .corner {
                width: 20px;
                height: 20px;
            }
            body::before {
                background-size: cover;
                background-position: center;
            }
            .login-container .divider {
                margin: 22px 0 18px;
            }
            .login-container .divider span {
                font-size: 13px;
            }
            .ip-info {
                margin-top: 18px;
            }
            .login-footer {
                margin-top: 18px;
                font-size: 10px;
            }
            .logo-glow {
                width: 80px;
                height: 80px;
                top: 5px;
                left: 5px;
            }
            .clock-container {
                top: 16px;
                right: 18px;
            }
            .clock-container .clock-time {
                font-size: 18px;
            }
            .clock-container .clock-date {
                font-size: 9px;
            }
        }

        @media (max-width: 380px) {
            .login-container {
                padding: 20px 16px 20px;
                border-radius: 18px;
            }
            .login-title h1 {
                font-size: 23px;
                letter-spacing: 2px;
            }
            .login-logo .logo-img {
                max-width: 75px;
            }
            .login-logo {
                margin-bottom: 18px;
            }
            .login-title {
                margin-bottom: 22px;
            }
            .login-title .subtitle-main {
                font-size: 10px;
                letter-spacing: 3px;
            }
            .g-btn {
                font-size: 12px;
                padding: 10px 12px;
                gap: 8px;
            }
            .g-btn img {
                width: 20px;
                height: 20px;
            }
            .ip-info {
                font-size: 10px;
                padding: 8px 10px;
            }
            .login-container .divider span {
                font-size: 11px;
            }
            .logo-glow {
                width: 60px;
                height: 60px;
                top: 5px;
                left: 5px;
            }
            .clock-container {
                top: 12px;
                right: 14px;
            }
            .clock-container .clock-time {
                font-size: 15px;
            }
            .clock-container .clock-date {
                font-size: 8px;
            }
            .login-footer {
                font-size: 9px;
            }
        }
    
        @media (max-width: 480px) {
            .access-denied-card {
                padding: 19px;
                border-radius: 15px;
            }

            .access-denied-heading {
                align-items: flex-start;
            }

            .access-denied-card h2 {
                font-size: 15px;
            }

            .access-denied-message {
                font-size: 12px;
            }

            .access-denied-info {
                font-size: 11px;
            }
        }

    
        .ip-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 36px;
        }

        .ip-info .ip-label {
            padding: 2px 6px;
            border-radius: 999px;
            color: rgba(0,229,255,.56);
            background: rgba(0,229,255,.05);
            border: 1px solid rgba(0,229,255,.08);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: .4px;
        }

        .ip-info strong {
            color: rgba(255,255,255,.64);
            font-weight: 700;
        }

        .ip-info .status-ok,
        .ip-info .status-blocked {
            padding: 2px 7px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 750;
        }

        .ip-info .status-ok {
            color: #66d99b;
            background: rgba(46,204,113,.06);
            border: 1px solid rgba(46,204,113,.10);
        }

        .ip-info .status-blocked {
            color: #ff858d;
            background: rgba(255,107,107,.06);
            border: 1px solid rgba(255,107,107,.10);
        }

    </style>
</head>
<body>

    <!-- ===== VIGNETTE ===== -->
    <div class="vignette"></div>

    <!-- ===== JAM ===== -->
    <div class="clock-container" id="clockContainer">
        <div class="clock-time" id="clockTime">--:--:--</div>
        <div class="clock-date" id="clockDate">Loading...</div>
    </div>

    <!-- ===== PARTIKEL ===== -->
    <div id="particles"></div>

    <div class="login-container">
        <!-- Corner Decorations -->
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <!-- Glow Bergerak -->
        <div class="logo-glow"></div>

        <!-- ===== LOGO - KIRI ATAS ===== -->
        <div class="login-logo">
            <img src="https://dashboard-izin.pages.dev/assets/Logo%20DDT%20-%20Full.png" alt="DDT" class="logo-img" />
        </div>

        <!-- ===== TITLE - TENGAH ===== -->
        <div class="login-title">
            <h1>DASHBOARD DDT</h1>
            <div class="subtitle-main">Our Site • Our Pride</div>
        </div>

        <!-- ===== GOOGLE BUTTON ===== -->
        <button class="g-btn" id="loginBtn">
            <img src="https://www.google.com/favicon.ico" alt="Google" />
            Login dengan Google
        </button>

        <div class="loading-spinner" id="loadingSpinner"></div>
        <div class="status-message" id="statusMessage">Mengalihkan ke dashboard...</div>
        <div class="error-msg" id="errorMsg"></div>

        <!-- ===== DIVIDER ===== -->
        <div class="divider">
            <span class="divider-lock" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>
        </div>

        <!-- ===== IP INFO ===== -->
        <div class="ip-info" id="ipInfo">
            Mengecek IP Anda...
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="login-footer">v1.2 • DDT Secure Access</div>
    </div>

    <!-- ============================================================ -->
    <!-- SUPABASE CLIENT -->
    <!-- ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script>
        // ============================================================
        // KONFIGURASI SUPABASE BARU
        // ============================================================
        const SUPABASE_URL = 'https://vnmdtmlrfecremloqlmz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_VJdyDKMe_g-YL2BlYBuLCg_xm5RrSQ1';
        const DASHBOARD_URL = new URL('dashboard.html', window.location.href).href;
        const LOGIN_CALLBACK_URL = window.location.origin + window.location.pathname;
        const IP_CACHE_KEY = 'ddt_login_ip_cache_v1';
        const IP_CACHE_TTL_MS = 10 * 60 * 1000;

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY,
            {
                auth: {
                    flowType: 'pkce',
                    detectSessionInUrl: false,
                    persistSession: true,
                    autoRefreshToken: true,
                },
            }
        );

        console.log('Supabase client initialized');

        // ============================================================
        // ELEMEN DOM & STATE
        // ============================================================
        const loginBtn = document.getElementById('loginBtn');
        const spinner = document.getElementById('loadingSpinner');
        const errorMsg = document.getElementById('errorMsg');
        const ipInfo = document.getElementById('ipInfo');
        const statusMsg = document.getElementById('statusMessage');

        let currentPublicIP = null;
        let authProcessing = false;

        // ============================================================
        // HELPER UI
        // ============================================================
        function formatEmail(email) {
            return String(email || '').trim().toLowerCase();
        }

        function escapeHTML(value) {
            return String(value || '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function setLoading(isLoading, message = '') {
            loginBtn.disabled = isLoading;
            loginBtn.style.opacity = isLoading ? '0.5' : '1';
            spinner.style.display = isLoading ? 'block' : 'none';

            if (message) {
                statusMsg.textContent = message;
                statusMsg.classList.add('show');
            } else if (!isLoading) {
                statusMsg.classList.remove('show');
            }
        }

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }

        function clearError() {
            errorMsg.textContent = '';
            errorMsg.style.display = 'none';
        }

        async function logout() {
            try {
                await supabaseClient.auth.signOut();
            } catch (error) {
                console.error('Gagal logout:', error);
            } finally {
                sessionStorage.removeItem(IP_CACHE_KEY);
                window.location.href = new URL('.', window.location.href).href;
            }
        }

        // ============================================================
        // JAM
        // ============================================================
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            const timeEl = document.getElementById('clockTime');
            const dateEl = document.getElementById('clockDate');

            if (timeEl) {
                timeEl.textContent = `${hours}:${minutes}:${seconds}`;
            }

            if (dateEl) {
                const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                dateEl.textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
            }
        }

        // ============================================================
        // PARTIKEL
        // ============================================================
        function createParticles() {
            const container = document.getElementById('particles');
            if (!container || container.childElementCount > 0) return;

            const count = 18;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';

                const size = Math.random() * 4 + 2;
                const left = Math.random() * 100;
                const duration = Math.random() * 15 + 10;
                const delay = Math.random() * 20;
                const drift = (Math.random() - 0.5) * 80;

                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${left}%`;
                particle.style.setProperty('--drift', `${drift}px`);
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.opacity = Math.random() * 0.4 + 0.1;

                container.appendChild(particle);
            }
        }

        // ============================================================
        // POPUP AKSES DITOLAK — DASHBOARD v2.7.1 SYNC
        // ============================================================
        function showAccessDeniedPopup({ title, message, info }) {
            document.querySelectorAll('.access-denied-overlay').forEach(node => node.remove());

            const overlay = document.createElement('div');
            overlay.className = 'access-denied-overlay';
            overlay.id = 'accessDeniedOverlay';

            overlay.innerHTML = `
                <div class="access-denied-card" role="dialog" aria-modal="true" aria-labelledby="accessDeniedTitle">
                    <div class="access-denied-topline"></div>
                    <div class="access-denied-heading">
                        <div class="access-denied-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M12 3 2.7 19h18.6Z"/>
                                <path d="M12 9v4M12 17h.01"/>
                            </svg>
                        </div>
                        <div>
                            <div class="access-denied-eyebrow">SECURITY ACCESS</div>
                            <h2 id="accessDeniedTitle">${escapeHTML(title)}</h2>
                        </div>
                    </div>
                    <p class="access-denied-message">${message}</p>
                    <div class="access-denied-info">${info}</div>
                    <button class="access-denied-logout" id="deniedLogoutBtn" type="button">
                        <span class="access-denied-button-icon">
                            <svg viewBox="0 0 24 24">
                                <path d="M10 17l5-5-5-5"/>
                                <path d="M15 12H3"/>
                                <path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5"/>
                            </svg>
                        </span>
                        <span>Logout</span>
                    </button>
                </div>
            `;

            document.body.appendChild(overlay);
            document.getElementById('deniedLogoutBtn')?.addEventListener('click', logout);
        }

        function showNotRegisteredPopup(email) {
            showAccessDeniedPopup({
                title: 'Akses Ditolak',
                message: `Email <strong>${escapeHTML(formatEmail(email))}</strong> tidak terdaftar atau tidak aktif di sistem.`,
                info: '<strong>PS:</strong> Silakan hubungi <strong>CS LINE</strong> untuk pendaftaran atau aktivasi akun.',
            });
        }

        function showIPBlockedPopup(ip) {
            showAccessDeniedPopup({
                title: 'Akses Ditolak',
                message: `Terdeteksi akses dari IP yang berbeda (<strong>${escapeHTML(ip)}</strong>).`,
                info: 'IP saat ini tidak terdaftar sehingga dashboard tidak dapat diakses. Silakan hubungi <strong>CS LINE</strong> untuk memperbarui IP office.',
            });
        }

        // ============================================================
        // IP ACCESS — SINKRON DENGAN DASHBOARD v2.7.1
        // ============================================================
        function normalizeAccessRole(role) {
            return String(role || '')
                .trim()
                .toLowerCase()
                .replace(/[\s_-]+/g, '');
        }

        function roleBypassesIPGate(role) {
            const normalizedRole = normalizeAccessRole(role);
            return normalizedRole === 'leader' || normalizedRole === 'csline';
        }

        function parseWhitelistIPs(value) {
            return String(value || '0.0.0.0')
                .split(',')
                .map(ip => ip.trim())
                .filter(Boolean);
        }

        function evaluateIPAccess(role, userIP, whitelistValue) {
            if (roleBypassesIPGate(role)) {
                return { allowed: true, bypass: true, reason: 'role_bypass' };
            }

            const whitelistIPs = parseWhitelistIPs(whitelistValue);
            const whitelistDisabled =
                whitelistIPs.length === 0 ||
                whitelistIPs.includes('0.0.0.0') ||
                whitelistIPs.includes('*');

            if (whitelistDisabled) {
                return { allowed: true, bypass: false, reason: 'whitelist_disabled' };
            }

            const allowed = whitelistIPs.includes(String(userIP || '').trim());
            return {
                allowed,
                bypass: false,
                reason: allowed ? 'ip_match' : 'ip_mismatch'
            };
        }

        function readCachedIP() {
            try {
                const raw = sessionStorage.getItem(IP_CACHE_KEY);
                if (!raw) return null;

                const cached = JSON.parse(raw);
                if (!cached.ip || Date.now() >= cached.expiresAt) {
                    sessionStorage.removeItem(IP_CACHE_KEY);
                    return null;
                }

                return cached.ip;
            } catch {
                sessionStorage.removeItem(IP_CACHE_KEY);
                return null;
            }
        }

        async function getPublicIP({ forceFresh = false } = {}) {
            if (!forceFresh && currentPublicIP) {
                return currentPublicIP;
            }

            if (!forceFresh) {
                const cachedIP = readCachedIP();
                if (cachedIP) {
                    currentPublicIP = cachedIP;
                    return cachedIP;
                }
            }

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 7000);

            try {
                const response = await fetch('https://api.ipify.org?format=json', {
                    cache: 'no-store',
                    signal: controller.signal,
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                if (!data?.ip) throw new Error('Alamat IP tidak ditemukan');

                currentPublicIP = String(data.ip).trim();
                sessionStorage.setItem(IP_CACHE_KEY, JSON.stringify({
                    ip: currentPublicIP,
                    expiresAt: Date.now() + IP_CACHE_TTL_MS,
                }));

                return currentPublicIP;
            } finally {
                clearTimeout(timeoutId);
            }
        }

        function setIPInfo({ ip = '', status = '', blocked = false } = {}) {
            const safeIP = escapeHTML(ip);
            const statusClass = blocked ? 'status-blocked' : 'status-ok';
            ipInfo.innerHTML = `
                <span class="ip-label">IP</span>
                <strong>${safeIP}</strong>
                <span class="${statusClass}">${escapeHTML(status)}</span>
            `;
        }

        async function displayPublicIP() {
            ipInfo.textContent = 'Mengecek IP Anda...';

            try {
                const userIP = await getPublicIP();
                setIPInfo({
                    ip: userIP,
                    status: 'Siap diverifikasi',
                    blocked: false
                });
            } catch (error) {
                console.error('Gagal mengambil IP:', error);
                ipInfo.textContent = 'IP belum dapat dibaca. Akan dicoba kembali setelah login.';
            }
        }

        async function verifyIPAccess(role) {
            if (roleBypassesIPGate(role)) {
                // Leader dan CS Line tidak bergantung pada whitelist IP.
                // IP tetap ditampilkan jika tersedia, tetapi kegagalan layanan IP tidak memblokir role pemulihan.
                try {
                    const userIP = await getPublicIP({ forceFresh: true });
                    setIPInfo({
                        ip: userIP,
                        status: 'Akses pemulihan',
                        blocked: false
                    });
                    return { isAllowed: true, userIP, bypass: true };
                } catch (error) {
                    console.warn('IP tidak dapat dibaca, role pemulihan tetap diizinkan:', error);
                    ipInfo.textContent = 'Akses pemulihan aktif untuk role ini.';
                    return { isAllowed: true, userIP: '', bypass: true };
                }
            }

            // Untuk role lain, IP selalu dibaca fresh setelah autentikasi.
            const userIP = await getPublicIP({ forceFresh: true });

            const { data, error } = await supabaseClient
                .from('settings')
                .select('value')
                .eq('key', 'whitelist_ip')
                .maybeSingle();

            if (error) {
                throw new Error(`Gagal memeriksa whitelist IP: ${error.message}`);
            }

            const evaluation = evaluateIPAccess(
                role,
                userIP,
                data?.value || '0.0.0.0'
            );

            if (evaluation.allowed) {
                setIPInfo({
                    ip: userIP,
                    status: 'Terdaftar',
                    blocked: false
                });
            } else {
                setIPInfo({
                    ip: userIP,
                    status: 'Tidak terdaftar',
                    blocked: true
                });
            }

            return {
                isAllowed: evaluation.allowed,
                userIP,
                bypass: evaluation.bypass
            };
        }

        // ============================================================
        // VALIDASI USER — AMBIL ROLE UNTUK IP GATE
        // ============================================================
        async function getRegisteredUser(email) {
            const formattedEmail = formatEmail(email);
            if (!formattedEmail) return null;

            const { data, error } = await supabaseClient
                .from('users')
                .select('id,email,role,status')
                .eq('email', formattedEmail)
                .eq('status', 'active')
                .maybeSingle();

            if (error) {
                throw new Error(`Gagal memeriksa akun: ${error.message}`);
            }

            return data || null;
        }

        // ============================================================
        // VALIDASI SESSION, USER, ROLE, DAN IP SEBELUM DASHBOARD
        // ============================================================
        async function validateSessionAndRedirect(session) {
            if (authProcessing || !session?.user?.email) return false;

            authProcessing = true;
            clearError();
            setLoading(true, 'Memeriksa akun dan keamanan akses...');

            try {
                const registeredUser = await getRegisteredUser(session.user.email);

                if (!registeredUser) {
                    setLoading(false);
                    showNotRegisteredPopup(session.user.email);
                    return false;
                }

                const role = normalizeAccessRole(registeredUser.role);
                const { isAllowed, userIP, bypass } = await verifyIPAccess(role);

                if (!isAllowed) {
                    // Session sengaja tidak dihapus otomatis.
                    // User tetap berada di halaman login dan hanya dapat keluar melalui tombol Logout.
                    setLoading(false);
                    showIPBlockedPopup(userIP);
                    return false;
                }

                if (bypass) {
                    console.log('IP whitelist dilewati untuk role pemulihan:', role);
                }

                statusMsg.textContent = 'Login berhasil. Mengalihkan ke dashboard...';
                statusMsg.classList.add('show');
                window.location.replace(DASHBOARD_URL);
                return true;
            } catch (error) {
                console.error('Validasi login gagal:', error);
                showError(error.message);
                setLoading(false);
                return false;
            } finally {
                authProcessing = false;
            }
        }

        // ============================================================
        // PROSES CALLBACK PKCE DARI GOOGLE
        // ============================================================
        async function processOAuthCallback() {
            const params = new URLSearchParams(window.location.search);
            const oauthError = params.get('error_description') || params.get('error');
            const code = params.get('code');

            if (oauthError) {
                window.history.replaceState({}, document.title, window.location.pathname);
                showError(`Login Google dibatalkan atau gagal: ${oauthError}`);
                return null;
            }

            if (!code) return null;

            setLoading(true, 'Memproses login Google...');

            const { data, error } = await supabaseClient.auth.exchangeCodeForSession(code);
            window.history.replaceState({}, document.title, window.location.pathname);

            if (error) {
                throw new Error(`Gagal menyelesaikan login Google: ${error.message}`);
            }

            return data?.session || null;
        }

        // ============================================================
        // LOGIN WITH GOOGLE
        // ============================================================
        async function loginWithGoogle() {
            clearError();
            setLoading(true, 'Mengalihkan ke Google Login...');

            try {
                // IP hanya dibaca dari cache / layanan IP, tanpa query Supabase sebelum login.
                await getPublicIP();

                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: LOGIN_CALLBACK_URL,
                    },
                });

                if (error) throw error;
            } catch (error) {
                console.error('Login error:', error);
                showError(`Gagal login: ${error.message}`);
                setLoading(false);
            }
        }

        loginBtn.addEventListener('click', loginWithGoogle);

        // ============================================================
        // INIT
        // ============================================================
        async function init() {
            console.log('Dashboard Izin - Login Page');
            console.log('Callback URL:', LOGIN_CALLBACK_URL);
            console.log('Dashboard URL:', DASHBOARD_URL);

            createParticles();
            updateClock();
            setInterval(updateClock, 1000);
            displayPublicIP();

            try {
                const callbackSession = await processOAuthCallback();
                if (callbackSession) {
                    await validateSessionAndRedirect(callbackSession);
                    return;
                }

                const { data: { session }, error } = await supabaseClient.auth.getSession();
                if (error) throw error;

                if (session) {
                    await validateSessionAndRedirect(session);
                } else {
                    setLoading(false);
                }
            } catch (error) {
                console.error('Init login gagal:', error);
                showError(error.message);
                setLoading(false);
            }
        }

        document.addEventListener('DOMContentLoaded', init);

    </script>

</body>
