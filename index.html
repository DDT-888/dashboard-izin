<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Dashboard Izin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            background: #0a0e1a;
            overflow: hidden;
        }

        /* ========== BACKGROUND ========== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(rgba(0, 0, 0, 0.40), rgba(0, 0, 0, 0.40)),
                url('https://cdn.areabermain.club/assets/cdn/az1/2026/06/06/20260606/ae8c3495e13e910c466ef3e8c26d2b42/bg-piala-dunia-final.png') no-repeat center center;
            background-size: cover;
            z-index: 0;
            animation: bgFadeIn 1.2s ease-out;
        }

        @keyframes bgFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* ========== VIGNETTE ========== */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.15) 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* ========== OVERLAY UTAMA ========== */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 26, 0.35);
            z-index: 1;
            backdrop-filter: blur(1px);
        }

        /* ========== ANIMASI MASUK ========== */
        .login-container {
            background: rgba(13, 18, 48, 0.75);
            padding: 40px 45px 35px;
            border-radius: 23px;
            border: 1px solid rgba(0, 229, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 70px rgba(0, 200, 255, 0.08);
            max-width: 440px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
            animation: cardZoomIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: scale(0.95);
        }

        @keyframes cardZoomIn {
            0% {
                opacity: 0;
                transform: scale(0.92);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.03) 0%, transparent 70%);
            animation: rotateGlow 20s linear infinite;
            pointer-events: none;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========== GLOW BERGERAK DI BELAKANG LOGO ========== */
        .logo-glow {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            animation: glowMove 6s ease-in-out infinite alternate;
        }

        @keyframes glowMove {
            0% {
                transform: translate(-10px, -10px) scale(1);
                opacity: 0.4;
            }
            50% {
                transform: translate(10px, 5px) scale(1.2);
                opacity: 0.8;
            }
            100% {
                transform: translate(-5px, 15px) scale(0.9);
                opacity: 0.5;
            }
        }

        /* ========== LOGO - KIRI ATAS ========== */
        .login-logo {
            display: flex;
            justify-content: flex-start;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .login-logo .logo-img {
            max-width: 125px;
            height: auto;
            filter: drop-shadow(0 0 25px rgba(0, 229, 255, 0.08));
            transition: 0.3s;
            position: relative;
            z-index: 1;
        }

        .login-logo .logo-img:hover {
            filter: drop-shadow(0 0 40px rgba(0, 229, 255, 0.15));
            transform: scale(1.05);
        }

        /* ========== JAM ========== */
        .clock-container {
            position: fixed;
            top: 24px;
            right: 28px;
            z-index: 3;
            text-align: right;
            animation: fadeInClock 1s ease-out 0.5s forwards;
            opacity: 0;
        }

        @keyframes fadeInClock {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .clock-container .clock-time {
            font-size: 24px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.03);
        }

        .clock-container .clock-date {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 2px;
            margin-top: 2px;
            font-weight: 300;
        }

        /* ========== TITLE - TENGAH ========== */
        .login-title {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
            width: 100%;
        }

        .login-title h1 {
            font-size: 33px;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #00e5ff, #00b8d4, #7c4dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
            text-shadow: 0 0 60px rgba(0, 229, 255, 0.05);
            width: 100%;
            text-align: justify;
            text-align-last: justify;
        }

        .login-title .subtitle-main {
            font-size: 13px;
            color: rgba(0, 229, 255, 0.25);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 3px;
            font-weight: 300;
            text-align: right;
            padding-right: 2px;
        }

        /* ========== GOOGLE BUTTON ========== */
        .g-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 20px;
            background: rgba(0, 229, 255, 0.04);
            border: 1px solid rgba(0, 229, 255, 0.1);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .g-btn:hover {
            background: rgba(0, 229, 255, 0.08);
            border-color: rgba(0, 229, 255, 0.2);
            color: #00e5ff;
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.05);
            transform: translateY(-2px);
        }

        .g-btn:active {
            transform: scale(0.98);
        }

        .g-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .g-btn img {
            width: 24px;
            height: 24px;
        }

        .error-msg {
            color: #f44336;
            font-size: 14px;
            margin-top: 16px;
            display: none;
            background: rgba(244, 67, 54, 0.05);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(244, 67, 54, 0.05);
            position: relative;
            z-index: 1;
        }

        .loading-spinner {
            display: none;
            margin: 20px auto;
            border: 4px solid rgba(0, 229, 255, 0.05);
            border-top: 4px solid #00e5ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-message {
            margin-top: 16px;
            font-size: 14px;
            color: rgba(0, 229, 255, 0.4);
            display: none;
            position: relative;
            z-index: 1;
        }

        .status-message.show {
            display: block;
            animation: pulseText 1.5s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* ========== DIVIDER ========== */
        .login-container .divider {
            display: flex;
            align-items: center;
            margin: 28px 0 22px;
            position: relative;
            z-index: 1;
        }

        .login-container .divider::before,
        .login-container .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(0, 229, 255, 0.06);
        }

        .login-container .divider span {
            padding: 0 16px;
            color: rgba(0, 229, 255, 0.25);
            font-size: 15px;
        }

        /* ========== IP INFO ========== */
        .ip-info {
            margin-top: 22px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            padding: 10px 14px;
            background: rgba(0, 229, 255, 0.02);
            border-radius: 8px;
            border: 1px solid rgba(0, 229, 255, 0.04);
            position: relative;
            z-index: 1;
            word-break: break-all;
        }

        .ip-info .status-ok {
            color: #00e676;
            font-weight: 600;
        }

        .ip-info .status-blocked {
            color: #f44336;
            font-weight: 600;
        }

        /* ========== FOOTER ========== */
        .login-footer {
            margin-top: 22px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.12);
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        /* ========== CORNER DECORATIONS ========== */
        .login-container .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border-color: rgba(0, 229, 255, 0.04);
            border-style: solid;
            border-width: 0;
            pointer-events: none;
            z-index: 0;
        }
        .login-container .corner.tl {
            top: 12px;
            left: 12px;
            border-top-width: 1px;
            border-left-width: 1px;
            border-radius: 4px 0 0 0;
        }
        .login-container .corner.tr {
            top: 12px;
            right: 12px;
            border-top-width: 1px;
            border-right-width: 1px;
            border-radius: 0 4px 0 0;
        }
        .login-container .corner.bl {
            bottom: 12px;
            left: 12px;
            border-bottom-width: 1px;
            border-left-width: 1px;
            border-radius: 0 0 0 4px;
        }
        .login-container .corner.br {
            bottom: 12px;
            right: 12px;
            border-bottom-width: 1px;
            border-right-width: 1px;
            border-radius: 0 0 4px 0;
        }

        /* ========== PARTIKEL ========== */
        .particle {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            background: rgba(0, 229, 255, 0.12);
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(100vh) translateX(0px) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) translateX(var(--drift)) scale(1);
                opacity: 0;
            }
        }

        /* ========== NOT REGISTERED POPUP - PREMIUM THEME ========== */
        .not-registered-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: fadeInModal 0.5s ease;
        }

        @keyframes fadeInModal {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes premiumBounce {
            0% {
                opacity: 0;
                transform: scale(0.8) rotate(-2deg);
            }
            60% {
                transform: scale(1.02) rotate(0.5deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        @keyframes jackpotSpin {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(5deg) scale(1.05); }
            75% { transform: rotate(-5deg) scale(1.05); }
        }

        .not-registered-popup {
            background: linear-gradient(145deg, #0a0e1a, #0d1230, #1a0a2e);
            border-radius: 24px;
            padding: 40px 45px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 60px rgba(0, 229, 255, 0.08), 0 0 120px rgba(0, 229, 255, 0.03);
            border: 1px solid rgba(0, 229, 255, 0.12);
            position: relative;
            animation: premiumBounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden;
        }

        .not-registered-popup::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            right: -50%;
            bottom: -50%;
            background: radial-gradient(ellipse at center, rgba(0, 229, 255, 0.05) 0%, transparent 70%);
            pointer-events: none;
            animation: glowPulse 3s ease-in-out infinite;
        }

        .not-registered-popup .icon {
            font-size: 56px;
            margin-bottom: 8px;
            display: inline-block;
            animation: jackpotSpin 3s ease-in-out infinite;
        }

        .not-registered-popup h2 {
            color: #00e5ff;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
            letter-spacing: 1px;
        }

        .not-registered-popup p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .not-registered-popup p strong {
            color: #ffd54f;
        }

        .not-registered-popup .info-box {
            background: rgba(0, 229, 255, 0.05);
            border-left: 3px solid #00e5ff;
            padding: 12px 16px;
            border-radius: 8px;
            margin: 16px 0;
            text-align: left;
        }

        .not-registered-popup .info-box p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-bottom: 0;
        }

        .not-registered-popup .info-box p strong {
            color: #00e5ff;
        }

        .not-registered-popup .btn-close-popup {
            background: transparent;
            color: #00e5ff;
            border: 2px solid rgba(0, 229, 255, 0.25);
            padding: 10px 35px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 12px;
            width: 100%;
        }

        .not-registered-popup .btn-close-popup:hover {
            background: rgba(0, 229, 255, 0.08);
            border-color: #00e5ff;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.1);
            transform: translateY(-2px);
        }

        .not-registered-popup .btn-logout-popup {
            background: transparent;
            color: #ff6b6b;
            border: 2px solid rgba(255, 107, 107, 0.2);
            padding: 10px 35px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 8px;
            display: block;
            width: 100%;
        }

        .not-registered-popup .btn-logout-popup:hover {
            background: rgba(255, 107, 107, 0.08);
            border-color: rgba(255, 107, 107, 0.4);
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.05);
            transform: translateY(-2px);
        }

        .not-registered-popup .corner-deco {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: rgba(0, 229, 255, 0.08);
            border-style: solid;
            border-width: 0;
        }

        .not-registered-popup .corner-deco.tl {
            top: 16px;
            left: 16px;
            border-top-width: 2px;
            border-left-width: 2px;
            border-radius: 4px 0 0 0;
        }

        .not-registered-popup .corner-deco.tr {
            top: 16px;
            right: 16px;
            border-top-width: 2px;
            border-right-width: 2px;
            border-radius: 0 4px 0 0;
        }

        .not-registered-popup .corner-deco.bl {
            bottom: 16px;
            left: 16px;
            border-bottom-width: 2px;
            border-left-width: 2px;
            border-radius: 0 0 0 4px;
        }

        .not-registered-popup .corner-deco.br {
            bottom: 16px;
            right: 16px;
            border-bottom-width: 2px;
            border-right-width: 2px;
            border-radius: 0 0 4px 0;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 480px) {
            .login-container {
                padding: 28px 22px 28px;
                margin: 10px;
                border-radius: 20px;
            }
            .login-title h1 {
                font-size: 27px;
                letter-spacing: 3px;
            }
            .login-logo .logo-img {
                max-width: 90px;
            }
            .login-title {
                margin-bottom: 26px;
            }
            .login-title .subtitle-main {
                font-size: 11px;
                letter-spacing: 4px;
            }
            .g-btn {
                font-size: 14px;
                padding: 12px 16px;
            }
            .login-container .corner {
                width: 20px;
                height: 20px;
            }
            body::before {
                background-size: cover;
                background-position: center;
            }
            .login-container .divider {
                margin: 22px 0 18px;
            }
            .login-container .divider span {
                font-size: 13px;
            }
            .ip-info {
                margin-top: 18px;
            }
            .login-footer {
                margin-top: 18px;
                font-size: 10px;
            }
            .logo-glow {
                width: 80px;
                height: 80px;
                top: 5px;
                left: 5px;
            }
            .clock-container {
                top: 16px;
                right: 18px;
            }
            .clock-container .clock-time {
                font-size: 18px;
            }
            .clock-container .clock-date {
                font-size: 9px;
            }
            .not-registered-popup {
                padding: 30px 25px;
                margin: 15px;
            }
            .not-registered-popup .icon {
                font-size: 44px;
            }
            .not-registered-popup h2 {
                font-size: 20px;
            }
            .not-registered-popup .btn-close-popup,
            .not-registered-popup .btn-logout-popup {
                padding: 8px 20px;
                font-size: 12px;
            }
        }

        @media (max-width: 380px) {
            .login-container {
                padding: 20px 16px 20px;
                border-radius: 18px;
            }
            .login-title h1 {
                font-size: 23px;
                letter-spacing: 2px;
            }
            .login-logo .logo-img {
                max-width: 75px;
            }
            .login-logo {
                margin-bottom: 18px;
            }
            .login-title {
                margin-bottom: 22px;
            }
            .login-title .subtitle-main {
                font-size: 10px;
                letter-spacing: 3px;
            }
            .g-btn {
                font-size: 12px;
                padding: 10px 12px;
                gap: 8px;
            }
            .g-btn img {
                width: 20px;
                height: 20px;
            }
            .ip-info {
                font-size: 10px;
                padding: 8px 10px;
            }
            .login-container .divider span {
                font-size: 11px;
            }
            .logo-glow {
                width: 60px;
                height: 60px;
                top: 5px;
                left: 5px;
            }
            .clock-container {
                top: 12px;
                right: 14px;
            }
            .clock-container .clock-time {
                font-size: 15px;
            }
            .clock-container .clock-date {
                font-size: 8px;
            }
            .login-footer {
                font-size: 9px;
            }
            .not-registered-popup {
                padding: 24px 18px;
            }
            .not-registered-popup .icon {
                font-size: 36px;
            }
            .not-registered-popup h2 {
                font-size: 18px;
            }
            .not-registered-popup p {
                font-size: 12px;
            }
            .not-registered-popup .btn-close-popup,
            .not-registered-popup .btn-logout-popup {
                padding: 6px 16px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== VIGNETTE ===== -->
    <div class="vignette"></div>

    <!-- ===== JAM ===== -->
    <div class="clock-container" id="clockContainer">
        <div class="clock-time" id="clockTime">--:--:--</div>
        <div class="clock-date" id="clockDate">Loading...</div>
    </div>

    <!-- ===== PARTIKEL ===== -->
    <div id="particles"></div>

    <div class="login-container">
        <!-- Corner Decorations -->
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <!-- Glow Bergerak -->
        <div class="logo-glow"></div>

        <!-- ===== LOGO - KIRI ATAS ===== -->
        <div class="login-logo">
            <img src="https://cdn.areabermain.club/assets/cdn/az1/2026/07/08/20260708/8a08b19ab55c1f8c92bb0404eb934a1f/image-photoroom.png" alt="DDT" class="logo-img" />
        </div>

        <!-- ===== TITLE - TENGAH ===== -->
        <div class="login-title">
            <h1>DASHBOARD DDT</h1>
            <div class="subtitle-main">Our Site • Our Pride</div>
        </div>

        <!-- ===== GOOGLE BUTTON ===== -->
        <button class="g-btn" id="loginBtn">
            <img src="https://www.google.com/favicon.ico" alt="Google" />
            Login dengan Google
        </button>

        <div class="loading-spinner" id="loadingSpinner"></div>
        <div class="status-message" id="statusMessage">⏳ Mengalihkan ke dashboard...</div>
        <div class="error-msg" id="errorMsg"></div>

        <!-- ===== DIVIDER ===== -->
        <div class="divider">
            <span>🔒</span>
        </div>

        <!-- ===== IP INFO ===== -->
        <div class="ip-info" id="ipInfo">
            🔍 Mengecek IP Anda...
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="login-footer">v1.1 • Shark Engine</div>
    </div>

    <!-- ============================================================ -->
    <!-- SUPABASE CLIENT -->
    <!-- ============================================================ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script>
        // ============================================================
        // KONFIGURASI SUPABASE BARU
        // ============================================================
        const SUPABASE_URL = 'https://vnmdtmlrfecremloqlmz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_VJdyDKMe_g-YL2BlYBuLCg_xm5RrSQ1';
        const DASHBOARD_URL = new URL('dashboard.html', window.location.href).href;
        const LOGIN_CALLBACK_URL = window.location.origin + window.location.pathname;
        const IP_CACHE_KEY = 'ddt_login_ip_cache_v1';
        const IP_CACHE_TTL_MS = 10 * 60 * 1000;

        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY,
            {
                auth: {
                    flowType: 'pkce',
                    detectSessionInUrl: false,
                    persistSession: true,
                    autoRefreshToken: true,
                },
            }
        );

        console.log('🚀 Supabase client initialized');

        // ============================================================
        // ELEMEN DOM & STATE
        // ============================================================
        const loginBtn = document.getElementById('loginBtn');
        const spinner = document.getElementById('loadingSpinner');
        const errorMsg = document.getElementById('errorMsg');
        const ipInfo = document.getElementById('ipInfo');
        const statusMsg = document.getElementById('statusMessage');

        let currentPublicIP = null;
        let authProcessing = false;

        // ============================================================
        // HELPER UI
        // ============================================================
        function formatEmail(email) {
            return String(email || '').trim().toLowerCase();
        }

        function escapeHTML(value) {
            return String(value || '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function setLoading(isLoading, message = '') {
            loginBtn.disabled = isLoading;
            loginBtn.style.opacity = isLoading ? '0.5' : '1';
            spinner.style.display = isLoading ? 'block' : 'none';

            if (message) {
                statusMsg.textContent = message;
                statusMsg.classList.add('show');
            } else if (!isLoading) {
                statusMsg.classList.remove('show');
            }
        }

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }

        function clearError() {
            errorMsg.textContent = '';
            errorMsg.style.display = 'none';
        }

        async function logout() {
            try {
                await supabaseClient.auth.signOut();
            } catch (error) {
                console.error('Gagal logout:', error);
            } finally {
                sessionStorage.removeItem(IP_CACHE_KEY);
                window.location.href = new URL('.', window.location.href).href;
            }
        }

        // ============================================================
        // JAM
        // ============================================================
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            const timeEl = document.getElementById('clockTime');
            const dateEl = document.getElementById('clockDate');

            if (timeEl) {
                timeEl.textContent = `${hours}:${minutes}:${seconds}`;
            }

            if (dateEl) {
                const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                dateEl.textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;
            }
        }

        // ============================================================
        // PARTIKEL
        // ============================================================
        function createParticles() {
            const container = document.getElementById('particles');
            if (!container || container.childElementCount > 0) return;

            const count = 18;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';

                const size = Math.random() * 4 + 2;
                const left = Math.random() * 100;
                const duration = Math.random() * 15 + 10;
                const delay = Math.random() * 20;
                const drift = (Math.random() - 0.5) * 80;

                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${left}%`;
                particle.style.setProperty('--drift', `${drift}px`);
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.opacity = Math.random() * 0.4 + 0.1;

                container.appendChild(particle);
            }
        }

        // ============================================================
        // POPUP AKSES DITOLAK
        // ============================================================
        function showAccessDeniedPopup({ title, message, info }) {
            const oldOverlay = document.getElementById('notRegisteredOverlay');
            if (oldOverlay) oldOverlay.remove();

            const overlay = document.createElement('div');
            overlay.className = 'not-registered-overlay';
            overlay.id = 'notRegisteredOverlay';

            overlay.innerHTML = `
                <div class="not-registered-popup">
                    <span class="corner-deco tl"></span>
                    <span class="corner-deco tr"></span>
                    <span class="corner-deco bl"></span>
                    <span class="corner-deco br"></span>
                    <div class="icon">🚫</div>
                    <h2>${escapeHTML(title)}</h2>
                    <p>${message}</p>
                    <div class="info-box">
                        <p>${info}</p>
                    </div>
                    <button class="btn-logout-popup" id="deniedLogoutBtn">🚪 Logout</button>
                </div>
            `;

            document.body.appendChild(overlay);
            document.getElementById('deniedLogoutBtn')?.addEventListener('click', logout);
        }

        function showNotRegisteredPopup(email) {
            showAccessDeniedPopup({
                title: '⚠️ Akses Ditolak',
                message: `Email <strong>${escapeHTML(formatEmail(email))}</strong> tidak terdaftar atau tidak aktif di sistem.`,
                info: '💡 <strong>PS:</strong> Silakan hubungi <strong>CS LINE</strong> untuk pendaftaran atau aktivasi akun.',
            });
        }

        function showIPBlockedPopup(ip) {
            showAccessDeniedPopup({
                title: '⚠️ IP Tidak Diizinkan',
                message: `IP <strong>${escapeHTML(ip)}</strong> tidak terdaftar dalam whitelist.`,
                info: '💡 Silakan hubungi <strong>CS LINE</strong> atau administrator untuk mendaftarkan IP ini.',
            });
        }

        // ============================================================
        // IP — SATU KALI, DISIMPAN 10 MENIT DI SESSIONSTORAGE
        // ============================================================
        function readCachedIP() {
            try {
                const raw = sessionStorage.getItem(IP_CACHE_KEY);
                if (!raw) return null;

                const cached = JSON.parse(raw);
                if (!cached.ip || Date.now() >= cached.expiresAt) {
                    sessionStorage.removeItem(IP_CACHE_KEY);
                    return null;
                }
                return cached.ip;
            } catch {
                sessionStorage.removeItem(IP_CACHE_KEY);
                return null;
            }
        }

        async function getPublicIP() {
            if (currentPublicIP) return currentPublicIP;

            const cachedIP = readCachedIP();
            if (cachedIP) {
                currentPublicIP = cachedIP;
                return cachedIP;
            }

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 7000);

            try {
                const response = await fetch('https://api.ipify.org?format=json', {
                    cache: 'no-store',
                    signal: controller.signal,
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                if (!data?.ip) throw new Error('Alamat IP tidak ditemukan');

                currentPublicIP = data.ip;
                sessionStorage.setItem(IP_CACHE_KEY, JSON.stringify({
                    ip: data.ip,
                    expiresAt: Date.now() + IP_CACHE_TTL_MS,
                }));
                return data.ip;
            } finally {
                clearTimeout(timeoutId);
            }
        }

        async function displayPublicIP() {
            ipInfo.textContent = '🔍 Mengecek IP Anda...';
            try {
                const userIP = await getPublicIP();
                ipInfo.innerHTML = `📡 IP: <strong>${escapeHTML(userIP)}</strong> <span class="status-ok">✅ Siap diverifikasi</span>`;
            } catch (error) {
                console.error('Gagal mengambil IP:', error);
                ipInfo.textContent = '⚠️ IP belum dapat dibaca. Akan dicoba kembali setelah login.';
            }
        }

        // Query whitelist hanya dilakukan setelah pengguna terautentikasi.
        async function verifyIPAccess() {
            const userIP = await getPublicIP();
            const { data, error } = await supabaseClient
                .from('settings')
                .select('value')
                .eq('key', 'whitelist_ip')
                .maybeSingle();

            if (error) {
                throw new Error(`Gagal memeriksa whitelist IP: ${error.message}`);
            }

            const whitelistIPs = String(data?.value || '0.0.0.0')
                .split(',')
                .map(ip => ip.trim())
                .filter(Boolean);

            const whitelistDisabled = whitelistIPs.length === 0 || whitelistIPs.includes('0.0.0.0') || whitelistIPs.includes('*');
            const isAllowed = whitelistDisabled || whitelistIPs.includes(userIP);

            if (isAllowed) {
                ipInfo.innerHTML = `📡 IP: <strong>${escapeHTML(userIP)}</strong> <span class="status-ok">✅ Terdaftar</span>`;
            } else {
                ipInfo.innerHTML = `📡 IP: <strong>${escapeHTML(userIP)}</strong> <span class="status-blocked">⛔ Tidak terdaftar</span>`;
            }

            return { isAllowed, userIP };
        }

        // ============================================================
        // VALIDASI USER — HANYA SATU BARIS/KOLUMN YANG DIBUTUHKAN
        // ============================================================
        async function checkUserRegistered(email) {
            const formattedEmail = formatEmail(email);
            if (!formattedEmail) return false;

            const { data, error } = await supabaseClient
                .from('users')
                .select('id')
                .eq('email', formattedEmail)
                .eq('status', 'active')
                .maybeSingle();

            if (error) {
                throw new Error(`Gagal memeriksa akun: ${error.message}`);
            }

            return Boolean(data?.id);
        }

        // ============================================================
        // VALIDASI SESSION, USER, DAN IP SEBELUM MASUK DASHBOARD
        // ============================================================
        async function validateSessionAndRedirect(session) {
            if (authProcessing || !session?.user?.email) return false;
            authProcessing = true;
            clearError();
            setLoading(true, '⏳ Memeriksa akun dan keamanan akses...');

            try {
                const isRegistered = await checkUserRegistered(session.user.email);
                if (!isRegistered) {
                    setLoading(false);
                    showNotRegisteredPopup(session.user.email);
                    return false;
                }

                const { isAllowed, userIP } = await verifyIPAccess();
                if (!isAllowed) {
                    await supabaseClient.auth.signOut();
                    setLoading(false);
                    showIPBlockedPopup(userIP);
                    return false;
                }

                statusMsg.textContent = '✅ Login berhasil! Mengalihkan ke dashboard...';
                statusMsg.classList.add('show');
                window.location.replace(DASHBOARD_URL);
                return true;
            } catch (error) {
                console.error('Validasi login gagal:', error);
                showError(`❌ ${error.message}`);
                setLoading(false);
                return false;
            } finally {
                authProcessing = false;
            }
        }

        // ============================================================
        // PROSES CALLBACK PKCE DARI GOOGLE
        // ============================================================
        async function processOAuthCallback() {
            const params = new URLSearchParams(window.location.search);
            const oauthError = params.get('error_description') || params.get('error');
            const code = params.get('code');

            if (oauthError) {
                window.history.replaceState({}, document.title, window.location.pathname);
                showError(`❌ Login Google dibatalkan atau gagal: ${oauthError}`);
                return null;
            }

            if (!code) return null;

            setLoading(true, '⏳ Memproses login Google...');

            const { data, error } = await supabaseClient.auth.exchangeCodeForSession(code);
            window.history.replaceState({}, document.title, window.location.pathname);

            if (error) {
                throw new Error(`Gagal menyelesaikan login Google: ${error.message}`);
            }

            return data?.session || null;
        }

        // ============================================================
        // LOGIN WITH GOOGLE
        // ============================================================
        async function loginWithGoogle() {
            clearError();
            setLoading(true, '⏳ Mengalihkan ke Google Login...');

            try {
                // IP hanya dibaca dari cache / layanan IP, tanpa query Supabase sebelum login.
                await getPublicIP();

                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: LOGIN_CALLBACK_URL,
                    },
                });

                if (error) throw error;
            } catch (error) {
                console.error('Login error:', error);
                showError(`❌ Gagal login: ${error.message}`);
                setLoading(false);
            }
        }

        loginBtn.addEventListener('click', loginWithGoogle);

        // ============================================================
        // INIT
        // ============================================================
        async function init() {
            console.log('🚀 Dashboard Izin - Login Page');
            console.log('📍 Callback URL:', LOGIN_CALLBACK_URL);
            console.log('🔗 Dashboard URL:', DASHBOARD_URL);

            createParticles();
            updateClock();
            setInterval(updateClock, 1000);
            displayPublicIP();

            try {
                const callbackSession = await processOAuthCallback();
                if (callbackSession) {
                    await validateSessionAndRedirect(callbackSession);
                    return;
                }

                const { data: { session }, error } = await supabaseClient.auth.getSession();
                if (error) throw error;

                if (session) {
                    await validateSessionAndRedirect(session);
                } else {
                    setLoading(false);
                }
            } catch (error) {
                console.error('Init login gagal:', error);
                showError(`❌ ${error.message}`);
                setLoading(false);
            }
        }

        document.addEventListener('DOMContentLoaded', init);

    </script>

</body>
</html>
